<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hanami Voxel Garden</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17283a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17283a);
    scene.fog = new THREE.Fog(0x17283a, 34, 72);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.OrthographicCamera(-17, 17, 11, -11, 0.1, 150);
    const camTarget = new THREE.Vector3(0, 4.2, 0);
    let cameraAzimuth = 0.72;
    let cameraRadius = 34;
    let cameraHeight = 21;
    let dragging = false, lastX = 0, lastY = 0;

    const C = {
      grass: 0x4b9c68, grass2: 0x64b777, grassDark: 0x2e6e57,
      earth: 0x754f49, earth2: 0x9b6657, moss: 0x397b5d,
      wood: 0x75402e, woodLight: 0xaa6340, bark: 0x513b36,
      cream: 0xffddb0, cream2: 0xffc68e, ink: 0x273c5a,
      vermilion: 0xd95045, vermilion2: 0xf27956, roof: 0x263d58,
      roof2: 0x41627c, gold: 0xffc35d, lotus: 0xff9ebb,
      blossom: 0xffb7c8, blossom2: 0xffd5d6, blossom3: 0xef789f,
      water: 0x3d9fb0, water2: 0x72d0c0, stone: 0x9dabb0,
      stoneDark: 0x647b83, bamboo: 0xb5c65e, lantern: 0xffe59a,
    };
    const matCache = new Map();
    function mat(color, opts = {}) {
      const key = color + JSON.stringify(opts);
      if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: .88, metalness: .02, ...opts }));
      return matCache.get(key);
    }
    function voxel(x, y, z, w, h, d, color, opts = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
      mesh.position.set(x, y, z);
      mesh.castShadow = opts.castShadow !== false;
      mesh.receiveShadow = opts.receiveShadow !== false;
      scene.add(mesh);
      return mesh;
    }
    function groupedVoxel(group, x, y, z, w, h, d, color, opts = {}) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts));
      mesh.position.set(x, y, z);
      mesh.castShadow = opts.castShadow !== false;
      mesh.receiveShadow = opts.receiveShadow !== false;
      group.add(mesh);
      return mesh;
    }
    function pillar(group, x, z, y0, height, color = C.wood) {
      groupedVoxel(group, x, y0 + height / 2, z, .42, height, .42, color);
      groupedVoxel(group, x, y0 + height - .18, z, .56, .18, .56, C.gold);
    }
    function roof(group, y, width, depth, palette = [C.roof, C.roof2]) {
      groupedVoxel(group, 0, y, 0, width, .27, depth, palette[0]);
      groupedVoxel(group, 0, y + .22, 0, width - .62, .22, depth - .62, palette[1]);
      groupedVoxel(group, 0, y + .41, 0, width - 1.32, .18, depth - 1.32, palette[0]);
      groupedVoxel(group, 0, y + .56, 0, width - 2.0, .15, depth - 2.0, palette[1]);
      // bright squared-off eaves and curled roof corners
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        groupedVoxel(group, sx * (width / 2 + .18), y + .09, sz * (depth / 2 + .18), .38, .24, .38, C.vermilion2);
        groupedVoxel(group, sx * (width / 2 + .46), y + .22, sz * (depth / 2 + .46), .32, .18, .32, C.gold);
      }
      groupedVoxel(group, 0, y + .9, 0, .34, .6, .34, C.vermilion);
      groupedVoxel(group, 0, y + 1.28, 0, .78, .15, .78, C.gold);
      groupedVoxel(group, 0, y + 1.42, 0, .19, .8, .19, C.gold);
    }

    // Diorama foundation, with stepped grassy edges and warm strata.
    voxel(0, -.72, 0, 32, 1.4, 24, C.earth, { castShadow: false });
    voxel(0, -.03, 0, 30.8, .28, 22.8, C.grass, { castShadow: false });
    for (let x = -14; x <= 14; x += 2) {
      voxel(x, -.48, -11.8, 1.8, .55, .8, x % 4 === 0 ? C.grass2 : C.moss);
      voxel(x, -.48, 11.8, 1.8, .55, .8, x % 4 === 0 ? C.moss : C.grass2);
    }
    for (let z = -10; z <= 10; z += 2) {
      voxel(-15.4, -.48, z, .8, .55, 1.8, z % 4 === 0 ? C.grass2 : C.moss);
      voxel(15.4, -.48, z, .8, .55, 1.8, z % 4 === 0 ? C.moss : C.grass2);
    }

    // Patchwork grass tiles establish the deliberately voxelized ground texture.
    const groundPatches = [
      [-11, -7, 3, 2, C.grass2], [-8, 8, 4, 2, C.grassDark], [10, -7, 3, 3, C.grass2],
      [12, 7, 3, 2, C.grassDark], [-13, 4, 2, 3, C.grassDark], [6, -9, 3, 1, C.grass2],
      [-3, -9, 2, 2, C.grass2], [12, 0, 2, 2, C.grass2], [-11, 1, 3, 2, C.grassDark]
    ];
    groundPatches.forEach(([x,z,w,d,c]) => voxel(x, .14, z, w, .16, d, c));

    // A blue-green pond and a tiny red bridge in the foreground.
    voxel(7.5, .24, 4.7, 7.2, .18, 5.0, C.water, { roughness: .45 });
    voxel(7.5, .35, 4.7, 6.4, .06, 4.2, C.water2, { roughness: .3 });
    for (const p of [[5.1,3.2],[9.8,3.4],[6.0,6.3],[9.6,6.0]]) voxel(p[0], .42, p[1], .45, .12, .34, C.lotus);
    for (const x of [5.3, 6.3, 7.3, 8.3, 9.3]) voxel(x, .75, 4.65, .72, .18, .62, C.vermilion2);
    voxel(7.3, 1.0, 4.65, 5.5, .22, .5, C.wood);
    for (const x of [5.2, 6.2, 7.2, 8.2, 9.2]) voxel(x, 1.25, 4.65, .18, .35, .2, C.gold);

    // Pale stepping stones make a diagonal approach to the pagoda.
    [[-7,7],[-5.8,5.9],[-4.4,4.8],[-3.1,3.7],[-2.2,2.4]].forEach(([x,z],i) => {
      voxel(x, .32 + (i % 2) * .06, z, 1.15, .22, .82, i % 2 ? C.stone : C.stoneDark);
    });
    [[-10,8],[-8.7,8.7],[10,-8],[11,-8.9],[-13,-3],[12,2]].forEach(([x,z]) => voxel(x, .42, z, .6, .45, .58, C.stoneDark));

    // Pagoda: a warm central tower with five stacked, jewel-colored roofs.
    const pagoda = new THREE.Group();
    scene.add(pagoda);
    pagoda.position.set(-1.25, 0, -1.1);
    groupedVoxel(pagoda, 0, .58, 0, 5.7, .5, 5.3, C.stoneDark);
    groupedVoxel(pagoda, 0, .88, 0, 5.2, .22, 4.8, C.gold);
    // entrance plinth and steps
    groupedVoxel(pagoda, 0, 1.25, 2.58, 2.2, .3, .85, C.stone);
    groupedVoxel(pagoda, 0, 1.05, 3.0, 2.8, .18, .65, C.stoneDark);
    groupedVoxel(pagoda, 0, 1.88, 2.52, 1.25, 1.5, .26, C.ink);
    groupedVoxel(pagoda, 0, 1.95, 2.36, .8, 1.36, .18, C.vermilion2);
    groupedVoxel(pagoda, 0, 2.68, 2.24, 1.46, .16, .24, C.gold);

    const levels = [
      { y: 1.25, h: 2.0, w: 4.15, d: 3.65, roofY: 3.22, rw: 6.6, rd: 5.45 },
      { y: 3.65, h: 2.0, w: 3.55, d: 3.1, roofY: 5.62, rw: 5.75, rd: 4.75 },
      { y: 6.05, h: 1.92, w: 3.05, d: 2.72, roofY: 7.88, rw: 5.05, rd: 4.18 },
      { y: 8.32, h: 1.8, w: 2.55, d: 2.35, roofY: 10.03, rw: 4.35, rd: 3.62 },
      { y: 10.47, h: 1.65, w: 2.05, d: 1.95, roofY: 12.06, rw: 3.75, rd: 3.15 },
    ];
    levels.forEach((l, idx) => {
      groupedVoxel(pagoda, 0, l.y + l.h / 2, 0, l.w, l.h, l.d, idx % 2 ? C.cream : C.cream2);
      // dark inset windows visible on all four faces
      const wh = Math.max(.58, l.h * .35), ww = Math.max(.46, l.w * .22);
      groupedVoxel(pagoda, 0, l.y + l.h * .53, l.d/2 + .012, ww, wh, .06, C.ink);
      groupedVoxel(pagoda, 0, l.y + l.h * .53, -l.d/2 - .012, ww, wh, .06, C.ink);
      groupedVoxel(pagoda, l.w/2 + .012, l.y + l.h * .53, 0, .06, wh, ww, C.ink);
      groupedVoxel(pagoda, -l.w/2 - .012, l.y + l.h * .53, 0, .06, wh, ww, C.ink);
      // four red vertical corner posts
      for (const sx of [-1,1]) for (const sz of [-1,1]) pillar(pagoda, sx*(l.w/2-.22), sz*(l.d/2-.22), l.y, l.h, idx === 0 ? C.vermilion : C.woodLight);
      groupedVoxel(pagoda, 0, l.y + .12, 0, l.w + .25, .14, l.d + .25, C.wood);
      roof(pagoda, l.roofY, l.rw, l.rd, idx % 2 ? [C.roof2, C.roof] : [C.roof, C.roof2]);
    });
    groupedVoxel(pagoda, 0, 13.78, 0, .33, .55, .33, C.gold);
    groupedVoxel(pagoda, 0, 14.15, 0, 1.05, .16, 1.05, C.gold);
    groupedVoxel(pagoda, 0, 14.8, 0, .17, 1.25, .17, C.vermilion2);
    groupedVoxel(pagoda, 0, 15.45, 0, .65, .15, .65, C.gold);

    // Curved-in-spirit voxel cherry blossom trees.
    const blossomGroups = [];
    function blossomTree(x, z, scale = 1, phase = 0) {
      const g = new THREE.Group(); scene.add(g); blossomGroups.push({g, phase});
      const s = scale;
      const trunk = (xx, yy, zz, ww, hh, dd, col=C.wood) => groupedVoxel(g, x + xx*s, yy*s, z + zz*s, ww*s, hh*s, dd*s, col);
      for (let i=0;i<5;i++) trunk(0, .7 + i*.95, 0, .62, 1.05, .62, i < 2 ? C.wood : C.woodLight);
      trunk(-.55, 4.1, 0, .46, 2.0, .46); trunk(.6, 4.55, .15, .42, 1.6, .42);
      trunk(-1.02, 5.3, .08, .36, 1.25, .36); trunk(1.15, 5.4, .22, .34, 1.35, .34);
      trunk(.15, 5.75, -.05, .4, 1.2, .4);
      const clusters = [
        [-1.15,6.0,.15,1.45,C.blossom],[-.55,6.7,0,1.1,C.blossom2],[.35,6.25,.2,1.5,C.blossom],
        [1.28,6.2,.3,1.22,C.blossom3],[1.65,5.55,.2,.9,C.blossom2],[-1.55,5.35,0,.9,C.blossom3],
        [.15,7.08,-.1,.76,C.blossom3]
      ];
      clusters.forEach(([xx,yy,zz,r,c],ci) => {
        const n = Math.max(4, Math.floor(7*s));
        for (let i=0;i<n;i++) {
          const a = i * 2.399 + ci;
          const rr = r * (.45 + (i%3)*.17);
          const puff = groupedVoxel(g, x + (xx + Math.cos(a)*rr)*s, (yy + Math.sin(a*1.7)*rr*.42)*s, z + (zz + Math.sin(a)*rr)*s, (.72 + (i%2)*.18)*s, (.72 + (i%3)*.13)*s, (.72 + (i%2)*.18)*s, c);
          puff.userData.sway = (i%2 ? 1 : -1) * (.006 + .004*scale);
        }
      });
      // a few individual pink pixels falling from the canopy
      for (let i=0;i<4;i++) groupedVoxel(g, x + (-1.5+i*.9)*s, (5.0+(i%2)*.7)*s, z + (1.4-i*.42)*s, .18*s,.18*s,.18*s, C.blossom2);
      return g;
    }
    blossomTree(-10.9, -4.9, 1.02, .2);
    blossomTree(10.6, -5.7, .83, 1.5);
    blossomTree(-10.8, 6.4, .72, 2.4);
    blossomTree(11.5, 7.1, .65, 3.3);

    // Dark green pines provide contrast behind the pink canopies.
    function pine(x,z,s=1) {
      const g = new THREE.Group(); scene.add(g);
      groupedVoxel(g,x,.9*s,z,.55*s,1.8*s,.55*s,C.bark);
      [[1.9,2.7,.95],[2.9,2.15,1.25],[3.8,1.55,1.55]].forEach(([y,h,w],i)=>{
        groupedVoxel(g,x,y*s,z,w*s,h*s,w*s,i%2?C.grassDark:C.moss);
        groupedVoxel(g,x,y*s+.25*s,z,w*.68*s,.26*s,w*.68*s,C.grass2);
      });
    }
    pine(13,-1.8,.86); pine(-13,-.6,.74); pine(5.8,-9,.75); pine(-5.8,9,.7);

    // Bamboo grove: slim, bright, and rhythmic near the pond.
    for (let i=0;i<8;i++) {
      const x = 11.3 + (i%3)*.62, z = 3.0 + Math.floor(i/3)*.58;
      voxel(x, 2.05, z, .18, 3.85, .18, C.bamboo);
      for (let y=1.0;y<4;y+=.8) voxel(x, y, z, .24, .07, .24, C.grassDark);
      voxel(x + .35, 3.9, z + .05, .13, 1.55, .13, C.bamboo);
    }

    // Four lanterns, each with a blocky cap and a warm emissive window.
    function lantern(x,z,scale=1) {
      const g = new THREE.Group(); scene.add(g);
      groupedVoxel(g,x,.65,z,.65*scale,.35*scale,.65*scale,C.stoneDark);
      groupedVoxel(g,x,1.65*scale,z,.22*scale,1.85*scale,.22*scale,C.bark);
      groupedVoxel(g,x,2.55*scale,z,.72*scale,.25*scale,.72*scale,C.roof);
      groupedVoxel(g,x,2.85*scale,z,.53*scale,.38*scale,.53*scale,C.lantern,{emissive:0xffb444,emissiveIntensity:1.1});
      groupedVoxel(g,x,3.12*scale,z,.72*scale,.22*scale,.72*scale,C.roof2);
      groupedVoxel(g,x,3.34*scale,z,.18*scale,.34*scale,.18*scale,C.gold);
    }
    lantern(-6.8, 4.6, .72); lantern(5.1,-2.3,.62); lantern(-4.3,-7.7,.6); lantern(7.4,8.3,.63);

    // Tiny flowers, grass blades, and garden accents.
    [[-7,-4],[4,7],[-7,9],[8,-7],[3,-7],[-12,1],[12,5],[-4,7]].forEach(([x,z],i)=>{
      voxel(x,.53,z,.13,.9,.13,C.grassDark);
      voxel(x+.18,.9,z,.27,.27,.27,[C.lotus,C.gold,C.blossom3][i%3]);
      voxel(x-.18,.9,z,.27,.27,.27,[C.gold,C.blossom3,C.lotus][i%3]);
    });
    [[-2,7,1.0],[-3.3,7.7,.7],[4.4,8.2,.85],[13,9,.65]].forEach(([x,z,s])=>{
      voxel(x,.52,z,.9*s,.7*s,.9*s,C.stone);
      voxel(x+.28*s,.85*s,z+.18*s,.55*s,.45*s,.52*s,C.stoneDark);
    });

    // A sparse cloud of decorative firefly voxels gives the garden a little magic.
    const fireflies = [];
    [[-8,5,-2],[8,5,-4],[-5,6,5],[7,4,7],[2,7,-5],[-12,4,3],[12,6,-2]].forEach(([x,y,z],i)=>{
      const f = voxel(x,y,z,.14,.14,.14,i%2?C.gold:C.lotus,{emissive:i%2?0xffa33d:0xffb8db,emissiveIntensity:1.35});
      fireflies.push({f, base:y, phase:i*.9});
    });

    // Lighting keeps colors saturated while preserving readable voxel faces.
    scene.add(new THREE.HemisphereLight(0xffd5c1, 0x24445a, 2.2));
    const sun = new THREE.DirectionalLight(0xffdfb5, 3.7);
    sun.position.set(-18, 30, 12); sun.castShadow = true; sun.shadow.mapSize.set(1536,1536);
    sun.shadow.camera.left = -24; sun.shadow.camera.right = 24; sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24; sun.shadow.camera.near = 1; sun.shadow.camera.far = 70;
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0x74c4e6, 1.2); rim.position.set(14, 13, -20); scene.add(rim);

    function resize() {
      const aspect = innerWidth / innerHeight;
      const view = 11.4;
      camera.left = -view * aspect; camera.right = view * aspect; camera.top = view; camera.bottom = -view;
      camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize); resize();
    function updateCamera() {
      camera.position.set(Math.sin(cameraAzimuth)*cameraRadius, cameraHeight, Math.cos(cameraAzimuth)*cameraRadius);
      camera.lookAt(camTarget);
    }
    updateCamera();
    renderer.domElement.addEventListener('pointerdown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
    renderer.domElement.addEventListener('pointermove', e => { if(!dragging) return; cameraAzimuth -= (e.clientX-lastX)*.008; cameraHeight = THREE.MathUtils.clamp(cameraHeight + (e.clientY-lastY)*.06, 12, 29); lastX=e.clientX; lastY=e.clientY; updateCamera(); });
    renderer.domElement.addEventListener('pointerup', () => dragging=false);
    renderer.domElement.addEventListener('wheel', e => { cameraRadius = THREE.MathUtils.clamp(cameraRadius + e.deltaY*.012, 25, 45); updateCamera(); }, {passive:true});

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (!dragging) { cameraAzimuth += .0008; updateCamera(); }
      blossomGroups.forEach((o,i) => { o.g.rotation.z = Math.sin(t*.65+o.phase)*.008; o.g.position.y = Math.sin(t*.7+o.phase)*.035; });
      fireflies.forEach((o,i) => { o.f.position.y = o.base + Math.sin(t*1.4+o.phase)*.22; o.f.material.emissiveIntensity = 1.0 + Math.sin(t*2.2+o.phase)*.35; });
      renderer.render(scene,camera);
    }
    animate();
  </script>
</body>
</html>
