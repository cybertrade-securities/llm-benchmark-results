        linear-gradient(180deg, rgba(7, 11, 18, 0.2), transparent 24%, transparent 68%, rgba(7, 11, 18, 0.48)),
        radial-gradient(circle at 50% 44%, transparent 52%, rgba(4, 8, 14, 0.35) 100%);
    }

    .topbar {
      position: fixed;
      top: 94px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 24px;
      pointer-events: none;
    }

    .pixel-title {
      position: fixed;
      top: 29px;
      left: 32px;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 4px 18px rgba(8, 12, 20, 0.45));
      animation: arrive 1.2s cubic-bezier(.22, .8, .2, 1) both;
    }

    .pixel-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pixel-rule {
      width: 20px;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(255, 178, 110, 0.7);
    }

    .pixel-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: flex-start;
    }

    .pixel-line {
      display: flex;
      align-items: flex-start;
      gap: var(--letter-gap, 5px);
    }

    .pixel-glyph {
      display: grid;
      grid-template-columns: repeat(5, var(--cell, 7px));
      grid-template-rows: repeat(7, var(--cell, 7px));
      gap: var(--gap, 1px);
      flex: 0 0 auto;
    }

    .pixel-glyph i {
      display: block;
      width: var(--cell, 7px);
      height: var(--cell, 7px);
      opacity: 0;
      border-radius: 1px;
      background: #f8f3e8;
      box-shadow: inset 0 0 0 1px rgba(44, 33, 24, 0.06);
    }

    .pixel-glyph i.on {
      opacity: 1;
      box-shadow: 0 0 7px rgba(255, 202, 138, 0.34), inset 0 0 0 1px rgba(44, 33, 24, 0.06);
    }

    .pixel-line.accent .pixel-glyph i.on {
      background: #f6d7a4;
      box-shadow: 0 0 8px rgba(255, 178, 110, 0.42), inset 0 0 0 1px rgba(80, 44, 24, 0.08);
    }

    .pixel-line.small .pixel-glyph i.on {
      background: rgba(244, 239, 228, 0.7);
      box-shadow: none;
    }

    .pixel-caption {
      margin-top: 12px;
      color: var(--ink-soft);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .pixel-side {
      position: fixed;
      top: 32px;
      right: 32px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      filter: drop-shadow(0 4px 18px rgba(8, 12, 20, 0.45));
      animation: arrive 1.35s 0.12s cubic-bezier(.22, .8, .2, 1) both;
    }

    .pixel-side-sub {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title-block {
      max-width: 520px;
      animation: arrive 1.2s cubic-bezier(.22, .8, .2, 1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(255, 178, 110, 0.7);
    }

    h1 {
      margin: 0;
      font-family: "KenPixel", "Palatino Linotype", Georgia, serif;
      font-size: clamp(30px, 4.3vw, 64px);
      font-weight: 400;
      letter-spacing: 0.16em;
      line-height: 0.92;
      text-shadow: 0 2px 24px rgba(10, 15, 24, 0.55);
    }

    h1 em {
      color: var(--accent-2);
      font-style: normal;
      font-weight: 400;
    }

    .title-block p {
      margin: 12px 0 0;
      max-width: 390px;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.65;
      letter-spacing: 0.075em;
    }

    .side-meta {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      pointer-events: auto;
      animation: arrive 1.35s 0.1s cubic-bezier(.22, .8, .2, 1) both;
    }

    .stamp {
      min-width: 118px;
      padding: 11px 14px 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 38px rgba(2, 6, 12, 0.22);
    }

    .stamp .kicker {
      color: var(--accent);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .stamp .value {
      margin-top: 5px;
      font-family: "Palatino Linotype", Georgia, serif;
      font-size: 16px;
      letter-spacing: 0.06em;
    }

    #tour {
      margin-top: 1px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(16, 23, 31, 0.47);
      color: var(--ink);
      font-size: 10px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    #tour:hover {
      border-color: rgba(255, 178, 110, 0.64);
      background: rgba(30, 38, 46, 0.66);
      transform: translateY(-1px);
    }

    #tour.active::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .hint {
      position: fixed;
      left: 32px;
      bottom: 24px;
      color: rgba(244, 239, 228, 0.6);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      animation: arrive 1.4s 0.2s cubic-bezier(.22, .8, .2, 1) both;
    }

    .hint span {
      color: var(--accent-2);
      padding: 0 5px;
    }

    .vertical-note {
      position: fixed;
      right: 26px;
      bottom: 30px;
      color: rgba(244, 239, 228, 0.45);
      writing-mode: vertical-rl;
      font-family: "Palatino Linotype", Georgia, serif;
      font-size: 10px;
      letter-spacing: 0.38em;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #101720;
      transition: opacity 600ms ease, visibility 600ms ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .typeless .topbar,
    .typeless .hint,
    .typeless .vertical-note,
    .typeless .pixel-caption,
    .typeless .pixel-side-sub {
      display: none;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .loader-grid {
      width: 28px;
      height: 28px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      transform: rotate(45deg);
    }

    .loader-grid i {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite alternate;
    }

    .loader-grid i:nth-child(2) { animation-delay: .15s; background: #e7a7ba; }
    .loader-grid i:nth-child(3) { animation-delay: .30s; background: #8fcfbd; }
    .loader-grid i:nth-child(4) { animation-delay: .45s; background: #e1bd72; }

    @keyframes pulse {
      from { opacity: .18; transform: scale(.72); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .topbar { top: 20px; left: 20px; right: 20px; }
      .side-meta { flex-direction: column; align-items: flex-end; gap: 8px; }
      .stamp { display: none; }
      .hint { left: 20px; bottom: 18px; font-size: 8px; }
      .vertical-note { display: none; }
      .title-block p { display: none; }
      h1 { font-size: 28px; }
      .pixel-title { top: 20px; left: 20px; }
      .pixel-line { --cell: 4px !important; --gap: 0 !important; --letter-gap: 3px !important; }
      .pixel-side { top: 20px; right: 20px; }
      .topbar { top: 85px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="scene" aria-label="Interactive voxel art garden with a five-story pagoda, cherry trees, and a koi pond"></canvas>
  </div>

  <div class="grain"></div>
  <div class="vignette"></div>

  <div class="pixel-title" aria-label="Momiji no Niwa">
    <div class="pixel-kicker">
      <span class="pixel-rule"></span>
      <div id="pixel-eyebrow"></div>
    </div>
    <div class="pixel-stack" id="pixel-title-lines"></div>
    <div class="pixel-caption" aria-hidden="true">A garden above the clouds</div>
  </div>

  <div class="pixel-side" aria-label="Garden 05">
    <div id="pixel-side-line"></div>
    <div class="pixel-side-sub" aria-hidden="true">Five-story pagoda</div>
  </div>

  <div class="topbar">
    <div class="side-meta">
      <div class="stamp">
        <div class="kicker">Island record</div>
        <div class="value" id="voxel-count">— voxels</div>
      </div>
      <button id="tour" type="button" class="active">Pause tour</button>
    </div>
  </div>

  <div class="hint">DRAG <span>·</span> SCROLL <span>·</span> EXPLORE</div>
  <div class="vertical-note">A garden above the clouds</div>

  <div id="loading">
    <div class="loader">
      <div class="loader-grid"><i></i><i></i><i></i><i></i></div>
      <span>Planting voxels</span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -----------------------------------------------------------------------------
    // Palette & deterministic little helpers
    // -----------------------------------------------------------------------------

    const PAL = {
      vermilion: 0xb83f2f,
      vermilionDark: 0x7d2a24,
      redLacquer: 0xc95a3d,
      redEdge: 0x982f28,
      cream: 0xf0dfbd,
      creamLight: 0xffefcf,
      plaster: 0xe6d1ac,
      timber: 0x4a332e,
      gold: 0xe7b85d,
      goldLight: 0xffd78a,
      goldDeep: 0xac7b35,
      roof: [0x22515c, 0x2d6970, 0x17404b, 0x326d70],
      roofEdge: 0x10333e,
      stone: [0x77796f, 0x8d8d80, 0x686d67, 0xa29c8a],
      stoneDark: [0x494d4c, 0x555c5a, 0x64665c, 0x3e4748],
      grass: [0x4b7744, 0x59904a, 0x6aa252, 0x365f3d, 0x729d5a],
      moss: [0x788c4d, 0x657d44, 0x91a15c, 0x526d3e],
      soil: [0x52402f, 0x5d4937, 0x473a30, 0x66503b],
      path: [0xb5a486, 0xc4b293, 0xa69d89, 0xd0be9f],
      sand: [0xcfbf9c, 0xb4a382, 0xded1ae, 0xa89b82],
      cherry: [0xf7a8bd, 0xffc4d0, 0xe9789b, 0xd65e83, 0xffe1e5],
      cherryDark: [0xba5372, 0xd26082, 0x9d3f5d],
      cherryWhite: 0xffeef0,
      pine: [0x274e39, 0x386a48, 0x477b50, 0x214633, 0x52865a],
      maple: [0xc45b2c, 0xd77833, 0xec9b45, 0xa74329, 0xf2b75d],
      leaf: [0x387d4a, 0x4c9655, 0x2b6541, 0x66a65e, 0x7eae55],
      blossom: [0xf8bed0, 0xffdce4, 0xe995b1],
      water: [0x67d5dd, 0x51c0cf, 0x8ce4df, 0x42abc2],
      fish: [0xf27c39, 0xffb35b, 0xfff2d2, 0xc9522f],
      cloud: [0xf8eddb, 0xf5d9c4, 0xefdcec, 0xfff4e2],
      petal: [0xffc3cd, 0xf7aabd, 0xffe3e8, 0xe98fa7]
    };

    let seed = 1357;
    function rand() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function hash2(x, z, salt = 0) {
      const n = Math.sin(x * 127.1 + z * 311.7 + salt * 53.73) * 43758.5453;
      return n - Math.floor(n);
    }

    const colorCache = {};
    function shade(hex, amount = 0.055) {
      const key = `${hex}:${Math.round(amount * 1000)}`;
      const base = colorCache[key] || new THREE.Color(hex);
      colorCache[key] = base;
      const c = base.clone();
      const f = 1 + (rand() - 0.5) * amount * 2;
      c.multiplyScalar(f);
      return c.getHex();
    }

    function pick(list, amount = 0.05) {
      return shade(list[Math.floor(rand() * list.length)], amount);
    }

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // -----------------------------------------------------------------------------
    // Renderer, camera, sky and light
    // -----------------------------------------------------------------------------

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.13;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xbfae9b, 0.0075);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 220);
    camera.position.set(20, 16, 32);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(-2.0, 8.5, -0.8);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 15;
    controls.maxDistance = 64;
    controls.minPolarAngle = 0.22;
    controls.maxPolarAngle = 1.43;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.17;

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(160, 32, 18),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x3e587f) },
          highColor: { value: new THREE.Color(0x7890b7) },
          horizonColor: { value: new THREE.Color(0xf4bf93) },
          lowColor: { value: new THREE.Color(0xc5a2ad) },
          sunDir: { value: new THREE.Vector3(-0.58, 0.38, 0.22).normalize() }
        },
        vertexShader: `
          varying vec3 vWorld;
          void main() {
            vec4 positionWorld = modelMatrix * vec4(position, 1.0);
            vWorld = positionWorld.xyz;
            gl_Position = projectionMatrix * viewMatrix * positionWorld;
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 highColor;
          uniform vec3 horizonColor;
          uniform vec3 lowColor;
          uniform vec3 sunDir;
          varying vec3 vWorld;
          void main() {
            vec3 dir = normalize(vWorld);
            float h = dir.y;
            vec3 sky = mix(lowColor, horizonColor, smoothstep(-0.22, 0.06, h));
            sky = mix(sky, highColor, smoothstep(0.02, 0.45, h));
            sky = mix(sky, topColor, smoothstep(0.38, 0.95, h));
            float sunDot = max(dot(dir, sunDir), 0.0);
            float halo = pow(sunDot, 16.0) * 0.22;
            float disc = pow(sunDot, 620.0) * 1.4;
            sky += vec3(1.0, 0.62, 0.28) * halo;
            sky += vec3(1.0, 0.82, 0.56) * disc;
            float glowLine = smoothstep(0.02, 0.11, h) * (1.0 - smoothstep(0.12, 0.32, h));
            sky += vec3(0.24, 0.10, 0.05) * glowLine * (0.4 + sunDot);
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      })
    );
    sky.frustumCulled = false;
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0xddefff, 0x5d6650, 1.42);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffd39d, 3.15);
    sun.position.set(-20, 27, 17);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 80;
    sun.shadow.camera.left = -23;
    sun.shadow.camera.right = 23;
    sun.shadow.camera.top = 23;
    sun.shadow.camera.bottom = -23;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.035;
    scene.add(sun);
    scene.add(sun.target);

    const coolFill = new THREE.DirectionalLight(0x9bbbd6, 1.12);
    coolFill.position.set(19, 11, -22);
    scene.add(coolFill);

    const warmBounce = new THREE.PointLight(0xffb276, 17, 17, 1.8);
    warmBounce.position.set(-4, 10, 4);
    scene.add(warmBounce);

    const lanternLight = new THREE.PointLight(0xffb566, 10, 11, 1.8);
    lanternLight.position.set(-1.8, 3.3, 6.3);
    scene.add(lanternLight);

    // -----------------------------------------------------------------------------
    // Voxel construction
    // -----------------------------------------------------------------------------

    const voxels = [];
    const voxelMap = new Map();
    const glowingVoxels = [];
    const glowMap = new Map();

    function keyFor(x, y, z) {
      return `${x.toFixed(3)}|${y.toFixed(3)}|${z.toFixed(3)}`;
    }

    function addVox(x, y, z, color, sx = 1, sy = 1, sz = 1) {
      const key = keyFor(x, y, z);
      if (voxelMap.has(key)) return false;
      const item = { x, y, z, color, sx, sy, sz };
      voxelMap.set(key, item);
      voxels.push(item);
      return true;
    }

    function addGlow(x, y, z, color, sx = 1, sy = 1, sz = 1) {
      const key = keyFor(x, y, z);
      if (glowMap.has(key)) return false;
      const item = { x, y, z, color, sx, sy, sz };
      glowMap.set(key, item);
      glowingVoxels.push(item);
      return true;
    }

    function addBox(x0, x1, y0, y1, z0, z1, colorFn) {
      for (let y = y0; y <= y1; y++) {
        for (let z = z0; z <= z1; z++) {
          for (let x = x0; x <= x1; x++) {
            const color = typeof colorFn === 'function' ? colorFn(x, y, z) : colorFn;
            if (color !== null && color !== undefined) addVox(x, y, z, color);
          }
        }
      }
    }

    function voxelLine(a, b, colorFn, thickness = 1, stepScale = 1.25) {
      const distance = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]), Math.abs(b[2] - a[2]));
      const steps = Math.max(1, Math.ceil(distance * stepScale));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(lerp(a[0], b[0], t));
        const y = Math.round(lerp(a[1], b[1], t));
        const z = Math.round(lerp(a[2], b[2], t));
        const color = typeof colorFn === 'function' ? colorFn(i, t) : colorFn;
        addVox(x, y, z, color);
        if (thickness > 1 && i % 2 === 0) {
          addVox(x + 1, y, z, shade(color, 0.04));
        }
      }
    }

    function blob(cx, cy, cz, rx, ry, rz, colors, density = 0.66, salt = 0) {
      const x0 = Math.floor(cx - rx);
      const x1 = Math.ceil(cx + rx);
      const y0 = Math.floor(cy - ry);
      const y1 = Math.ceil(cy + ry);
      const z0 = Math.floor(cz - rz);
      const z1 = Math.ceil(cz + rz);
      for (let y = y0; y <= y1; y++) {
        for (let z = z0; z <= z1; z++) {
          for (let x = x0; x <= x1; x++) {
            const nx = (x - cx) / rx;
            const ny = (y - cy) / ry;
            const nz = (z - cz) / rz;
            const d = nx * nx + ny * ny + nz * nz;
            const rough = hash2(x, z, salt + y) * 0.22;
            if (d > 1.02 || d < 0.45 - rough || rand() > density + (1 - d) * 0.22) continue;
            let color;
            if (ny > 0.43 && rand() < 0.28) color = colors[Math.min(colors.length - 1, 4)] || colors[0];
            else if (ny < -0.3) color = shade(colors[0], 0.1);
            else color = pick(colors, 0.08);
            addVox(x, y, z, color);
          }
        }
      }
    }

    function makeVoxelTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 18, size / 2, size / 2, size * 0.72);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.68, '#f8f8f8');
      g.addColorStop(0.88, '#c8c8c8');
      g.addColorStop(1, '#8f8f8f');
      ctx.fillStyle = '#8f8f8f';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    function makeGlowTexture() {
      const size = 96;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 1, size / 2, size / 2, size / 2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.2, 'rgba(255,245,220,.82)');
      g.addColorStop(0.55, 'rgba(255,190,115,.28)');
      g.addColorStop(1, 'rgba(255,150,90,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const voxelTexture = makeVoxelTexture();
    const glowTexture = makeGlowTexture();

    // -----------------------------------------------------------------------------
    // Island terrain, pond, paths
    // -----------------------------------------------------------------------------

    const pondCX = 5.1;
    const pondCZ = 4.3;
    const pondRX = 4.45;
    const pondRZ = 3.4;

    function pondDepth(x, z) {
      const dx = (x - pondCX) / pondRX;
      const dz = (z - pondCZ) / pondRZ;
      const wobble = Math.sin((x + 2) * 1.05 + z * 0.7) * 0.055 + Math.sin(z * 1.8) * 0.035;
      return dx * dx + dz * dz + wobble;
    }

    function islandMask(x, z, threshold = 1) {
      const nx = x / 13.3;
      const nz = z / 10.65;
      const wobble = Math.sin(x * 1.19 + z * 0.53) * 0.025 + Math.sin(z * 1.89 - x * 0.41) * 0.018;
      return nx * nx + nz * nz + wobble < threshold;
    }

    const inPlaza = (x, z) => x >= -8 && x <= 1 && z >= -8 && z <= 1;
    const onMainPath = (x, z) => x >= -2 && x <= 0 && z >= 1 && z <= 8;
    const toriiX = -1;
    const toriiZ = 8;

    function topSurfaceColor(x, z) {
      const pd = pondDepth(x, z);
      if (pd < 1.0) return null;
      if (pd < 1.23) return pick(PAL.sand, 0.08);
      if (inPlaza(x, z)) {
        const checker = ((x + z) % 4 === 0) || ((x + z) % 4 === 2);
        return shade(checker ? 0xa39986 : 0x827f75, 0.06);
      }
      if (onMainPath(x, z)) return pick(PAL.path, 0.06);
      if ((z > 7 && Math.abs(x - toriiX) <= 3) || (x > 0 && z >= 2 && z <= 6)) {
        return pick(PAL.path, 0.06);
      }
      const flowerZones = [
        [-8.8, 4.8, 1.7],
        [-1.9, 8.2, 1.4],
        [7.8, -1.3, 1.7],
        [8.0, 8.0, 1.2],
        [-9.3, -3.3, 1.4]
      ];
      for (const fz of flowerZones) {
        if (Math.hypot(x - fz[0], z - fz[1]) < fz[2]) return shade(0x566f43, 0.08);
      }
      return pick(PAL.grass, 0.11);
    }

    function buildIsland() {
      for (let y = -8; y <= 0; y++) {
        const threshold = y === 0 ? 1 : 1 + (y + 1) * 0.045;
        for (let z = -12; z <= 12; z++) {
          for (let x = -15; x <= 15; x++) {
            if (!islandMask(x, z, threshold)) continue;
            const pd = pondDepth(x, z);
            if (y === 0 && pd < 1.0) continue;

            let color;
            if (y === 0) {
              color = topSurfaceColor(x, z);
              if (color === null) continue;
            } else if (pd < 1.0 && y === -1) {
              color = shade(0x183e4e, 0.12);
            } else if (y === -1) {
              color = pick(PAL.soil, 0.1);
            } else if (y >= -4) {
              color = rand() < 0.14 ? pick(PAL.soil, 0.12) : pick(PAL.stoneDark, 0.1);
            } else {
              color = rand() < 0.2 ? pick(PAL.moss, 0.14) : pick(PAL.stoneDark, 0.13);
            }
            addVox(x, y, z, color);
          }
        }
      }

      for (let i = 0; i < 34; i++) {
        const angle = rand() * Math.PI * 2;
        const radius = 4.8 + rand() * 4.8;
        const x = Math.round(Math.cos(angle) * radius);
        const z = Math.round(Math.sin(angle) * radius * 0.65);
        const y = -8 - Math.floor(rand() * 3);
        addVox(x, y, z, pick(rand() < 0.22 ? PAL.moss : PAL.stoneDark, 0.14));
      }
    }

    buildIsland();

    const waterInstances = [];
    for (let z = -8; z <= 11; z++) {
      for (let x = -13; x <= 13; x++) {
        if (pondDepth(x, z) < 0.97) {
          waterInstances.push({
            x, y: -0.51, z,
            sx: 0.97, sy: 0.34, sz: 0.97,
            color: pick(PAL.water, 0.09),
            phase: rand() * Math.PI * 2
          });
        }
      }
    }

    const waterfallData = [];
    for (let i = 0; i < 13; i++) {
      waterfallData.push({
        x: 8.15 + Math.sin(i * 0.45) * 0.12,
        y: 2.7 - i * 0.24,
        z: 1.34 + Math.sin(i * 0.8) * 0.09,
        sx: 0.24, sy: 0.3, sz: 0.23,
        color: pick(PAL.water, 0.04)
      });
    }

    // -----------------------------------------------------------------------------
    // Pagoda
    // -----------------------------------------------------------------------------

    const pagodaCX = -4;
    const pagodaCZ = -4;

    function buildTemplePlatform() {
      for (let z = -8; z <= 1; z++) {
        for (let x = -8; x <= 1; x++) {
          addVox(x, 1, z, pick(PAL.stone, 0.08));
        }
      }

      for (let x = -7; x <= -1; x++) {
        for (let z = 2; z <= 3; z++) {
          addVox(x, 0.72, z, pick(PAL.stone, 0.06), 1, 0.48, 1);
        }
      }

      for (let x = -8; x <= 1; x++) {
        for (let z = -8; z <= 1; z++) {
          if (x !== -8 && x !== 1 && z !== -8 && z !== 1) continue;
          if ((x + z) % 3 !== 0 && Math.abs(x - pagodaCX) > 4 && Math.abs(z - pagodaCZ) > 4) continue;
          const y = 1.72;
          addVox(x, y, z, shade(PAL.redLacquer, 0.05), 0.74, 0.34, 0.28);
          if ((x + z) % 4 === 0) {
            addVox(x, y + 0.34, z, pick(PAL.gold, 0.05), 0.2, 0.24, 0.2);
          }
        }
      }
    }

    buildTemplePlatform();

    function storyBody(cx, cz, width, depth, y0, height, level) {
      const x0 = Math.round(cx - (width - 1) / 2);
      const z0 = Math.round(cz - (depth - 1) / 2);
      const x1 = x0 + width - 1;
      const z1 = z0 + depth - 1;
      const centerX = x0 + Math.floor(width / 2);
      const centerZ = z0 + Math.floor(depth / 2);

      for (let y = y0; y < y0 + height; y++) {
        for (let z = z0; z <= z1; z++) {
          for (let x = x0; x <= x1; x++) {
            if (!(x === x0 || x === x1 || z === z0 || z === z1)) continue;
            const front = z === z1;
            const right = x === x1;
            const corner = (x === x0 || x === x1) && (z === z0 || z === z1);
            const midWindowX = Math.abs(x - centerX) <= 0 && front;
            const midWindowZ = Math.abs(z - centerZ) <= 0 && right;
            const topBand = y === y0 + height - 1;
            const lowerBand = y === y0;

            let color = pick([PAL.plaster, PAL.cream], 0.035);
            if (corner || x === x0 || x === x1) color = shade(PAL.vermilion, 0.04);
            if (z === z1 && (x <= x0 + 1 || x >= x1 - 1)) color = shade(PAL.redLacquer, 0.04);
            if (topBand || lowerBand) color = shade(PAL.redEdge, 0.035);

            const windowBand = y > y0 && y < y0 + height - 1;
            if ((front && midWindowX && windowBand) || (right && midWindowZ && windowBand)) {
              addGlow(x, y, z, pick([PAL.goldLight, 0xffc96a], 0.04), 0.45, 0.58, 0.18);
              continue;
            }

            if (front && midWindowX && y <= y0 + 1) {
              color = pick([PAL.timber, PAL.vermilionDark], 0.04);
            }

            addVox(x, y, z, color);
          }
        }
      }

      const railY = y0 + height - 0.22;
      for (let x = x0 - 1; x <= x1 + 1; x++) {
        addVox(x, railY, z0 - 1, pick([PAL.redLacquer, PAL.goldDeep], 0.04), 0.7, 0.22, 0.2);
        addVox(x, railY, z1 + 1, pick([PAL.redLacquer, PAL.goldDeep], 0.04), 0.7, 0.22, 0.2);
      }
      for (let z = z0 - 1; z <= z1 + 1; z++) {
        addVox(x0 - 1, railY, z, pick([PAL.redLacquer, PAL.goldDeep], 0.04), 0.2, 0.22, 0.7);
        addVox(x1 + 1, railY, z, pick([PAL.redLacquer, PAL.goldDeep], 0.04), 0.2, 0.22, 0.7);
      }
    }

    function pagodaRoof(cx, cz, width, y, tier) {
      const x0 = Math.round(cx - (width - 1) / 2);
      const z0 = Math.round(cz - (width - 1) / 2);
      const x1 = x0 + width - 1;
      const z1 = z0 + width - 1;

      for (let z = z0; z <= z1; z++) {
        for (let x = x0; x <= x1; x++) {
          const tile = (Math.floor((x - x0) / 2) + Math.floor((z - z0) / 2)) % 2;
          addVox(x, y, z, shade(PAL.roof[(tile + tier) % PAL.roof.length], 0.08));
        }
      }

      for (let x = x0; x <= x1; x++) {
        addVox(x, y + 1, z0, pick(PAL.roofEdge, 0.05));
        addVox(x, y + 1, z1, pick(PAL.roofEdge, 0.05));
      }
      for (let z = z0; z <= z1; z++) {
        addVox(x0, y + 1, z, pick(PAL.roofEdge, 0.05));
        addVox(x1, y + 1, z, pick(PAL.roofEdge, 0.05));
      }

      const corners = [[x0, z0], [x1, z0], [x0, z1], [x1, z1]];
      for (const [x, z] of corners) {
        addVox(x, y + 2, z, pick([PAL.gold, PAL.goldLight], 0.04));
        addGlow(x, y + 1.18, z + 0.48, pick([PAL.goldLight, 0xffe6ad], 0.02), 0.22, 0.2, 0.18);
      }

      // A warm gilded rhythm along each eave edge.
      for (let x = x0 + 1; x < x1; x += 2) {
        addGlow(x, y + 1.28, z0 - 0.48, pick([PAL.gold, PAL.goldLight], 0.02), 0.17, 0.14, 0.17);
        addGlow(x, y + 1.28, z1 + 0.48, pick([PAL.gold, PAL.goldLight], 0.02), 0.17, 0.14, 0.17);
      }
      for (let z = z0 + 1; z < z1; z += 2) {
        addGlow(x0 - 0.48, y + 1.28, z, pick([PAL.gold, PAL.goldLight], 0.02), 0.17, 0.14, 0.17);
        addGlow(x1 + 0.48, y + 1.28, z, pick([PAL.gold, PAL.goldLight], 0.02), 0.17, 0.14, 0.17);
      }

      for (let x = x0 + 1; x <= x1 - 1; x++) {
        addVox(x, y - 0.72, z0, shade(PAL.redEdge, 0.04), 0.74, 0.32, 0.24);
        addVox(x, y - 0.72, z1, shade(PAL.redEdge, 0.04), 0.74, 0.32, 0.24);
      }
    }

    function buildPagoda() {
      storyBody(pagodaCX, pagodaCZ, 5, 5, 2, 3, 0);
      pagodaRoof(pagodaCX, pagodaCZ, 7, 5, 0);

      storyBody(pagodaCX, pagodaCZ, 4, 4, 6, 3, 1);
      pagodaRoof(pagodaCX, pagodaCZ, 6, 9, 1);

      storyBody(pagodaCX, pagodaCZ, 3, 3, 10, 2, 2);
      pagodaRoof(pagodaCX, pagodaCZ, 5, 12, 2);

      storyBody(pagodaCX, pagodaCZ, 3, 3, 13, 2, 3);
      pagodaRoof(pagodaCX, pagodaCZ, 4, 15, 3);

      storyBody(pagodaCX, pagodaCZ, 2, 2, 16, 2, 4);
      pagodaRoof(pagodaCX, pagodaCZ, 3, 18, 4);

      for (let y = 19; y <= 21; y++) {
        addVox(pagodaCX, y, pagodaCZ, shade(PAL.goldDeep, 0.04), y === 20 ? 0.34 : 0.2, 1, y === 20 ? 0.34 : 0.2);
      }
      addVox(pagodaCX, 22, pagodaCZ, pick([PAL.goldLight, PAL.gold], 0.02), 0.47, 0.47, 0.47);
      addGlow(pagodaCX, 22.7, pagodaCZ, 0xffe2a0, 0.37, 0.37, 0.37);

      for (const [x, z] of [[pagodaCX - 1, pagodaCZ - 1], [pagodaCX + 1, pagodaCZ - 1], [pagodaCX - 1, pagodaCZ + 1]]) {
        addVox(x, 17.15, z, PAL.goldDeep, 0.1, 1.05, 0.1);
        addVox(x, 16.55, z, PAL.goldLight, 0.24, 0.24, 0.24);
      }
    }

    buildPagoda();

    // -----------------------------------------------------------------------------
    // Trees, bamboo, shrubs, flowers
    // -----------------------------------------------------------------------------

    function cherryTree(x, z, height, scale, salt, lean = 0) {
      const baseY = 1;
      const topX = x + lean * scale;
      const topZ = z + Math.sin(salt) * 0.45 * scale;
      voxelLine([x, baseY, z], [topX, Math.round(height * 0.55), topZ], () => pick([0x5b4032, 0x6f4f3e, 0x7d5b46], 0.05), 2);

      const branchTips = [];
      const branchCount = 5;
      for (let i = 0; i < branchCount; i++) {
        const angle = (i / branchCount) * Math.PI * 2 + salt * 0.8 + Math.sin(i * 2.1 + salt) * 0.28;
        const reach = (2.0 + rand() * 1.65) * scale;
        const tip = [
          topX + Math.cos(angle) * reach,
          height * 0.72 + Math.sin(i * 1.7 + salt) * 1.1 * scale,
          topZ + Math.sin(angle) * reach
        ];
        voxelLine(
          [topX, Math.round(height * 0.5), topZ],
          [Math.round(tip[0]), Math.round(tip[1]), Math.round(tip[2])],
          () => pick([0x684939, 0x765143, 0x51392f], 0.06),
          1,
          1.1
        );
        branchTips.push(tip);
      }

      const crownY = height * 0.85;
      blob(topX, crownY, topZ, 3.0 * scale, 1.7 * scale, 2.4 * scale, PAL.cherry, 0.77, salt);
      for (let i = 0; i < branchTips.length; i++) {
        const tip = branchTips[i];
        blob(
          tip[0], tip[1], tip[2],
          1.8 * scale, 1.2 * scale, 1.5 * scale,
          i % 3 === 0 ? PAL.cherryDark : PAL.cherry,
          0.74,
          salt + 20 + i
        );
      }
      for (let i = 0; i < 16; i++) {
        const a = rand() * Math.PI * 2;
        const r = rand() * 2.3 * scale;
        const x2 = Math.round(topX + Math.cos(a) * r);
        const z2 = Math.round(topZ + Math.sin(a) * r);
        const y2 = Math.round(crownY + 1.0 + rand() * 1.6);
        addVox(x2, y2, z2, pick([PAL.cherry[1], PAL.cherryWhite, PAL.cherryWhite], 0.02));
      }
    }

    cherryTree(-10.1, 6.2, 10.8, 1.42, 1.7, -0.55);
    cherryTree(8.9, -6.0, 8.2, 1.0, 3.4, 0.30);
    cherryTree(-6.6, -8.4, 7.2, 0.82, 5.3, 0.25);

    function pineTree(x, z, height, scale, salt) {
      voxelLine([x, 1, z], [x + 0.35, height * 0.87, z], () => pick([0x4f372c, 0x5e4635, 0x6e5541], 0.05), 1);
      const tiers = 5;
      for (let i = 0; i < tiers; i++) {
        const t = i / (tiers - 1);
        const y = 2.2 + t * height * 0.75;
        const radius = (2.8 - t * 1.75) * scale;
        for (let dz = -Math.ceil(radius); dz <= Math.ceil(radius); dz++) {
          for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
            const d = (dx * dx + dz * dz) / (radius * radius);
            if (d <= 1.0 + 0.24 * Math.sin(dx * 2.4 + dz + salt + i)) {
              const px = Math.round(x + dx);
              const py = Math.round(y + Math.abs(dx + dz) * 0.14);
              const pz = Math.round(z + dz);
              addVox(px, py, pz, pick(PAL.pine, 0.09));
              if (d > 0.42 && rand() < 0.35) addVox(px, py + 1, pz, pick([PAL.pine[2], PAL.pine[4]], 0.07));
            }
          }
        }
      }
      addVox(x + 0.35, height * 0.88 + 1, z, pick(PAL.pine, 0.06));
    }

    pineTree(11.0, -4.7, 9.0, 1.0, 2.2);
    pineTree(-11.5, -5.7, 7.6, 0.82, 5.1);

    function mapleTree(x, z, height, scale, salt) {
      voxelLine([x, 1, z], [x + 0.5, height * 0.62, z - 0.25], () => pick([0x643e31, 0x7b5542, 0x52362b], 0.06), 1, 1.4);
      blob(x + 0.6, height * 0.78, z - 0.2, 2.7 * scale, 1.7 * scale, 2.4 * scale, PAL.maple, 0.75, salt);
      blob(x - 1.1, height * 0.72, z + 0.9, 1.7 * scale, 1.2 * scale, 1.5 * scale, PAL.maple, 0.72, salt + 9);
      blob(x + 1.8, height * 0.95, z - 0.8, 1.5 * scale, 1.0 * scale, 1.4 * scale, PAL.maple, 0.7, salt + 18);
    }

    mapleTree(-11.9, -8.7, 8.0, 0.92, 7.2);
    mapleTree(6.8, -8.7, 6.1, 0.68, 10.4);

    function broadleafTree(x, z, height, scale, salt) {
      voxelLine([x, 1, z], [x, height * 0.72, z], () => pick([0x574437, 0x6b523e], 0.06), 2, 1.1);
      blob(x, height * 0.83, z, 2.8 * scale, 1.8 * scale, 2.4 * scale, PAL.leaf, 0.72, salt);
    }

    broadleafTree(2.0, -9.9, 7.0, 0.92, 2.8);

    function bambooCluster(x, z, count, salt) {
      for (let i = 0; i < count; i++) {
        const bx = x + (rand() - 0.5) * 2.2;
        const bz = z + (rand() - 0.5) * 2.2;
        const h = 5.0 + rand() * 3.2;
        for (let y = 1; y <= h; y++) {
          const bend = Math.sin(y * 0.55 + salt + i) * 0.16;
          addVox(Math.round(bx + bend), y, Math.round(bz), pick([0x7d9f55, 0x9eb96e, 0x5f8747], 0.08));
          if (y % 3 === 0) addVox(Math.round(bx + bend), y, Math.round(bz), pick([0xc5c081, 0xaeb47a], 0.04), 1.1, 0.22, 1.1);
        }
        for (let y = Math.round(h * 0.68); y <= Math.round(h) + 1; y++) {
          const dir = y % 2 === 0 ? 1 : -1;
          addVox(Math.round(bx + dir), y, Math.round(bz), pick(PAL.leaf, 0.1), 0.85, 0.16, 0.24);
          addVox(Math.round(bx), y, Math.round(bz + dir), pick(PAL.leaf, 0.1), 0.24, 0.15, 0.85);
        }
      }
    }

    bambooCluster(-11.9, 0.4, 4, 3.1);

    function shrub(x, z, radius, salt, flowers = false) {
      blob(x, 0.9, z, radius, 0.75 + radius * 0.1, radius * 0.72, PAL.leaf, 0.78, salt);
      if (flowers) {
        for (let i = 0; i < 15; i++) {
          const a = rand() * Math.PI * 2;
          const r = rand() * radius * 0.76;
          addVox(
            Math.round(x + Math.cos(a) * r),
            1.35 + Math.round(rand() * 2),
            Math.round(z + Math.sin(a) * r),
            pick(PAL.blossom, 0.04),
            0.32, 0.3, 0.32
          );
        }
      }
    }

    shrub(-8.1, 3.6, 1.8, 1.4, true);
    shrub(-11.0, 3.6, 1.5, 2.3, false);
    shrub(-1.6, 4.4, 1.35, 3.4, true);
    shrub(10.9, -0.5, 1.0, 5.2, false);
    shrub(-7.3, -7.7, 1.2, 6.6, false);

    function flowerPatch(cx, cz, radius, count, palette, salt) {
      for (let i = 0; i < count; i++) {
        const a = rand() * Math.PI * 2;
        const r = Math.sqrt(rand()) * radius;
        const x = cx + Math.cos(a) * r;
        const z = cz + Math.sin(a) * r;
        addVox(x, 0.76, z, pick([0x567e44, 0x698c4d], 0.05), 0.11, 0.58, 0.11);
        addVox(x, 1.0, z, pick(palette, 0.04), 0.22, 0.16, 0.22);
        if (hash2(x, z, salt) > 0.62) {
          addVox(x + 0.18, 1.1, z, pick(palette, 0.03), 0.12, 0.12, 0.12);
        }
      }
    }

    flowerPatch(-8.8, 4.8, 1.8, 38, PAL.cherry, 3);
    flowerPatch(-1.9, 8.2, 1.5, 24, PAL.cherry, 5);
    flowerPatch(7.9, -1.4, 1.8, 34, [0xf1b84d, 0xffd97a, 0xe9894e], 7);
    flowerPatch(8.1, 8.0, 1.2, 18, [0xcfe77c, 0xffd18d, 0xe9a1bf], 9);
    flowerPatch(-9.2, -3.2, 1.4, 25, [0xb8d66d, 0xe9b86b, 0xf2b2b2], 11);

    // -----------------------------------------------------------------------------
    // Garden architecture: torii, bridge, tea pavilion, lanterns
    // -----------------------------------------------------------------------------

    function buildTorii() {
      const x = toriiX;
      const z = toriiZ;
      for (const px of [x - 2, x + 2]) {
        addVox(px, 2.55, z, pick([PAL.redLacquer, PAL.vermilion], 0.04), 0.52, 3.7, 0.52);
        addVox(px, 0.7, z, pick(PAL.stone, 0.05), 0.86, 0.5, 0.86);
      }
      for (let dx = -3; dx <= 3; dx++) {
        addVox(x + dx, 4.65, z, pick([PAL.vermilion, PAL.redLacquer], 0.04), 0.72, 0.44, 0.46);
        if (Math.abs(dx) === 3) addVox(x + dx, 4.95, z, pick(PAL.gold, 0.04), 0.35, 0.46, 0.35);
      }
      addVox(x, 3.55, z, pick([PAL.redEdge, PAL.redLacquer], 0.04), 4.2, 0.34, 0.34);
      addVox(x, 3.95, z, pick(PAL.creamLight, 0.04), 2.2, 0.22, 0.22);
      for (let dx = -4; dx <= 4; dx += 2) {
        addVox(x + dx, 5.52, z, pick([PAL.roofEdge, PAL.roof[2]], 0.05), 1.15, 0.28, 0.86);
      }
      addVox(x - 3, 5.84, z, PAL.goldDeep, 0.3, 0.35, 0.3);
      addVox(x + 3, 5.84, z, PAL.goldDeep, 0.3, 0.35, 0.3);
    }

    buildTorii();

    function buildBridge() {

            addVox(x, deckY + 1.32, zCenter + side, pick(PAL.gold, 0.03), 0.26, 0.18, 0.26);

    function miniGarden(cx, topY, cz, radius, salt, treePalette, style) {
      for (let layer = 0; layer < 4; layer++) {
        const y = Math.round(topY - layer);
        const scale = 1 - layer * 0.16;
        const rr = radius * scale;
        for (let dz = -Math.ceil(rr); dz <= Math.ceil(rr); dz++) {

            const wobble = Math.sin((dx + dz) * 1.7 + salt) * 0.13;
            if ((dx * dx + dz * dz) / (rr * rr) > 1.0 + wobble) continue;
            if (layer === 0) {

    function buildInstancedMesh(data, material, castShadow = true, receiveShadow = true) {
      const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, data.length);
      const matrix = new THREE.Matrix4();
      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      const color = new THREE.Color();
      for (let i = 0; i < data.length; i++) {
        const voxel = data[i];
        position.set(voxel.x, voxel.y, voxel.z);
        scale.set(voxel.sx ?? 1, voxel.sy ?? 1, voxel.sz ?? 1);
        matrix.compose(position, quaternion, scale);
        mesh.setMatrixAt(i, matrix);
        color.setHex(voxel.color);
        mesh.setColorAt(i, color);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      mesh.frustumCulled = false;
      return mesh;
    }

    function animateWater(time) {
      for (let i = 0; i < waterInstances.length; i++) {
        const water = waterInstances[i];
        const bob = Math.sin(time * 1.2 + water.phase) * 0.025;
        petalPosition.set(water.x, water.y + bob, water.z);
        petalScale.set(water.sx, water.sy, water.sz);
        petalMatrix.compose(petalPosition, identityRotation, petalScale);
        waterMesh.setMatrixAt(i, petalMatrix);
      }
      waterMesh.instanceMatrix.needsUpdate = true;
    }

    function animatePetals(time) {
      for (let i = 0; i < petalCount; i++) {
        const p = petalData[i];
        const fallT = (time * p.speed + p.phase) % 8.5;
        const y = 9.8 - fallT;
        const drift = Math.sin(time * 0.8 + p.sway) * 0.62 + p.radiusX * Math.sin(time * 0.28 + p.phase);
        const driftZ = Math.cos(time * 0.53 + p.sway) * 0.52 + p.radiusZ * Math.cos(time * 0.22 + p.phase);
        petalPosition.set(p.cx + drift, y, p.cz + driftZ);
        euler.set(time * 1.4 + p.phase, time * 0.9 + p.sway, time * 0.6 + p.phase);
        petalRotation.setFromEuler(euler);
        petalScale.set(p.scale, p.scale, p.scale);
        petalMatrix.compose(petalPosition, petalRotation, petalScale);
        petalMesh.setMatrixAt(i, petalMatrix);
      }
      petalMesh.instanceMatrix.needsUpdate = true;
    }

    function animateFireflies(time) {
      const positions = fireflyGeometry.attributes.position.array;
      for (let i = 0; i < fireflyCount; i++) {
        const f = fireflyData[i];
        const pulse = 0.4 + 0.5 * Math.sin(time * f.speed * 2.2 + f.phase);
        positions[i * 3] = f.x + Math.sin(time * 0.55 + f.phase) * 0.85;
        positions[i * 3 + 1] = f.y + Math.sin(time * 0.72 + f.phase) * 0.38;
        positions[i * 3 + 2] = f.z + Math.cos(time * 0.48 + f.phase) * 0.75;
        fireflyColors[i * 3] = pulse;
        fireflyColors[i * 3 + 1] = pulse * 0.74;
        fireflyColors[i * 3 + 2] = pulse * 0.36;
      }
      fireflyGeometry.attributes.position.needsUpdate = true;
      fireflyGeometry.attributes.color.needsUpdate = true;
    }

    function pixelLine(text, options = {}) {
      const line = document.createElement('div');
      line.className = `pixel-line${options.accent ? ' accent' : ''}${options.small ? ' small' : ''}`;
      line.style.setProperty('--cell', `${options.cell ?? 7}px`);
      line.style.setProperty('--gap', `${options.gap ?? 1}px`);
      line.style.setProperty('--letter-gap', `${options.letterGap ?? 5}px`);
      for (const character of text) {
        if (character === ' ') {
          const space = document.createElement('span');
          space.style.width = `${(options.cell ?? 7) * 2.2}px`;
          space.style.height = '1px';
          space.setAttribute('aria-hidden', 'true');
          line.appendChild(space);
          continue;
        }
        const rows = GLYPHS[character];
        if (!rows) continue;
        const glyph = document.createElement('span');
        glyph.className = 'pixel-glyph';
        glyph.setAttribute('aria-hidden', 'true');
        for (const row of rows) {
          for (const bit of row) {
            const cell = document.createElement('i');
            if (bit === '1') cell.className = 'on';
            glyph.appendChild(cell);
          }
        }
        line.appendChild(glyph);
      }
      return line;
    }

    // all, hide the text frames rather than leave empty panels floating over art.
    const checkFontFallback = () => {
      if (!document.fonts.check('16px KenPixel')) {
        document.documentElement.classList.add('typeless');
      }
    };
    document.fonts.ready.then(checkFontFallback).catch(checkFontFallback);
    setTimeout(checkFontFallback, 900);
  </script>
</body>
</html>
