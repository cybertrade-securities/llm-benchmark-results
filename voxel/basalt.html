<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五重塔の庭 — Voxel Pagoda Garden</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4efe8; --dim:#a9b6c4; --glass:rgba(12,17,24,.52); --edge:rgba(255,255,255,.14);
    --verm:#ef5b52; --gold:#f2c14e; --sakura:#ffb6cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e14;color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,Segoe UI,Roboto,sans-serif;font-weight:300}
  canvas{display:block}
  #stage{position:fixed;inset:0}
  .panel{position:fixed;background:var(--glass);border:1px solid var(--edge);border-radius:16px;
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 18px 50px -18px rgba(0,0,0,.75);padding:14px 16px;opacity:0;transform:translateY(8px);
    transition:opacity .9s ease,transform .9s ease}
  .ready .panel{opacity:1;transform:none}
  #title{left:22px;top:22px;padding-right:52px;max-width:min(46vw,430px)}
  #title h1{margin:0;font-family:"Shippori Mincho B1",serif;font-weight:700;
    font-size:clamp(19px,2.1vw,27px);letter-spacing:.12em;line-height:1.15}
  #title .sub{margin-top:7px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  #title .jp{position:absolute;right:14px;top:12px;writing-mode:vertical-rl;font-family:"Shippori Mincho B1",serif;
    font-size:26px;letter-spacing:.16em;color:var(--sakura);opacity:.72;text-shadow:0 2px 18px rgba(255,120,160,.35)}
  #title .rule{margin-top:11px;height:1px;background:linear-gradient(90deg,var(--verm),transparent)}
  #title .note{margin-top:9px;font-size:11px;line-height:1.6;color:var(--dim);letter-spacing:.03em}

  #dock{left:22px;bottom:22px;display:flex;flex-direction:column;gap:12px;width:min(90vw,392px)}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .lbl{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);width:100%;margin-bottom:1px}
  button{font:inherit;font-size:11.5px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--edge);border-radius:999px;padding:6px 12px;cursor:pointer;letter-spacing:.07em;
    transition:background .18s,border-color .18s,transform .12s,color .18s;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
  button.on{background:linear-gradient(180deg,rgba(239,91,82,.9),rgba(190,52,54,.9));border-color:rgba(255,180,170,.5);
    box-shadow:0 4px 18px -6px rgba(239,91,82,.8)}
  .tod{display:flex;flex-direction:column;gap:6px}
  .todhead{display:flex;justify-content:space-between;align-items:baseline}
  #todName{font-family:"Shippori Mincho B1",serif;font-size:12.5px;letter-spacing:.14em;color:var(--gold)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:999px;
    background:linear-gradient(90deg,#8ec9f0 0%,#ffd6a5 34%,#ff8f6b 58%,#4a3f76 80%,#141a2e 100%);
    border:1px solid rgba(255,255,255,.18);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#fff,#f2c14e 60%,#b8781f);border:1px solid rgba(0,0,0,.4);
    box-shadow:0 0 14px rgba(242,193,78,.75);cursor:grab}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.4);
    background:radial-gradient(circle at 35% 32%,#fff,#f2c14e 60%,#b8781f);box-shadow:0 0 14px rgba(242,193,78,.75)}
  .ticks{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;color:var(--dim);opacity:.85}

  #credit{right:22px;bottom:22px;text-align:right;font-size:10px;letter-spacing:.18em;color:var(--dim);
    text-transform:uppercase;padding:9px 13px}
  #credit b{color:var(--ink);font-weight:400}
  #stats{right:22px;top:22px;font-size:10px;letter-spacing:.13em;color:var(--dim);padding:8px 12px;
    font-variant-numeric:tabular-nums;display:none}
  #stats.show{display:block}

  #loader{position:fixed;inset:0;display:grid;place-content:center;gap:26px;justify-items:center;
    background:radial-gradient(120% 90% at 50% 40%,#1b2735 0%,#0a0e14 70%);z-index:9;transition:opacity .9s ease}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .pagoda{display:grid;gap:5px;justify-items:center}
  #loader .pagoda i{display:block;height:7px;background:linear-gradient(90deg,var(--verm),#8e2f34);
    border-radius:2px;animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
  #loader .pagoda i:nth-child(1){width:12px;height:18px;background:linear-gradient(180deg,var(--gold),#a97a1c);animation-delay:.05s}
  #loader .pagoda i:nth-child(2){width:52px;animation-delay:.12s}
  #loader .pagoda i:nth-child(3){width:74px;animation-delay:.19s}
  #loader .pagoda i:nth-child(4){width:96px;animation-delay:.26s}
  #loader .pagoda i:nth-child(5){width:118px;animation-delay:.33s}
  #loader .pagoda i:nth-child(6){width:140px;animation-delay:.4s}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scaleX(.4)}to{opacity:1;transform:none}}
  #loader .txt{font-family:"Shippori Mincho B1",serif;font-size:13px;letter-spacing:.5em;color:#cdd8e3;opacity:.85}
  #loader .bar{width:210px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--sakura),transparent);
    animation:sweep 1.25s linear infinite}
  @keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(420%)}}

  @media (max-width:760px){ #title{max-width:70vw;padding-right:40px} #dock{width:calc(100vw - 44px)} #credit{display:none} }
</style>
</head>
<body>
<div id="stage"></div>

<div id="title" class="panel">
  <h1>五重塔の庭</h1>
  <div class="sub">Voxel Pagoda Garden</div>
  <div class="jp">花霧の塔</div>
  <div class="rule"></div>
  <div class="note">Five-storied pagoda, koi pond, moon gate &amp; ten thousand cherry petals —
    built from <span id="voxCount">—</span> hand-placed voxels. Drag to orbit · scroll to zoom.</div>
</div>

<div id="dock" class="panel">
  <div class="tod">
    <div class="todhead"><span class="lbl" style="margin:0">Hour of the day</span><span id="todName">Golden Hour</span></div>
    <input id="tod" type="range" min="0" max="1000" value="550">
    <div class="ticks"><span>NOON</span><span>GOLDEN</span><span>DUSK</span><span>NIGHT</span></div>
  </div>
  <div class="row"><span class="lbl">Vantage</span>
    <button data-view="overview" class="on">Overview</button>
    <button data-view="pagoda">Pagoda</button>
    <button data-view="roof">Eaves</button>
    <button data-view="pond">Koi Pond</button>
    <button data-view="blossom">Blossoms</button>
    <button data-view="zen">Zen Garden</button>
    <button data-view="gate">Torii</button>
    <button data-view="bamboo">Grove</button>
    <button data-view="hill">Hillside</button>
    <button data-view="aerial">Aerial</button>
  </div>
  <div class="row"><span class="lbl">Scene</span>
    <button id="btnOrbit" class="on">Auto-orbit</button>
    <button id="btnPetals" class="on">Petal storm</button>
    <button id="btnBirds" class="on">Birds</button>
    <button id="btnStats">Voxel stats</button>
    <button id="btnShot">Save PNG</button>
  </div>
</div>

<div id="stats" class="panel"></div>
<div id="credit" class="panel">voxel · <b>three.js</b> · face-culled &amp; AO-baked</div>

<div id="loader">
  <div class="pagoda"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="txt">築 庭 中</div>
  <div class="bar"><i></i></div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ══════════════════════════════════════════════════════════════
   0 · deterministic randomness + value noise
   ══════════════════════════════════════════════════════════════ */
let _seed = 20261102;
function rnd() {
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));
const pick = (a) => a[Math.floor(rnd() * a.length)];
function h3(x, y, z) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13;
  return (h >>> 0) / 4294967295;
}
function noise2(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = h3(ix, 0, iz), b = h3(ix + 1, 0, iz), c = h3(ix, 0, iz + 1), d = h3(ix + 1, 0, iz + 1);
  return (a * (1 - sx) + b * sx) * (1 - sz) + (c * (1 - sx) + d * sx) * sz;
}
function fbm(x, z, oct = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise2(x * f, z * f); n += a; f *= 2; a *= 0.5; }
  return s / n;
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0 || 1e-6), 0, 1); return t * t * (3 - 2 * t); };

/* ══════════════════════════════════════════════════════════════
   1 · voxel store
   ══════════════════════════════════════════════════════════════ */
const OFF = 128;
const keyOf = (x, y, z) => (x + OFF) | ((y + OFF) << 8) | ((z + OFF) << 16);
const keyXZ = (x, z) => (x + OFF) | ((z + OFF) << 8);
const solid = new Map(), glowV = new Map(), waterV = new Map(), coarse = new Map();
const HG = new Int16Array(65536).fill(-9999);      // terrain surface height per column
const WLV = 5;                                     // water surface level (top of water voxels)
const petalsOnGround = [];                         // [{x,z,w}] fallen-petal tint sources

function V(x, y, z, c, store) {
  store = store || solid;
  if (typeof c !== 'number' || !(c > 0) || c > 0xffffff) return;   // never paint black on a bad tint
  store.set(keyOf(x | 0, y | 0, z | 0), c);
}
const solidAt = (x, y, z) => solid.has(keyOf(x, y, z));
function topAt(x, z) {
  const i = keyXZ(x, z); const h = HG[i];
  return h === -9999 ? null : h;
}
/* ground level to place props on (returns y of first free cell) */
function groundAt(x, z) {
  const h = topAt(x, z);
  if (h === null) return WLV + 1;
  return h + 1;
}
const isWet = (x, z) => waterV.has(keyXZ(x, z));

/* shape helpers -------------------------------------------------- */
function box(x0, y0, z0, x1, y1, z1, c, store) {
  for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
    for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
      for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++) V(x, y, z, c, store);
}
function shell(x0, y0, z0, x1, y1, z1, c, store) {
  for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++)
    for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++)
      for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++) {
        const edge = (x === x0 || x === x1 || y === y0 || y === y1 || z === z0 || z === z1);
        if (edge) V(x, y, z, c, store);
      }
}
function ellip(cx, cy, cz, rx, ry, rz, c, o = {}) {
  const dens = o.dens === undefined ? 1 : o.dens, hollow = o.hollow, jitterCol = o.jitterCol;
  for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let z = Math.floor(cz - rz); z <= Math.ceil(cz + rz); z++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
        const d = dx * dx + dy * dy + dz * dz;
        if (d > 1 + 0.28) continue;
        if (d < 0.45 && hollow) continue;
        if (dens < 1 && h3(x, y, z) > dens + d * 0.18) continue;
        let cc = c;
        if (jitterCol) cc = jitterCol(x, y, z, d) ?? c;
        V(x, y, z, cc, o.store);
      }
}
function cyl(cx, cz, y0, y1, r, c, o = {}) {
  const R = Math.ceil(r);
  for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++)
    for (let z = Math.floor(cz - R); z <= Math.ceil(cz + R); z++) {
      const dx = x - cx, dz = z - cz, d = Math.sqrt(dx * dx + dz * dz);
      if (d > r + 0.34) continue;
      if (o.ring && d < r - 0.9) continue;
      for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) V(x, y, z, c, o.store);
    }
}
function line3(x0, y0, z0, x1, y1, z1, c, store) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  for (let i = 0; i <= n; i++) {
    const t = n ? i / n : 0;
    V(Math.round(lerp(x0, x1, t)), Math.round(lerp(y0, y1, t)), Math.round(lerp(z0, z1, t)), c, store);
  }
}
function tintTop(x, z, mix, fn) { /* recolour the top voxel of a column */
  const i = keyXZ(x, z), h = HG[i];
  if (h === -9999) return;
  const k = keyOf(x, h, z), c0 = solid.get(k);
  if (c0 === undefined) return;
  solid.set(k, fn(c0, mix));
}
function mixHex(a, b, t) {
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  return (Math.round(lerp(ar, br, t)) << 16) | (Math.round(lerp(ag, bg, t)) << 8) | Math.round(lerp(ab, bb, t));
}
function scaleHex(a, m) {
  const r = clamp(Math.round(((a >> 16) & 255) * m), 0, 255);
  const g = clamp(Math.round(((a >> 8) & 255) * m), 0, 255);
  const b = clamp(Math.round((a & 255) * m), 0, 255);
  return (r << 16) | (g << 8) | b;
}

/* ══════════════════════════════════════════════════════════════
   2 · mesher — hidden-face culling + per-corner ambient occlusion
   ══════════════════════════════════════════════════════════════ */
const BRIGHT = [[0.87, 0.72], [1.0, 0.44], [0.80, 0.65]];   // [axis][sign]
const AOTAB = [1.0, 0.80, 0.61, 0.44];
const FACES = [];
for (let a = 0; a < 3; a++) for (const s of [1, -1]) {
  const p = (a + 1) % 3, q = (a + 2) % 3;
  const n = [0, 0, 0]; n[a] = s;
  const ap = [0, 0, 0]; ap[p] = 1;
  const aq = [0, 0, 0]; aq[q] = 1;
  let uv = s > 0 ? [[0, 0], [1, 0], [1, 1], [0, 1]] : [[0, 0], [0, 1], [1, 1], [1, 0]];
  const verts = uv.map(([eu, ev]) => { const o = [0, 0, 0]; o[a] = s > 0 ? 1 : 0; o[p] = eu; o[q] = ev; return o; });
  const ao = uv.map(([eu, ev]) => [eu * 2 - 1, ev * 2 - 1]);
  FACES.push({ n, ap, aq, verts, ao, b: BRIGHT[a][s > 0 ? 1 : 0] });
}

function buildGeometry(map, opt = {}) {
  const size = opt.size || 1, ox = opt.ox || 0, oy = opt.oy || 0, oz = opt.oz || 0;
  const aoAmt = opt.ao === undefined ? 1 : opt.ao;
  const fbAmt = opt.faceB === undefined ? 1 : opt.faceB;
  const jit = opt.jit === undefined ? 0.075 : opt.jit;
  const occ = opt.occ || ((x, y, z) => map.has(keyOf(x, y, z)) || solid.has(keyOf(x, y, z)));
  const pos = [], nor = [], col = [], idx = [];
  const c = new THREE.Color();
  for (const [k, hex] of map) {
    const x = (k & 255) - OFF, y = ((k >> 8) & 255) - OFF, z = ((k >> 16) & 255) - OFF;
    const jf = 1 + (h3(x, y, z) - 0.5) * jit;
    c.setHex(hex);
    for (const f of FACES) {
      const nx = x + f.n[0], ny = y + f.n[1], nz = z + f.n[2];
      if (map.has(keyOf(nx, ny, nz))) continue;
      const base = pos.length / 3;
      for (let i = 0; i < 4; i++) {
        const o = f.verts[i];
        pos.push((x + o[0]) * size + ox, (y + o[1]) * size + oy, (z + o[2]) * size + oz);
        nor.push(f.n[0], f.n[1], f.n[2]);
        let m = 1 + (f.b - 1) * fbAmt;
        if (aoAmt > 0) {
          const su = f.ao[i][0], sv = f.ao[i][1];
          const a1 = occ(nx + su * f.ap[0], ny + su * f.ap[1], nz + su * f.ap[2]);
          const a2 = occ(nx + sv * f.aq[0], ny + sv * f.aq[1], nz + sv * f.aq[2]);
          const cr = occ(nx + su * f.ap[0] + sv * f.aq[0], ny + su * f.ap[1] + sv * f.aq[1], nz + su * f.ap[2] + sv * f.aq[2]);
          const ao = (a1 && a2) ? 3 : (a1 + a2 + cr);
          m *= 1 + (AOTAB[ao] - 1) * aoAmt;
        }
        m *= jf;
        col.push(c.r * m, c.g * m, c.b * m);
      }
      idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return { geo: g, faces: idx.length / 3 };
}

/* ══════════════════════════════════════════════════════════════
   3 · renderer / scene / lights / sky
   ══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
/* harness / quality flags:  #still,fast,debug  */
const FLAGS = new Set((location.hash || '').replace(/^#/, '').split(/[&,]/));
const FAST = FLAGS.has('fast');
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !FAST;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const fogCol = new THREE.Color(0xc3d8e6);
scene.fog = new THREE.FogExp2(fogCol.getHex(), 0.0032);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.6, 2600);
camera.position.set(128, 96, 150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 24, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.maxPolarAngle = Math.PI * 0.492;
controls.minDistance = 16;
controls.maxDistance = 480;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;

const hemi = new THREE.HemisphereLight(0xbcd8f2, 0x53683d, 2.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3df, 5.0);
sun.castShadow = !FAST;
sun.shadow.mapSize.set(1400, 1400);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 520;
sun.shadow.camera.left = -96; sun.shadow.camera.right = 96;
sun.shadow.camera.top = 110; sun.shadow.camera.bottom = -70;
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.7;
scene.add(sun); scene.add(sun.target);
sun.target.position.set(0, 18, 0);
const fill = new THREE.DirectionalLight(0x9fc0e8, 1.0);
fill.position.set(-90, 60, -120);
scene.add(fill);
const lanternLights = [];
for (let i = 0; i < 5; i++) {
  const p = new THREE.PointLight(0xffb963, 0, 46, 2);
  p.visible = false; scene.add(p); lanternLights.push(p);
}

/* sky dome ------------------------------------------------------- */

/* bamboo fence --------------------------------------------------- */
function bambooFence(x0, z0, x1, z1, h = 3) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0));
  for (let i = 0; i <= n; i++) {
    const x = Math.round(lerp(x0, x1, i / n)), z = Math.round(lerp(z0, z1, i / n));
    const gy = groundAt(x, z);
    const post = i % 3 === 0;
    for (let y = 0; y < h + (post ? 1 : 0); y++)
      V(x, gy + y, z, post ? P.bambooD : mixHex(P.bamboo, P.bambooD, h3(x, y, z) * 0.6));
    if (i > 0) {
      const px = Math.round(lerp(x0, x1, (i - 1) / n)), pz = Math.round(lerp(z0, z1, (i - 1) / n));
      line3(px, gy + 1, pz, x, gy + 1, z, mixHex(P.bambooL, P.bamboo, 0.4));
      line3(px, gy + h - 1, pz, x, gy + h - 1, z, mixHex(P.bambooL, P.bamboo, 0.4));
    }
  }
}

/* hedge row ------------------------------------------------------ */
function hedge(x0, z0, x1, z1, h = 2) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0));
  for (let i = 0; i <= n; i++) {
    const x = Math.round(lerp(x0, x1, i / n)), z = Math.round(lerp(z0, z1, i / n));
    const gy = groundAt(x, z);
    const hh = h + (h3(x, 7, z) > 0.5 ? 1 : 0);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      if (Math.abs(dx) + Math.abs(dz) > 1 + (h3(x + dx, 8, z + dz) > 0.55 ? 1 : 0)) continue;
      for (let y = 0; y <= hh; y++) {
        const top = y === hh;
        if (top && h3(x, y * 3, z) > 0.72) continue;
        V(x + dx, gy + y, z + dz, mixHex(P.grass3, top ? P.moss : P.pineC, h3(x + dx, gy + y, z + dz) * 0.85));
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   8 · the five-storied pagoda
   ══════════════════════════════════════════════════════════════ */
function buildPagoda(cx, cz) {
  const y0 = 11;
  const HW = [10, 8, 7, 5, 4];
  const WALL = [7, 6, 5, 5, 5];
  const OV = [16, 13, 11, 9, 8];
  const LV = [5, 4, 4, 3, 3];
  /* stone plinth */

  box(cx - HW[0] - 1, y0, cz - HW[0] - 1, cx + HW[0] + 1, y0, cz + HW[0] + 1, mixHex(P.graniteD, P.stone, 0.35));
  let yb = y0 + 1;
  for (let i = 0; i < 5; i++) {
    const hw = HW[i], wh = WALL[i];
    /* floor / balcony slab */
    const ext = i === 0 ? hw + 2 : hw + 3;
    box(cx - ext, yb, cz - ext, cx + ext, yb, cz + ext, mixHex(P.wood, P.woodD, 0.35));
    if (i > 0) box(cx - ext, yb - 1, cz - ext, cx + ext, yb - 1, cz + ext, mixHex(P.woodD, P.vermD, 0.4));
    /* corner + mid pillars */
    const pil = (px, pz) => {
      for (let y = 1; y <= wh; y++) {
        const taper = (y === wh && h3(px, y, pz) > 0.5) ? 0 : 1;
        if (!taper) continue;
        V(px, yb + y, pz, mixHex(P.verm, P.vermD, h3(px, y * 5, pz) * 0.45 + y / wh * 0.2));
      }
    };
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) pil(cx + sx * hw, cz + sz * hw);
    for (const s of [-1, 1]) { pil(cx + s * hw, cz); pil(cx, cz + s * hw); }
    /* walls, beams, openings */
    for (let f = 0; f < 4; f++) {
      const ax = f < 2 ? 1 : 0, az = f < 2 ? 0 : 1, sgn = f % 2 === 0 ? 1 : -1;
      for (let t = -hw; t <= hw; t++) {
        for (let y = 1; y <= wh; y++) {
          const px = cx + ax * t + az * sgn * hw, pz = cz + az * t + ax * sgn * hw;
          const isBeam = (y === 1 || y === wh || (i > 0 && y === Math.ceil(wh / 2)));
          const open = i === 0 ? (Math.abs(t) <= 1 && y <= 4) : (Math.abs(Math.abs(t) - hw * 0.5) <= 1 && y >= 2 && y <= 3);

          let c = mixHex(P.plaster, P.plasterD, h3(px, y * 7, pz) * 0.5);
          if (isBeam) c = mixHex(P.wood, P.vermD, 0.35 + h3(px, y, pz) * 0.3);
          if (y === wh - 1 && ((t + 40) % 4 < 2)) c = mixHex(P.woodD, P.wood, 0.4);
          V(px, yb + y, pz, c);
        }
      }
    }
    /* railing on upper balconies */
    if (i > 0) {
      for (let t = -ext; t <= ext; t++) for (const s of [-1, 1]) {
        const px = t, pz = s * ext, px2 = s * ext, pz2 = t;
        for (const [X, Z] of [[cx + px, cz + pz], [cx + px2, cz + pz2]]) {
          if ((Math.abs(t) + (s + 1) * 3) % 2 === 0) { V(X, yb + 1, Z, P.verm); V(X, yb + 2, Z, P.vermL); }
          V(X, yb + 3, Z, mixHex(P.verm, P.gold, 0.15));
        }
      }
    }
    /* hanging lanterns at eave corners of the two lowest roofs */
    if (i < 3) for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const lx = cx + sx * (OV[i] - 2), lz = cz + sz * (OV[i] - 2);
      const ly = yb + wh + 1;
      V(lx, ly, lz, P.ink); V(lx, ly - 1, lz, P.lampW, glowV); V(lx, ly - 2, lz, P.gold);
      addGlow(lx + 0.5, ly - 1.5, lz + 0.5, 0xffd08a, 6.5);
    }
    /* roof */
    const yEave = yb + wh + 2;
    hipRoof(cx, cz, yEave + LV[i] - 1, Math.max(2, hw - 3), OV[i], LV[i], {
      tile: P.tile, tile2: P.tileL, ridge: P.tileD, soffit: mixHex(P.plasterD, P.woodL, 0.35),
      lift: Math.max(1, Math.round(OV[i] * 0.16)), gold: P.gold,
    });
    /* wind chimes on the lowest roof corners */
    if (i === 0) for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const lx = cx + sx * (OV[0] + 1), lz = cz + sz * (OV[0] + 1);
      V(lx, yEave + 1, lz, P.gold); V(lx, yEave, lz, P.goldD);
      V(lx, yEave - 1, lz, pick([P.sakA, P.white, P.sakB])); V(lx, yEave - 2, lz, pick([P.sakA, P.white]));
    }
    yb = yEave + LV[i] + 1;
  }
  /* sōrin finial */
  const fy = yb;
  box(cx - 1, fy, cz - 1, cx + 1, fy + 1, cz + 1, P.goldD);
  for (let i = 0; i < 9; i++) {
    const y = fy + 2 + i;
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++)
      if (Math.abs(dx) + Math.abs(dz) > 0 && !(dx && dz)) V(cx + dx, y, cz + dz, i % 2 ? P.gold : P.goldL);
    V(cx, y, cz, P.goldD);

    if (Math.abs(dx) + Math.abs(dz) === 1) V(cx + dx, fy + 12, cz + dz, P.gold);
  V(cx, fy + 13, cz, P.goldL); V(cx, fy + 14, cz, P.lampW, glowV); V(cx, fy + 15, cz, P.sakW, glowV);
  addGlow(cx + 0.5, fy + 15.5, cz + 0.5, 0xffe6b0, 14, false);

  const iy = y0 + 1;

  box(cx - 2, iy + 1, cz - 2, cx + 2, iy + 1, cz + 2, P.goldD);
  box(cx - 1, iy + 2, cz - 1, cx + 1, iy + 4, cz + 1, P.gold);
  V(cx, iy + 5, cz, P.goldL); V(cx - 1, iy + 3, cz, P.goldL); V(cx + 1, iy + 3, cz, P.goldL);
  for (const s of [-1, 1]) { V(cx + s * 2, iy + 2, cz, P.goldD); V(cx, iy + 2, cz + s * 2, P.goldD); }
  for (const [dx, dz] of [[2, 2], [-2, 2], [2, -2], [-2, -2]]) { V(cx + dx, iy + 1, cz + dz, P.lamp, glowV); V(cx + dx, iy + 2, cz + dz, P.lamp, glowV); }
  addGlow(cx + 0.5, iy + 3, cz + 0.5, 0xffcf8a, 12);
  addGlow(cx + 0.5, iy + 2, cz + 11.5, 0xffc07a, 8);
  addGlow(cx + 0.5, iy + 2, cz - 11.5, 0xffc07a, 8);
}

/* walled stone terrace around the pagoda ------------------------ */
function buildTerrace(cx, cz) {
  const T = 21;
  for (let x = cx - T; x <= cx + T; x++) for (let z = cz - T; z <= cz + T; z++) {
    const cut = Math.max(Math.abs(x - cx), Math.abs(z - cz));
    if (cut > T || (cut > T - 3 && (Math.abs(x - cx) > T - 3 && Math.abs(z - cz) > T - 3))) continue;
    const gy = Ht[keyXZ(x, z)] === -9999 ? 8 : Ht[keyXZ(x, z)];
    for (let y = gy + 1; y <= 10; y++) {
      let c = mixHex(P.graniteD, P.stoneD, h3(x, y, z) * 0.5);
      if (y === 10) {
        const g = ((Math.abs(x - cx) % 6 < 1) || (Math.abs(z - cz) % 6 < 1));
        c = g ? mixHex(P.stoneL, P.granite, 0.4) : mixHex(P.granite, P.stone, h3(x, 20, z) * 0.5);
      }
      V(x, y, z, c);
    }
  }
  /* balustrade + stairs on the four faces */
  for (let t = -T; t <= T; t++) for (const [f, s] of [[0, 1], [0, -1], [1, 1], [1, -1]]) {
    const x = f === 0 ? cx + t : cx + s * T, z = f === 0 ? cz + s * T : cz + t;
    if (Math.abs(t) > 4 && Math.abs(t) < 9) continue;
    if (Math.abs(t) === T) continue;
    const post = (t + T) % 5 === 0;
    for (let y = 11; y <= (post ? 13 : 12); y++) V(x, y, z, mixHex(P.granite, P.stoneL, h3(x, y, z) * 0.55));
    if (post) V(x, 14, z, mixHex(P.stoneL, P.gold, 0.12));
  }
  for (const [dx, dz] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
    for (let st = 0; st < 2; st++) {
      const ax = dx === 0 ? 7 : 1, az = dx === 0 ? 1 : 7;
      const ox = cx + dx * (T + 1 + st * 2), oz = cz + dz * (T + 1 + st * 2);
      for (let a = -ax; a <= ax; a++) for (let b = -az; b <= az; b++)
        V(ox + (dx === 0 ? a : b), 10 - st - 1, oz + (dx === 0 ? b : a), mixHex(P.granite, P.stoneL, h3(ox + a, st, oz + b) * 0.4));
    }
  }
  stoneLantern(cx - T + 3, cz - T + 3, { y: 11, scale: 1 });
  stoneLantern(cx + T - 3, cz - T + 3, { y: 11, scale: 1 });
  stoneLantern(cx - T + 3, cz + T - 3, { y: 11, scale: 1 });
  stoneLantern(cx + T - 3, cz + T - 3, { y: 11, scale: 1 });
}

/* shrine, gate walls, misc props --------------------------------- */
function buildShrine(cx, cz) {
  const gy = groundAt(cx, cz);
  box(cx - 5, gy, cz - 4, cx + 5, gy + 1, cz + 4, mixHex(P.woodD, P.graniteD, 0.4));
  for (let x = -4; x <= 4; x += 4) for (let z = -3; z <= 3; z += 3)
    for (let y = 2; y <= 6; y++) V(cx + x, gy + y, cz + z, mixHex(P.verm, P.vermD, h3(x, y, z) * 0.4));
  for (let x = -4; x <= 4; x++) for (let z = -3; z <= 3; z++)

  box(cx - 2, gy + 2, cz - 4, cx + 2, gy + 3, cz - 4, mixHex(P.woodD, P.goldD, 0.3));
  V(cx, gy + 4, cz - 4, P.gold);
  torii(cx, cz - 8, 5, 7, groundAt(cx, cz - 8));
  stoneLantern(cx - 5, cz - 7, { scale: 1 }); stoneLantern(cx + 5, cz - 7, { scale: 1 });
  for (const s of [-1, 0, 1]) { V(cx + s * 2, gy + 6, cz - 4, P.white); V(cx + s * 2, gy + 5, cz - 4, P.white); V(cx + s * 2 + 1, gy + 4, cz - 4, P.white); }
  addGlow(cx + 0.5, gy + 4, cz - 3.5, 0xffcf92, 7);

}
function stoneBench(x, z) {

}

    if (d === 2) for (let y = 1; y <= 2; y++) V(x + dx, gy + y, z + dz, mixHex(P.granite, P.stoneD, h3(x + dx, y, z + dz) * 0.6));

function stoneStack(x, z) { /* small stupa / stacked-stone cairn */

        V(x + dx, gy + i, z + dz, mixHex(P.granite, P.stoneL, i / rs.length * 0.5 + h3(x + dx, i, z + dz) * 0.3));

function rockPile(cx, cz, r, h, col = P.graniteD) {

    let dy = 0;
    for (const [lx, lz, ls] of lumps) {

      dy = Math.max(dy, t <= 0 ? 0 : Math.round(h * ls * Math.pow(t, 0.62) + (h3(cx + dx, 7, cz + dz) - 0.5) * 1.2));
    }
    if (dy <= 0) continue;
    for (let y = 0; y <= dy; y++) {
      const mossy = y < dy * 0.5 && h3(cx + dx, 3, cz + dz + y) > 0.55;
      V(cx + dx, gy + y, cz + dz, mossy

/* ══════════════════════════════════════════════════════════════
   9 · flora
   ══════════════════════════════════════════════════════════════ */
const cherryTrees = [];      // petal sources & ground tint
function leafCol(pal, x, y, z, cy, ry) {

}
function trunk(x, z, y0, h, o = {}) {

function branch(px, py, pz, vx, vy, vz, len, col) {

/* — cherry / sakura ————————————————————————————— */
function cherryTree(x, z, o = {}) {
  const gy = groundAt(x, z), big = o.big ?? 1;

  for (let i = 0; i < (FAST ? 4 : 9); i++) {
    const m = new Map();
    const n = 5 + Math.floor(rnd() * 5);
    for (let j = 0; j < n; j++) {
      const cx = ri(-6, 6), cz = ri(-4, 4), cy = rnd() * 3.4;
      const rx = 2.6 + rnd() * 3.4, ry = 1.9 + rnd() * 2.3, rz = 2.4 + rnd() * 1.6;
      for (let x = cx - rx; x <= cx + rx; x++) for (let y = cy - ry; y <= cy + ry; y++) for (let z = cz - rz; z <= cz + rz; z++) {
        const d = Math.pow((x - cx) / rx, 2) + Math.pow((y - cy) / ry, 2) + Math.pow((z - cz) / rz, 2);
        if (d > 1 || h3(x, y, z) > 0.93) continue;
        const top = clamp(1 - (y - (cy - ry)) / (ry * 2), 0, 1);
        m.set(keyOf(Math.round(x), Math.round(y), Math.round(z)), mixHex(0xdfe6f2, 0xffffff, 0.35 + top * 0.5 + h3(x, y, z) * 0.2));
      }
    }
    const geo = buildGeometry(m, { ao: 0.35, faceB: 0.2, jit: 0.05, occ: (x, y, z) => m.has(keyOf(x, y, z)) }).geo;
    const mesh = new THREE.Mesh(geo, cloudMat);
    const a = rnd() * Math.PI * 2, r = 210 + rnd() * 250;
    mesh.position.set(Math.cos(a) * r, 104 + rnd() * 96, Math.sin(a) * r);
    mesh.scale.setScalar(3.4 + rnd() * 4.2);
    mesh.userData.sp = 0.6 + rnd() * 1.4;
    scene.add(mesh); clouds.push(mesh);
  }
}
function updateClouds(dt) {
  for (const c of clouds) {
    c.position.x += dt * c.userData.sp;
    if (c.position.x > 470) c.position.x = -470;
  }
}

/* ── fireflies ─────────────────────────────────────────────── */
let flies, flyData = [];
function buildFlies() {
  const N = 150, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const t = cherryTrees[Math.floor(rnd() * cherryTrees.length)];
    const a = rnd() * 6.28, r = rnd() * t.r * 2.2;
    const x = t.x + Math.cos(a) * r, z = t.z + Math.sin(a) * r;
    const gy = Ht[keyXZ(clamp(Math.round(x), -127, 127), clamp(Math.round(z), -127, 127))];
    const y = (gy === -9999 ? 8 : gy) + 1 + rnd() * 6;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    flyData.push({ x, y, z, ph: rnd() * 6.28, sp: rr(0.5, 1.6), r: rr(0.6, 2.6) });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  flies = new THREE.Points(g, new THREE.PointsMaterial({
    size: 0.9, map: SOFT_TEX, transparent: true, depthWrite: false, vertexColors: true,
    blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
  flies.frustumCulled = false; flies.renderOrder = 8;
  scene.add(flies);
}
function updateFlies(t) {
  if (!flies) return;
  flies.visible = fireflyAmt > 0.02;
  if (!flies.visible) return;
  const p = flies.geometry.attributes.position.array, c = flies.geometry.attributes.color.array;
  for (let i = 0; i < flyData.length; i++) {
    const d = flyData[i];
    p[i * 3] = d.x + Math.sin(t * d.sp + d.ph) * d.r;
    p[i * 3 + 1] = d.y + Math.sin(t * d.sp * 0.7 + d.ph * 2) * 0.9;
    p[i * 3 + 2] = d.z + Math.cos(t * d.sp * 0.85 + d.ph) * d.r;
    const blink = Math.pow(Math.max(0, Math.sin(t * 2.2 + d.ph * 3)), 3);
    const k = blink * fireflyAmt;
    c[i * 3] = 1.0 * k; c[i * 3 + 1] = 0.92 * k; c[i * 3 + 2] = 0.45 * k;
  }
  flies.geometry.attributes.position.needsUpdate = true;
  flies.geometry.attributes.color.needsUpdate = true;
}

/* ── strolling visitors ────────────────────────────────────── */
const folks = [];
function makePerson(kimono, hair, parasol) {
  const g = new THREE.Group();
  const M = (c) => new THREE.MeshLambertMaterial({ color: c });
  const skin = M(0xf0d3b8);
  for (const s of [-0.5, 0.5]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), M(scaleHex(kimono, 0.7)));
    leg.position.set(0, 1, s); g.add(leg);
  }
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3, 1.6), M(kimono)); body.position.y = 3.5; g.add(body);
  const obi = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1, 1.8), M(P.gold)); obi.position.y = 3.2; g.add(obi);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.3, 1.3), skin); head.position.y = 5.7; g.add(head);
  const hairM = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.5), M(hair)); hairM.position.y = 6.3; g.add(hairM);
  const arms = [];
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.4, 0.9), M(kimono));
    arm.position.set(0, 3.6, s * 1.5); g.add(arm); arms.push(arm);
  }
  if (parasol) {
    const pole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.5, 0.3), M(P.woodD)); pole.position.set(0, 5.5, 1.6); g.add(pole);
    const um = new THREE.Mesh(new THREE.ConeGeometry(2.9, 1.3, 8), M(parasol));
    um.position.set(0, 8.1, 1.6); g.add(um);
  }
  g.userData = { arms };
  return g;
}
function buildFolks() {
  const routes = [
    { pts: [[0, -56], [0, -40], [0, -26], [8, -22], [16, -18], [19, -8], [19, 2], [24, 8], [31, 12], [38, 11]], cols: [P.kimB, P.white, 0x4a4a52] },
    { pts: [[46, 15], [49, 24], [47, 34], [40, 40], [32, 39], [26, 34], [21, 28]], cols: [P.kimA, P.kimC, 0x3a2a22] },
    { pts: [[-14, 12], [-24, 8], [-34, 4], [-44, 6], [-48, 10], [-44, 16], [-36, 20], [-28, 22]], cols: [P.kimE, P.kimC, 0x2a2420] },
    { pts: [[-30, 26], [-36, 30], [-42, 28], [-46, 34], [-40, 40], [-32, 38], [-28, 32]], cols: [P.kimD, P.kimC, 0x503828] },
  ];
  routes.forEach((rt, i) => {
    const g = makePerson(rt.cols[0], rt.cols[2], i === 0 ? 0xc9364a : (i === 2 ? 0xe8c15a : 0));
    scene.add(g);
    folks.push({ g, pts: rt.pts, seg: 0, t: rnd(), sp: 0.055 + rnd() * 0.03, dir: 1 });
  });
}
function updateFolks(dt, t) {
  for (const f of folks) {
    f.t += dt * f.sp;
    if (f.t >= 1) { f.t = 0; f.seg = (f.seg + 1) % (f.pts.length - 1); }
    const a = f.pts[f.seg], b = f.pts[(f.seg + 1) % (f.pts.length - 1)];
    const x = lerp(a[0], b[0], f.t), z = lerp(a[1], b[1], f.t);
    const gy = groundAt(clamp(Math.round(x), -127, 127), clamp(Math.round(z), -127, 127));
    f.g.position.set(x, gy - 0.2 + Math.abs(Math.sin(t * 5.5 + f.sp * 40)) * 0.22, z);
    f.g.rotation.y = Math.atan2(-(b[1] - a[1]), b[0] - a[0]) - Math.PI / 2;
    const sw = Math.sin(t * 5.5 + f.sp * 40) * 0.5;
    f.g.userData.arms[0].rotation.x = sw; f.g.userData.arms[1].rotation.x = -sw;
  }
}
/* ══════════════════════════════════════════════════════════════
   13 · views, UI, main loop
   ══════════════════════════════════════════════════════════════ */
const VIEWS = {
  overview: { p: [-128, 47, 62], t: [0, 42, 0] },
  hill: { p: [96, 63, 116], t: [0, 40, 6] },
  pagoda: { p: [66, 86, 86], t: [0, 42, 0] },
  roof: { p: [36, 56, 44], t: [2, 46, 2] },
  pond: { p: [52, 23, 56], t: [26, 8, 14] },
  blossom: { p: [38, 41, 57], t: [27, 15, 18] },
  zen: { p: [-38, 27, 74], t: [-38, 10, 31] },
  gate: { p: [14, 16, -68], t: [0, 15, -50] },
  bamboo: { p: [-80, 25, -40], t: [-48, 14, -26] },
  aerial: { p: [10, 212, 62], t: [0, 8, 2] },
};
const tw = { on: false, k: 0, dur: 1, p0: new THREE.Vector3(), p1: new THREE.Vector3(), t0: new THREE.Vector3(), t1: new THREE.Vector3() };
function flyTo(v, dur = 1.7) {
  const s = VIEWS[v] || VIEWS.overview;
  tw.p0.copy(camera.position); tw.t0.copy(controls.target);
  tw.t1.set(...s.t);
  tw.p1.copy(findCam(new THREE.Vector3(...s.p), tw.t1));
  tw.k = 0; tw.dur = dur; tw.on = true;
}

/* Keep camera shots out of the geometry. The camera itself must sit in free
   space, and the line of sight should run as far as possible before hitting
   anything — the subject is allowed to block the last stretch. */
const EPS = 0.45;
const nbr = (x, y, z) => solidAt(Math.round(x), Math.round(y), Math.round(z)) ||
  solidAt(Math.round(x + EPS), Math.round(y), Math.round(z)) || solidAt(Math.round(x - EPS), Math.round(y), Math.round(z)) ||
  solidAt(Math.round(x), Math.round(y + EPS), Math.round(z)) || solidAt(Math.round(x), Math.round(y - EPS), Math.round(z)) ||
  solidAt(Math.round(x), Math.round(y), Math.round(z + EPS)) || solidAt(Math.round(x), Math.round(y), Math.round(z - EPS));
function clearRun(p, t) {
  const dist = p.distanceTo(t), skip = Math.min(2.5, dist * 0.1);
  if (dist - skip < 1) return dist;
  const n = Math.max(4, Math.ceil(dist * 1.6));
  for (let i = 1; i <= n; i++) {
    const s = (skip + (dist - skip) * (i / n)) / dist;
    if (nbr(lerp(p.x, t.x, s), lerp(p.y, t.y, s), lerp(p.z, t.z, s))) return dist * s - skip;
  }
  return dist - skip;
}
function findCam(p1, t) {
  const dx = p1.x - t.x, dz = p1.z - t.z;
  const d0 = Math.max(Math.hypot(dx, dz), 8), az0 = Math.atan2(dz, dx), hy = Math.max(p1.y - t.y, 2);
  const yCap = t.y + Math.max(26, hy * 2.4);
  let best = null, bestScore = -1;
  scan:
  for (const gd of [0, 9, 20, 34, 52, 74])
    for (const ga of [0, 0.32, -0.32, 0.64, -0.64, 1.05, -1.05, 1.6, -1.6, 2.4, -2.4, Math.PI])
      for (const ky of [1, 1.35, 1.8, 2.5, 3.4]) {
        const az = az0 + ga, hd = d0 + gd, y = Math.min(t.y + hy * ky + gd * 0.2, yCap);
        const c = new THREE.Vector3(t.x + Math.cos(az) * hd, y, t.z + Math.sin(az) * hd);
        c.x = clamp(c.x, -152, 152); c.z = clamp(c.z, -152, 152);
        if (c.y < groundAt(Math.round(c.x), Math.round(c.z)) + 3) continue;
        if (nbr(c.x, c.y, c.z)) continue;
        const score = Math.min(1, clearRun(c, t) / Math.max(c.distanceTo(t) - 15, 1));
        if (score > bestScore) { bestScore = score; best = c; }
        if (bestScore > 0.9) break scan;
      }
  if (best) return best.setY(best.y + 1);
  let py = Math.max(p1.y, groundAt(Math.round(p1.x), Math.round(p1.z)) + 5);
  for (let g = 0; g < 260 && solidAt(Math.round(p1.x), Math.round(py), Math.round(p1.z)); g++) py += 1;
  return p1.clone().setY(py + 1);
}
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const el = (id) => document.getElementById(id);
function wireUI() {
  const tod = el('tod');
  tod.addEventListener('input', () => { state.tod = tod.value / 1000; applyTOD(state.tod); });
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach((o) => o.classList.remove('on'));
    b.classList.add('on');
    flyTo(b.dataset.view);
  }));
  const tg = (id, key, extra) => el(id).addEventListener('click', () => {
    state[key] = !state[key];
    el(id).classList.toggle('on', state[key]);
    if (extra) extra();
  });
  tg('btnOrbit', 'orbit', () => { controls.autoRotate = state.orbit; });
  tg('btnPetals', 'petals');
  tg('btnBirds', 'birds');
  el('btnStats').addEventListener('click', () => {
    statsEl.classList.toggle('show');
    el('btnStats').classList.toggle('on', statsEl.classList.contains('show'));
  });
  el('btnShot').addEventListener('click', () => {
    renderer.render(scene, camera);
    const a = document.createElement('a');
    a.download = 'voxel-pagoda-garden.png';
    a.href = renderer.domElement.toDataURL('image/png');
    a.click();
  });
  controls.addEventListener('start', () => {
    if (state.orbit) { state.orbit = false; controls.autoRotate = false; el('btnOrbit').classList.remove('on'); }
  });
}
const statsEl = el('stats');

let frames = 0;
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.06), t = clock.elapsedTime;
  if (tw.on) {
    tw.k = Math.min(1, tw.k + dt / tw.dur);
    const e = ease(tw.k);
    camera.position.lerpVectors(tw.p0, tw.p1, e);
    controls.target.lerpVectors(tw.t0, tw.t1, e);
    if (tw.k >= 1) tw.on = false;
  }
  skyU.uTime.value = t;
  if (waterMat) waterMat.uniforms.uTime.value = t;
  updatePetals(dt, t);
  updateKoi(dt, t);
  updateBirds(t);
  updateClouds(dt);
  updateFlies(t);
  updateFolks(dt, t);
  for (const s of glowSprites) {
    const f = s.userData.flick ? (0.82 + 0.18 * Math.sin(t * 7.3 + s.userData.ph) + 0.08 * Math.sin(t * 17 + s.userData.ph * 3)) : 1;
    s.material.opacity = s.userData.base * f;
    const w = 1 + 0.05 * Math.sin(t * 2.4 + s.userData.ph);
    s.scale.set(s.userData.scale * w, s.userData.scale * (s.userData.mirror ? 1.9 : 1) * w, 1);
  }
  for (const m of mists) m.material.opacity = 0.055 + 0.075 * mistAmt;
  controls.update();
  renderer.render(scene, camera);
  frames++;
  if (frames === 3) {
    el('loader').classList.add('gone');
    document.body.classList.add('ready');
    el('voxCount').textContent = stats.voxels.toLocaleString();
    if (location.hash.startsWith('#view=')) flyTo(location.hash.slice(6).split('&')[0], 0.01);
    const m = location.hash.match(/tod=([0-9.]+)/);
    if (m) { state.tod = clamp(parseFloat(m[1]), 0, 1); el('tod').value = state.tod * 1000; applyTOD(state.tod); }
    if (location.hash.includes('still')) { state.orbit = false; controls.autoRotate = false; }
  }
  if (frames % 30 === 0 && statsEl.classList.contains('show')) {
    statsEl.innerHTML = `voxels <b>${stats.voxels.toLocaleString()}</b> · quads <b>${stats.faces.toLocaleString()}</b><br>` +
      `draw calls ${renderer.info.render.calls} · tris ${renderer.info.render.triangles.toLocaleString()}<br>` +
      `petals ${state.petals ? PETAL_N : 0} · koi ${koi.length} · lanterns ${glowPoints.length}<br>` +
      `${Math.round(1 / Math.max(dt, 1e-4))} fps`;
  }
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── build ─────────────────────────────────────────────────── */
function build() {
  const t0 = performance.now();
  buildTerrain();
  buildZenExtras();
  buildMountains();
  buildStructures();
  buildRimForest();
  plantGarden();
  mergeWorld();
  buildWater();
  buildGlows();
  buildPetals();
  buildKoi();
  buildBirds();
  buildClouds();
  buildFlies();
  buildFolks();
  applyTOD(state.tod);
  mistAmt = 0.3;
  console.log(`garden built in ${(performance.now() - t0) | 0}ms · ${stats.voxels} voxels · ${stats.faces} quads`);
  wireUI();
  camera.position.set(210, 132, 268);
  controls.target.set(0, 30, 0);
  flyTo('overview', 4.2);
  animate();
}
requestAnimationFrame(() => setTimeout(build, 40));

/* headless harness hooks */
window.__garden = {
  setTod: (v) => { state.tod = clamp(v, 0, 1); el('tod').value = state.tod * 1000; applyTOD(state.tod); },
  view: (n, d = 0.01) => flyTo(n, d),
  orbit: (b) => { state.orbit = b; controls.autoRotate = b; },
  info: () => ({ ...stats, frames, tris: renderer.info.render.triangles, calls: renderer.info.render.calls }),
  debug: () => ({
    tod: +state.tod.toFixed(2), sun: sun.position.toArray().map((v) => +v.toFixed(1)),
    sunI: +sun.intensity.toFixed(2), sunC: '#' + sun.color.getHexString(),
    hemiI: +hemi.intensity.toFixed(2), fillI: +fill.intensity.toFixed(2),
    exp: +renderer.toneMappingExposure.toFixed(2), fogD: +scene.fog.density.toFixed(5),
    fogC: '#' + scene.fog.color.getHexString(),
    skyTop: '#' + skyU.uTop.value.getHexString(), skyBot: '#' + skyU.uBot.value.getHexString(),
    haze: '#' + skyU.uHaze.value.getHexString(), glow: +state.glowAmt.toFixed(2),
    skyVis: sky.visible, skyScale: sky.scale.x, wSky: '#' + (waterMat ? waterMat.uniforms.uSky.value.getHexString() : 0),
    pixelRatio: renderer.getPixelRatio(), size: renderer.getSize(new THREE.Vector2()).toArray(),
    camPos: camera.position.toArray().map((v) => +v.toFixed(1)), camTgt: controls.target.toArray().map((v) => +v.toFixed(1)),
    fov: camera.fov, tween: tw.on,
  }),
  hide: (name, v) => {
    const m = { clouds, mtn: mtnMesh, lit: litMesh, glow: glowMesh, sky, petals, flies, birds: birds.map((b) => b.g) };
    const o = m[name]; if (!o) return false;
    (Array.isArray(o) ? o : [o]).forEach((x) => (x.visible = !v));
    return true;
  },
  pick: (sx, sy) => {
    const rc = new THREE.Raycaster();
    rc.setFromCamera({ x: (sx / innerWidth) * 2 - 1, y: -(sy / innerHeight) * 2 + 1 }, camera);
    const hits = rc.intersectObjects(scene.children, true).slice(0, 3);
    return hits.map((hh) => ({
      d: +hh.distance.toFixed(1), p: hh.point.toArray().map((v) => +v.toFixed(1)),
      n: hh.object.name || hh.object.type,
      tris: hh.object.geometry ? (hh.object.geometry.index ? hh.object.geometry.index.count / 3 : 0) : 0,
    }));
  },
  cam: (px, py, pz, tx, ty, tz) => {
    tw.on = false; camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update();
  },
  probe: (px, py, pz, tx, ty, tz) => {
    const p = new THREE.Vector3(px, py, pz), t = new THREE.Vector3(tx, ty, tz);
    return { blocked: nbr(p.x, p.y, p.z), run: +clearRun(p, t).toFixed(1), d: +p.distanceTo(t).toFixed(1),
      ok: findCam(p, t).toArray().map((v) => +v.toFixed(1)) };
  },
  ground: (x, z) => groundAt(Math.round(x), Math.round(z)),
  vc: (x, y, z) => {
    const c = solid.get(keyOf(x | 0, y | 0, z | 0));
    return c === undefined ? null : '#' + c.toString(16).padStart(6, '0');
  },
  dark: (thr = 0.075) => {
    const out = [];
    for (const [k, c] of solid) {
      const lum = 0.2126 * ((c >> 16) & 255) + 0.7152 * ((c >> 8) & 255) + 0.0722 * (c & 255);
      if (lum > thr * 255) continue;
      const x = (k & 255) - OFF, y = ((k >> 8) & 255) - OFF, z = ((k >> 16) & 255) - OFF;
      if (Math.abs(x) > 78 || Math.abs(z) > 78 || y < 8 || y > 62) continue;
      out.push(x + ',' + y + ',' + z);
    }
    return out;
  },
};
