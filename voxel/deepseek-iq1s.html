    addCherryTree(-15.2, -1.0, 8.2, 6.5);
    addCherryTree(14.0, -2.7, 8.4, 6.2);
    addCherryTree(-20.2, -12.7, 6.0, 4.4);
    addCherryTree(-8.4, 12.7, 6.1, 4.3, "weeping");
    addMaple(21.0, 10.8, .72);
    addBamboo(-9.4, -13.1, 15);
    addShrub(-4.8, 12.5, 1.9, [0xf7c4d6, 0xffffff]);
    addShrub(12.5, 8.4, 1.6, [0xe7b45b, 0xf0d08a]);
    addShrub(-13.4, 6.4, 1.4, [0x9d8bde, 0xc1a8ef]);
    addBoulder(-14.0, .8, 6.3, 1.8, 1.0, 1.5, true);
    addGinkgo(23.2, -5.8, .82);
    addGinkgo(-23.8, 7.4, .62);
    addAzalea(-11.2, 10.5, 1.7, C.azalea);
    addAzalea(9.7, -1.6, 1.3, [0xf2c05a, 0xf6d18d]);
    addAzalea(-1.6, -2.7, 1.2, [0x9d8bde, 0xc1a8ef]);
    addMushrooms(-13.1, -7.9);
    addMushrooms(-4.8, -10.7);
    addPondIsland(3.4, 5.2, .9);
    addCascade(11.2, 4.3, 3.2);
    addZenGarden(17.1, 3.3, 3.4, 2.4);
    addFlowers();
    addGrassTufts();
    addShoreDetails();
    addPetalCarpet();
    addPergola();

    addFloatingIsland(-64, 47, -104, 2.05, "pine");
    addFloatingIsland(51, 39, -122, 1.5, "cherry");
    addFloatingIsland(-27, 61, -148, 1.2, "torii");
    addCloud(-51, 39, -84, .86);
    addCloud(42, 33, -108, .72);
    addCloud(-28, 46, -122, .62);
    addCloud(18, 31, -146, .72);

    // -------------------------------------------------------------------------
    // Instanced assembly and renderer
    // -------------------------------------------------------------------------
    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();

    function buildInstanced(items, material, opts = {}) {
      const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, items.length);
      for (let i = 0; i < items.length; i++) {
        const b = items[i];
        dummy.position.set(b.x, b.y, b.z);
        dummy.rotation.set(b.rx || 0, b.ry || 0, b.rz || 0);
        dummy.scale.set(b.w, b.h, b.d);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        tempColor.set(b.color);
        const j = b.jitter == null ? .04 : b.jitter;
        tempColor.offsetHSL((rand() - .5) * j * .15, (rand() - .5) * j, (rand() - .5) * j * .9);
        mesh.setColorAt(i, tempColor);
      }
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      mesh.castShadow = opts.castShadow !== false;
      mesh.receiveShadow = opts.receiveShadow !== false;
      mesh.frustumCulled = opts.frustumCulled !== false;
      if (opts.renderOrder != null) mesh.renderOrder = opts.renderOrder;
      mesh.computeBoundingSphere();
      return mesh;
    }

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('scene'),
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.16;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xd4c6b2, 86, 190);

    const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, .2, 360);
    camera.position.set(33, 19.5, 43);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 9.4, -1.2);
    controls.enableDamping = true;
    controls.dampingFactor = .055;
    controls.minDistance = 24;
    controls.maxDistance = 82;
    controls.minPolarAngle = .67;
    controls.maxPolarAngle = 1.44;
    controls.rotateSpeed = .6;
    controls.zoomSpeed = .7;
    controls.update();

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      toneMapped: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x4f86b4) },
        midColor: { value: new THREE.Color(0x9bb5c3) },
        horizonColor: { value: new THREE.Color(0xffdbb9) },
        lowColor: { value: new THREE.Color(0xeed3bb) },
        sunColor: { value: new THREE.Color(0xfff0c9) }
      },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorld = world.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 midColor;
        uniform vec3 horizonColor;
        uniform vec3 lowColor;
        uniform vec3 sunColor;
        varying vec3 vWorld;
        void main() {
          vec3 dir = normalize(vWorld);
          float h = dir.y;
          vec3 sky = mix(lowColor, horizonColor, smoothstep(-0.16, 0.07, h));
          sky = mix(sky, midColor, smoothstep(0.03, 0.22, h));
          sky = mix(sky, topColor, smoothstep(0.18, 0.60, h));
          vec3 sunDir = normalize(vec3(0.57, 0.38, -0.75));
          float sun = max(dot(dir, sunDir), 0.0);
          sky += sunColor * (pow(sun, 36.0) * .75 + pow(sun, 7.0) * .11);
          gl_FragColor = vec4(sky, 1.0);
          #include <colorspace_fragment>
        }
      `
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 40, 24), skyMaterial);
    scene.add(sky);

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(7.5, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe3b2, toneMapped: false, fog: false })
    );
    sun.position.set(82, 60, -82);
    scene.add(sun);

    scene.add(new THREE.HemisphereLight(0xcfe1f3, 0x5d6e4d, 1.38));
    scene.add(new THREE.AmbientLight(0xffead0, .35));

    const sunLight = new THREE.DirectionalLight(0xffe1b8, 3.25);
    sunLight.position.set(37, 52, 32);
    sunLight.target.position.set(0, 7, -7);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -54;
    sunLight.shadow.camera.right = 54;
    sunLight.shadow.camera.top = 54;
    sunLight.shadow.camera.bottom = -54;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 145;
    sunLight.shadow.bias = -.0007;
    sunLight.shadow.normalBias = .035;
    scene.add(sunLight, sunLight.target);

    const fillLight = new THREE.DirectionalLight(0x9db6d4, .55);
    fillLight.position.set(-34, 28, -28);
    scene.add(fillLight);

    const pagodaGlow = new THREE.PointLight(0xffbd69, 42, 24, 2);
    pagodaGlow.position.set(0, 10, -1.8);
    scene.add(pagodaGlow);

    const solidMesh = buildInstanced(solids, new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: .9,
      metalness: 0
    }));
    scene.add(solidMesh);

    const glowMesh = buildInstanced(glows, new THREE.MeshBasicMaterial({
      color: 0xffffff,
      toneMapped: false
    }), { castShadow: false, receiveShadow: false });
    scene.add(glowMesh);

    const waterMesh = buildInstanced(waters, new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: .12,
      metalness: .04,
      transparent: true,
      opacity: .78,
      emissive: 0x0a3038,
      emissiveIntensity: .28,
      depthWrite: false
    }), { castShadow: false, receiveShadow: true, renderOrder: 2 });
    scene.add(waterMesh);

    const cloudMesh = buildInstanced(clouds, new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 1,
      metalness: 0
    }), { castShadow: false, receiveShadow: true });
    scene.add(cloudMesh);

    // -------------------------------------------------------------------------
    // Koi
    // -------------------------------------------------------------------------
    function buildFish(colors, accent) {
      const parts = [];
      const add = (x, y, z, w, h, d, c) => parts.push({
        x, y, z, w, h, d, color: c, jitter: .03, rx: 0, ry: 0, rz: 0
      });
      add(1.12, 0, 0, .62, .68, .48, accent);
      add(.66, .02, 0, .63, .78, .64, accent);
      add(.15, .02, 0, .66, .86, .70, colors[0]);
      add(-.40, .02, 0, .70, .82, .66, colors[1]);
      add(-.88, .02, 0, .62, .68, .52, accent);
      add(-1.25, .02, 0, .42, .44, .32, colors[1]);
      add(-1.62, -.03, 0, .42, .38, .10, accent);
      add(-1.86, .04, 0, .44, .32, .05, accent);
      add(.18, .47, 0, .44, .24, .18, accent);
      add(-.55, .43, 0, .34, .2, .15, accent);
      add(.05, -.38, 0, .46, .22, .24, colors[0]);
      add(-.70, -.3, 0, .42, .16, .16, accent);
      add(1.16, .19, .22, .10, .10, .08, 0x11100d);
      add(1.16, .19, -.22, .10, .10, .08, 0x11100d);
      const mesh = buildInstanced(parts, new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: .38,
        metalness: .06
      }), { castShadow: false, receiveShadow: false, frustumCulled: false });
      const group = new THREE.Group();
      group.add(mesh);
      const rings = [];
      for (let i = 0; i < 3; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05 + i * .3, .025, 6, 32),
          new THREE.MeshBasicMaterial({
            color: 0xdbfff2, transparent: true, opacity: .34, depthWrite: false
          }));
        ring.rotation.x = Math.PI / 2;
        ring.userData.phase = i * 2.1;
        group.add(ring);
        rings.push(ring);
      }
      group.userData.rings = rings;
      return group;
    }

    const koi1 = buildFish([0xf3eee0, 0xe98232], 0xffa14c);
    const koi2 = buildFish([0xd85825, 0xf4e7d1], 0xe0953f);
    scene.add(koi1, koi2);

    // -------------------------------------------------------------------------
    // Animated petals, fireflies and birds
    // -------------------------------------------------------------------------
    const petalCount = 220;
    const petals = [];
    const petalSources = [
      [-15.2, -1.0, 6.2], [14.0, -2.7, 5.3], [-20.2, -12.7, 4.1], [-8.4, 12.7, 3.8]
    ];
    for (let i = 0; i < petalCount; i++) {
      const src = petalSources[i % petalSources.length];
      petals.push({
        x: src[0] + rr(-src[2] * 1.15, src[2] * 1.15),
        y: rr(.5, 17),
        z: src[1] + rr(-src[2] * 1.15, src[2] * 1.15),
        vx: rr(-.18, .18),
        vy: rr(.35, .85),
        vz: rr(-.16, .2),
        phase: rr(0, Math.PI * 2),
        spin: rr(-1.6, 1.6),
        sx: rr(.1, .23)
      });
    }
    const petalMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, .14, .42),
      new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: .6, metalness: 0, transparent: true, opacity: .96
      }),
      petalCount
    );
    const petalColors = [0xf5aec3, 0xffd0df, 0xf2b7cc, 0xffe3ee, 0xe695b1];
    for (let i = 0; i < petalCount; i++) petalMesh.setColorAt(i, tempColor.set(pick(petalColors)));
    petalMesh.instanceColor.needsUpdate = true;
    petalMesh.castShadow = false;
    petalMesh.receiveShadow = false;
    petalMesh.frustumCulled = false;
    scene.add(petalMesh);

    const fireflies = [];
    for (let i = 0; i < 46; i++) {
      fireflies.push({
        x: rr(-20, 19), y: rr(.6, 15), z: rr(-18, 16),
        phase: rr(0, Math.PI * 2), speed: rr(.4, 1.1)
      });
    }
    const flyMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(.13, .13, .13),
      new THREE.MeshBasicMaterial({ color: 0xffe1a0, toneMapped: false }),
      fireflies.length
    );
    flyMesh.frustumCulled = false;
    scene.add(flyMesh);

    const birdGroup = new THREE.Group();
    const birdMat = new THREE.MeshBasicMaterial({ color: 0x3d4e58, toneMapped: false });
    for (let b = 0; b < 4; b++) {
      const bird = new THREE.Group();
      bird.add(new THREE.Mesh(new THREE.BoxGeometry(.55, .18, .22), birdMat));
      const left = new THREE.Mesh(new THREE.BoxGeometry(1, .12, .34), birdMat);
      left.position.x = -.42;
      const right = left.clone();
      right.position.x = .42;
      bird.add(left, right);
      bird.userData = { phase: b * 1.3, radius: 34 + b * 3, speed: .09 + b * .012 };
      bird.scale.setScalar(.8 + b * .08);
      birdGroup.add(bird);
    }
    scene.add(birdGroup);

    // -------------------------------------------------------------------------
    // Animation and rendering
    // -------------------------------------------------------------------------
    const clock = new THREE.Clock();
    let firstFrame = true;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .04);
      const t = clock.elapsedTime;

      for (let i = 0; i < waters.length; i++) {
        const b = waters[i];
        dummy.position.set(b.x, b.y + Math.sin(t * 1.35 + b.phase) * .036, b.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(b.w, b.h, b.d);
        dummy.updateMatrix();
        waterMesh.setMatrixAt(i, dummy.matrix);
      }
      waterMesh.instanceMatrix.needsUpdate = true;

      const fishStates = [
        [koi1, t * .16, POND.rx - 2.8, POND.rz - 2.1],
        [koi2, t * .12 + Math.PI * 1.2, POND.rx - 3.3, POND.rz - 2.5]
      ];
      for (const [fish, phase, rx, rz] of fishStates) {
        const x = POND.x + Math.cos(phase) * rx;
        const z = POND.z + Math.sin(phase) * rz;
        const dx = -Math.sin(phase), dz = Math.cos(phase);
        fish.position.set(x, -1.0 + Math.sin(t * 1.1 + phase) * .04, z);
        fish.rotation.y = Math.atan2(-dz, dx);
        fish.userData.rings.forEach(ring => {
          const wave = (t * .42 + ring.userData.phase) % 1;
          ring.scale.setScalar(.8 + wave * 1.4);
          ring.material.opacity = .26 * (1 - wave);
        });
      }

      for (let i = 0; i < petalCount; i++) {
        const p = petals[i];
        p.y -= p.vy * dt;
        p.x += (p.vx + Math.sin(t * 1.2 + p.phase) * .12) * dt;
        p.z += (p.vz + Math.cos(t * .9 + p.phase) * .08) * dt;
        if (p.y < .35) {
          const src = petalSources[i % petalSources.length];
          p.x = src[0] + rr(-src[2] * 1.15, src[2] * 1.15);
          p.z = src[1] + rr(-src[2] * 1.15, src[2] * 1.15);
          p.y = rr(12, 20);
        }
        dummy.position.set(p.x, p.y, p.z);
        dummy.rotation.set(
          Math.sin(t * 2 + p.phase) * .8,
          t * p.spin + p.phase,
          Math.cos(t * 1.5 + p.phase) * .7
        );
        dummy.scale.set(p.sx, 1, p.sx * 1.9);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
      }
      petalMesh.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < fireflies.length; i++) {
        const f = fireflies[i];
        const pulse = .55 + .45 * Math.sin(t * f.speed * 2 + f.phase);
        dummy.position.set(
          f.x + Math.sin(t * .33 + f.phase) * 1.4,
          f.y + Math.sin(t * .62 + f.phase * 1.5) * .7,
          f.z + Math.cos(t * .28 + f.phase) * 1.4
        );
        dummy.scale.setScalar(pulse * 1.2);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        flyMesh.setMatrixAt(i, dummy.matrix);
      }
      flyMesh.instanceMatrix.needsUpdate = true;

      birdGroup.children.forEach((bird, i) => {
        const u = bird.userData;
        const a = t * u.speed + u.phase;
        bird.position.set(
          Math.cos(a) * u.radius,
          31 + Math.sin(t * .28 + u.phase) * 2.8,
          -39 + Math.sin(a) * 15
        );
        bird.rotation.y = -a + Math.PI / 2;
        bird.children[1].position.y = Math.sin(t * 6 + u.phase) * .16;
        bird.children[2].position.y = -Math.sin(t * 6 + u.phase) * .16;
      });

      glowMesh.material.color.setScalar(.92 + Math.sin(t * 1.65) * .08);
      pagodaGlow.intensity = 36 + Math.sin(t * 2.2) * 8;
      controls.update();
      renderer.render(scene, camera);

      if (firstFrame) {
        firstFrame = false;
        renderer.shadowMap.autoUpdate = false;
        document.getElementById('loading').classList.add('hidden');
      }
    }

    renderer.shadowMap.needsUpdate = true;
    window.__garden = { scene, camera, renderer, controls };
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
