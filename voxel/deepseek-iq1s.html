<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Pagoda of the Five Heavens — Voxel Garden</title>
  <style>
    @font-face {
      font-family: 'KenPixel';
      src: url('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/fonts/ttf/kenpixel.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --ink: #18232c;
      --paper: #f5e8d1;
      --gold: #e7b968;
      --rose: #f3a6bd;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1c2733;
      color: var(--paper);
      font-family: 'KenPixel', "Courier New", monospace;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 51% 43%, transparent 46%, rgba(10, 19, 27, .13) 75%, rgba(8, 14, 21, .42) 100%);
      z-index: 2;
    }
    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 3;
      opacity: .07;
      background-image:
        repeating-radial-gradient(circle at 17% 23%, rgba(255,255,255,.09) 0 1px, transparent 1px 3px),
        repeating-radial-gradient(circle at 73% 61%, rgba(0,0,0,.08) 0 1px, transparent 1px 4px);
      mix-blend-mode: overlay;
    }
    .masthead {
      position: fixed;
      top: 30px;
      left: 38px;
      z-index: 5;
      pointer-events: none;
      max-width: 360px;
      text-shadow: 0 2px 16px rgba(14, 24, 33, .42);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(73, 55, 38, .94);
      font-size: 9.5px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--gold);
      opacity: .8;
    }
    h1 {
      margin: 11px 0 7px;
      font-size: clamp(20px, 2.1vw, 28px);
      font-weight: 400;
      line-height: 1.16;
      letter-spacing: .045em;
      color: #342d24;
      text-shadow: 0 1px 0 rgba(255, 242, 214, .28);
    }
    .subtitle {
      margin: 0;
      color: rgba(54, 47, 37, .78);
      font-size: 9px;
      line-height: 1.65;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .seal {
      position: fixed;
      left: 39px;
      bottom: 30px;
      z-index: 5;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(92, 69, 34, .72);
      border-radius: 2px;
      color: rgba(92, 69, 34, .9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: rgba(178, 52, 38, .08);
      box-shadow: inset 0 0 0 3px rgba(178, 52, 38, .07);
      transform: rotate(-2deg);
      pointer-events: none;
    }
    .seal i {
      display: block;
      width: 2px;
      height: 15px;
      background: #b34232;
      opacity: .82;
    }
    .seal i:nth-child(2n) { height: 11px; }
    .guide {
      position: fixed;
      right: 35px;
      bottom: 32px;
      z-index: 5;
      pointer-events: none;
      color: rgba(46, 55, 34, .76);
      font-size: 8px;
      line-height: 1.7;
      letter-spacing: .13em;
      text-transform: uppercase;
      text-align: right;
    }
    .guide b {
      color: rgba(115, 70, 24, .96);
      font-weight: normal;
    }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background: #17222b;
      transition: opacity .9s ease;
    }
    .loading span {
      font-size: 10px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #d8ba83;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    @media (max-width: 720px) {
      .masthead { top: 20px; left: 20px; }
      .subtitle { display: none; }
      .seal { left: 20px; bottom: 20px; }
      .guide { right: 20px; bottom: 20px; font-size: 7.5px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="An interactive voxel art garden with a five tier pagoda, pond, bridge and cherry trees"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="masthead">
    <div class="eyebrow">Shizuka-en · Voxel Garden</div>
    <h1>PAGODA OF THE<br />FIVE HEAVENS</h1>
    <p class="subtitle">A garden held between blossom, stone, and quiet water.</p>
  </header>
  <div class="seal" aria-label="Five tiered pagoda seal"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="guide"><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> approach</div>
  <div class="loading" id="loading"><span>assembling the garden…</span></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------------------
    // Utilities
    // -------------------------------------------------------------------------
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(274041);
    const rr = (lo, hi) => lo + rand() * (hi - lo);
    const ri = (lo, hi) => Math.floor(rr(lo, hi + 1));
    const pick = arr => arr[Math.floor(rand() * arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // Geometry is accumulated in a handful of instanced meshes, keeping the
    // scene detailed without flooding the WebGL draw-call budget.
    const solids = [];
    const glows = [];
    const waters = [];
    const clouds = [];

    function voxel(x, y, z, w, h, d, color, opts = {}) {
      solids.push({
        x, y, z, w, h, d,
        color,
        rx: opts.rx || 0,
        ry: opts.ry || 0,
        rz: opts.rz || 0,
        jitter: opts.jitter == null ? 0.045 : opts.jitter
      });
    }
    function glow(x, y, z, w, h, d, color) {
      glows.push({ x, y, z, w, h, d, color, jitter: 0.025 });
    }
    function water(x, y, z, w, h, d, color, phase = 0) {
      waters.push({ x, y, z, w, h, d, color, phase, jitter: 0.035 });
    }

    const C = {
      grass: [0x679553, 0x7fa85c, 0x8dae62, 0x5f874c, 0x9bbc69, 0x779f55],
      moss: [0x507c43, 0x628b4b, 0x729952, 0x3f6d3d],
      soil: [0x806746, 0x927353, 0x6e5c43],
      stone: [0x85857d, 0x9c9b92, 0xaaa79f, 0x74766f, 0x646b66],
      stoneDark: [0x535c57, 0x5f675f, 0x4b5652],
      sand: [0xa9a17b, 0xc2b58e, 0x938c70],
      water: [0x397d83, 0x4f9b9b, 0x66b8b4, 0x2d6878, 0x79c8c1],
      deepWater: [0x1f5664, 0x2b6b74, 0x356f76],
      wood: [0x53382b, 0x6b4730, 0x3e2d23, 0x7a5136],
      woodDark: [0x35241c, 0x422d21],
      vermilion: [0xb64131, 0xca4b37, 0xdd5b41, 0x9e342c],
      vermilionLight: [0xe66f51, 0xf07d5c],
      cream: [0xeadbc1, 0xf3e5cc, 0xdac8a9],
      creamShadow: [0xc9b896, 0xddcbae],
      tealRoof: [0x27535b, 0x316b70, 0x397e82, 0x20454f],
      tealTile: [0x498d8b, 0x559f98, 0x367b7d],
      gold: [0xd3ae61, 0xe5c574, 0xbc9152],
      goldLight: [0xf0d486, 0xf6dda0],
      cherry: [0xf7c4d6, 0xf2abc4, 0xe99ab8, 0xffe2ed, 0xdb83a7],
      cherryDeep: [0xc96991, 0xb95b83, 0xa54a76],
      bamboo: [0x647b42, 0x789352, 0x92aa63],
      maple: [0xd45a36, 0xef7b43, 0xb9442b, 0xf5a24a],
      reed: [0x92a45e, 0xb7b46a],
      waterFoam: [0xd7f6eb, 0xecfff8, 0xa9ded8],
      lantern: [0xffd485, 0xffc066, 0xf7d99b],
      cherryPale: [0xfff0f5, 0xffe4ee, 0xfdd6e3],
      cherryWarm: [0xf6b3ca, 0xf9c3d6, 0xef9fba],
      cherryUmbra: [0xb96286, 0xa65075, 0xc97394],
      ginkgo: [0xf1c454, 0xe7ae3d, 0xffdd7a, 0xc9912a, 0xffeb9b],
      wisteria: [0x9a85dc, 0x7e6ecb, 0xb5a1ec, 0x6857b3, 0xd3c3f8],
      azalea: [0xe9799e, 0xf29bb6, 0xc95a86, 0xffc2d4],
      lotus: [0xf7adc8, 0xffd4e3, 0xe88fb1, 0xfff4f8],
      lily: [0xffe2a1, 0xf6c86e, 0xfff0c0],
      paperLantern: [0xffb36a, 0xffc98b, 0xe9714b],
      mossLight: [0x769d5a, 0x88ac68, 0x6a9252],
      gravel: [0xcfc6ad, 0xdad1b7, 0xb5ad95],
      bronze: [0x9b7449, 0xb58b58, 0x80613f],
      fungi: [0xe35b4e, 0xf27965, 0xc64a40],
      skyRose: [0xf7c8c8, 0xf1d3d0, 0xe9b7bd]
    };

    function col(palette) {
      return Array.isArray(palette) ? pick(palette) : palette;
    }

    // -------------------------------------------------------------------------
    // Landscape fields and building routines
    // -------------------------------------------------------------------------
    const POND = { x: 2.2, z: 7.1, rx: 10.4, rz: 6.7 };
    const PAGODA = { x: 0, z: -10 };

    function pondField(x, z) {
      const nx = (x - POND.x) / POND.rx;
      const nz = (z - POND.z) / POND.rz;
      const edge = 0.076 * Math.sin(Math.atan2(z - POND.z, x - POND.x) * 5 + 1.7);
      return Math.hypot(nx, nz) - edge;
    }

    function terrainHeight(x, z) {
      const rx = x / 30.4;
      const rz = z / 31.2;
      const coast = 0.022 * Math.sin(Math.atan2(z, x) * 7 + 1.2);
      if (Math.hypot(rx, rz) > 0.98 + coast) return null;

      let h = 0;
      const pond = pondField(x, z);
      if (pond < 0.93) h = -3;
      else if (pond < 1.11) h = 0;

      const dPagoda = Math.hypot((x - PAGODA.x) * 0.82, (z - PAGODA.z) * 0.94);
      if (dPagoda < 12.5 && pond >= 1.11) {
        h = Math.max(h, Math.round(3 * Math.pow(1 - dPagoda / 12.5, 1.3)));
      }

      const mounds = [[-15.5, -1.2, 1], [14.2, -2.8, 1], [-20, -12.5, 1], [12.7, -12, 1]];
      for (const [mx, mz, height] of mounds) {
        if (Math.hypot(x - mx, z - mz) < 4.3 && pond >= 1.11) h = Math.max(h, height);
      }
      if (pond >= 1.11 && z > 12) h = Math.max(h, Math.round(Math.abs(z - 17) < 8 ? 0 : 1));
      if (h === 0 && rand() < 0.065 && pond >= 1.11) return 1;
      return clamp(h, -3, 3);
    }

    function isPondWater(x, z) {
      return pondField(x, z) < 0.93;
    }

    function addGround() {
      for (let x = -32; x <= 32; x++) {
        for (let z = -32; z <= 32; z++) {
          const h = terrainHeight(x, z);
          if (h === null) continue;
          const inPond = pondField(x, z) < 0.93;
          const bank = !inPond && pondField(x, z) < 1.15;
          let topColor, underColor;
          if (inPond) {
            topColor = rand() < .62 ? pick(C.stoneDark) : pick(C.deepWater);
            underColor = pick(C.stoneDark);
          } else if (bank) {
            topColor = rand() < .42 ? pick(C.sand) : col(C.moss);
            underColor = pick(C.soil);
          } else if (h > 1) {
            topColor = rand() < .34 ? col(C.moss) : col(C.grass);
            underColor = pick(C.soil);
          } else {
            topColor = rand() < .11 ? col(C.sand) : col(C.grass);
            underColor = rand() < .7 ? pick(C.soil) : pick(C.stoneDark);
          }
          voxel(x, h - 0.5, z, 1, 1, 1, topColor, { jitter: .06 });
          voxel(x, h - 1.5, z, 1, 1, 1, underColor, { jitter: .05 });
          if (h > 0 || rand() < .28) {
            voxel(x, h - 2.5, z, 1, 1, 1, rand() < .35 ? pick(C.stoneDark) : pick(C.soil), { jitter: .06 });
          }
        }
      }

      // Jagged, hanging underside of the floating garden.
      for (let level = 0; level < 8; level++) {
        const y = -2.8 - level * 1.55;
        const radius = 27 - level * 2.85;
        if (radius < 5) break;
        const step = Math.max(1.7, 2.6 - level * .13);
        for (let x = -radius; x <= radius; x += step) {
          for (let z = -radius; z <= radius; z += step) {
            const n = Math.hypot(x / radius, z / (radius * .86));
            if (n < 1.03 - rr(0, .13)) {
              const c = rand() < .31 ? pick(C.stoneDark) : pick(C.soil);
              voxel(x + rr(-.3, .3), y + rr(-.35, .35), z + rr(-.3, .3),
                step * rr(.72, 1.05), 1.65, step * rr(.72, 1.05), c, { jitter: .08 });
            }
          }
        }
      }

      // A solid, darker body of pond water beneath the sparkling surface.
      for (let x = -8; x <= 12; x++) {
        for (let z = 0; z <= 14; z++) {
          if (isPondWater(x, z)) {
            voxel(x, -2.35, z, 1, .85, 1, pick(C.deepWater), { jitter: .03 });
          }
        }
      }
    }

    function addLotus(x, z, scale = 1) {
      if (!isPondWater(x, z)) return;
      const s = scale;
      voxel(x, -.99, z, 1.5 * s, .12, 1.5 * s, pick([0x4b8459, 0x5e9563, 0x75a86d]), { jitter: .03 });
      voxel(x + .9 * s, -.98, z + .2 * s, .85 * s, .1, .8 * s, pick([0x5e9563, 0x6d9b5f]), { jitter: .03 });
      voxel(x, .12 * s, z, .22 * s, .55 * s, .22 * s, 0x786b43, { jitter: .02 });
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        voxel(x + Math.cos(a) * .48 * s, .48 * s, z + Math.sin(a) * .48 * s,
          .42 * s, .32 * s, .42 * s, pick(C.lotus), { jitter: .02 });
      }
      voxel(x, .63 * s, z, .72 * s, .24 * s, .72 * s, pick(C.lotus), { jitter: .02 });
      voxel(x, .79 * s, z, .32 * s, .2 * s, .32 * s, pick(C.lily), { jitter: .01 });
    }

    function addWater() {
      for (let x = -9; x <= 13; x += .92) {
        for (let z = -1; z <= 15; z += .92) {
          if (!isPondWater(x, z) || pondField(x, z) > .88) continue;
          if (rand() < .045) continue;
          const phase = x * .43 + z * .61;
          water(x, -1.08 + Math.sin(phase) * .025, z, .96, .15, .96,
            rand() < .18 ? pick(C.waterFoam) : col(C.water), phase);
        }
      }

      const lilies = [
        [-5.8, 8.7], [-2.9, 11.2], [1.8, 3.6], [5.1, 11.4], [-7.2, 4.5],
        [8.8, 7.8], [0.2, 9.8], [-1.4, 6.8], [4.2, 8.9], [-4.2, 3.4], [6.2, 3.0]
      ];
      for (const [x, z] of lilies) {
        if (!isPondWater(x, z)) continue;
        if (rand() < .42) {
          addLotus(x, z, rr(.72, 1.2));
          continue;
        }
        const padColor = pick([0x4b8459, 0x5e9563, 0x75a86d]);
        voxel(x, -0.99, z, 1.3, .13, 1.3, padColor, { jitter: .03 });
        if (rand() < .7) voxel(x + 1.1, -0.98, z + .2, .8, .11, .9, padColor, { jitter: .03 });
        if (rand() < .58) {
          const raised = rr(0, .2);
          const p = pick([0xf4a9c3, 0xfcd2e1, 0xe7a1bd]);
          voxel(x, .05 + raised, z, .35, .7, .35, 0x786b43, { jitter: .02 });
          voxel(x, .56 + raised, z, .75, .28, .75, p, { jitter: .02 });
          voxel(x, .83 + raised, z, .34, .24, .34, 0xffe1ea, { jitter: .01 });
          voxel(x - .52, .52 + raised, z, .35, .22, .55, p, { jitter: .02 });
          voxel(x + .52, .52 + raised, z, .35, .22, .55, p, { jitter: .02 });
        }
      }

      for (let i = 0; i < 20; i++) {
        const x = rr(-8, 11), z = rr(1, 13);
        if (isPondWater(x, z)) {
          voxel(x, -0.94, z, rr(.25, .7), .035, .15, 0xd5fbf1, { jitter: .02 });
        }
      }
    }

    function addWaterfall() {
      const bx = -10.4, bz = 2.4;
      const rocks = [
        [-11.2, 2.3, -1.2, 3.0, 2.8, 2.5],
        [-13.6, 1.2, 0.3, 2.0, 1.8, 1.8],
        [-8.9, 1.5, 0.7, 1.5, 2.2, 1.6]
      ];
      for (const [x, y, z, sx, sy, sz] of rocks) {
        for (let ix = -0.5; ix <= .5; ix += .5) {
          for (let iy = -0.5; iy <= .5; iy += .5) {
            for (let iz = -0.5; iz <= .5; iz += .5) {
              if ((ix * ix + iy * iy + iz * iz) < .78) {
                const py = y + iy * sy;
                voxel(x + ix * sx, py, z + iz * sz, sx * .55, sy * .55, sz * .55,
                  (py > y + sy * .28 && rand() < .3) ? col(C.moss) : pick(C.stone), { jitter: .10 });
              }
            }
          }
        }
      }
      for (let i = 0; i < 4; i++) {
        water(bx + i * .65 - 1, 1.55 - i * .62, bz + .2, .78 - i * .05, .58, .22,
          pick(C.waterFoam), i * 1.3);
      }
      for (let i = 0; i < 18; i++) {
        voxel(bx + rr(-1.4, 1.4), -1.5 + rr(0, .6), bz + rr(-.6, .8),
          rr(.18, .55), rr(.05, .2), rr(.16, .42), pick(C.waterFoam), { jitter: .02 });
      }
      water(bx, -1.03, bz + 1.1, 3.1, .08, 2.1, 0xbde8e1, 2.0);
    }

    function addPathPoint(x, z, size = 1) {
      const h = terrainHeight(x, z);
      if (h === null) return;
      voxel(x, h + .18, z, size * rr(.85, 1.2), .18, size * rr(.7, 1.1),
        pick([0xa9a398, 0xbcb8a9, 0x8f9188]), { jitter: .03 });
    }

    function addGardenPaths() {
      const pathA = [
        [-7.1, 19.2], [-7.0, 17.4], [-5.6, 15.2], [-2.8, 14.3], [0.4, 13.7],
        [3.6, 13.9], [6.8, 14.6]
      ];
      const curveA = new THREE.CatmullRomCurve3(pathA.map(([x, z]) => new THREE.Vector3(x, 0, z)));
      for (let i = 0; i < 72; i++) {
        const p = curveA.getPoint(i / 71);
        const side = Math.sin(i * 1.5) * .34;
        const n = curveA.getTangent(i / 71);
        addPathPoint(p.x + n.z * side, p.z - n.x * side, rr(.75, 1.25));
      }

      const pathB = [
        [8.1, -1.4], [7.5, -2.8], [5.8, -3.7], [3.3, -3.8], [1.8, -3.8], [0, -2.9]
      ];
      const curveB = new THREE.CatmullRomCurve3(pathB.map(([x, z]) => new THREE.Vector3(x, 0, z)));
      for (let i = 0; i < 38; i++) {
        const p = curveB.getPoint(i / 37);
        addPathPoint(p.x + rr(-.24, .24), p.z + rr(-.17, .17), rr(.72, 1.05));
      }

      const leftSteps = [
        [-1.7, -1.2], [-1.5, -1.8], [-1.1, -2.3], [-0.7, -2.8],
        [0, -3.2], [0.7, -3.3]
      ];
      leftSteps.forEach(([x, z], i) => {
        voxel(x, .22 + i * .54, z, 2.8, .52, .9, i % 2 ? 0xaaa69b : 0x8f9289, { jitter: .025 });
        if (i % 2 === 0) {
          voxel(x - 1.65, .75 + i * .54, z, .42, .75, .42, pick(C.stoneDark), { jitter: .03 });
          voxel(x + 1.65, .75 + i * .54, z, .42, .75, .42, pick(C.stoneDark), { jitter: .03 });
        }
      });
    }

    function addStoneLantern(x, z, baseY, scale = 1) {
      const h = terrainHeight(x, z);
      const y = (h == null ? baseY : Math.max(h, baseY)) + .2;
      const s = scale;
      voxel(x, y + .18 * s, z, 1.4 * s, .36 * s, 1.4 * s, pick(C.stoneDark), { jitter: .03 });
      voxel(x, y + .95 * s, z, .45 * s, 1.15 * s, .45 * s, pick(C.stone), { jitter: .03 });
      voxel(x, y + 1.7 * s, z, 1.1 * s, .26 * s, 1.1 * s, pick(C.stone), { jitter: .03 });
      voxel(x, y + 2.12 * s, z, .82 * s, .62 * s, .82 * s, 0x483f36, { jitter: .02 });
      glow(x, y + 2.15 * s, z, .56 * s, .44 * s, .56 * s, 0xffc368);
      for (const [dx, dz] of [[.44, 0], [-.44, 0], [0, .44], [0, -.44]]) {
        voxel(x + dx * s, y + 2.15 * s, z + dz * s, .10 * s, .54 * s, .6 * s, pick(C.woodDark), { jitter: .02 });
      }
      voxel(x, y + 2.62 * s, z, 1.32 * s, .24 * s, 1.32 * s, pick(C.stone), { jitter: .03 });
      voxel(x, y + 2.89 * s, z, .86 * s, .24 * s, .86 * s, pick(C.stoneDark), { jitter: .03 });
      voxel(x, y + 3.14 * s, z, .32 * s, .42 * s, .32 * s, pick(C.stone), { jitter: .03 });
    }

    function addBridge() {
      const startZ = 14.1;
      const endZ = -1.2;
      const x = 7.4;
      const n = 23;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const z = startZ + (endZ - startZ) * t;
        const arc = Math.sin(Math.PI * t) * 2.35;
        const y = .58 + arc;
        voxel(x, y, z, 3.35, .3, .86, i % 2 ? pick(C.vermilion) : pick([0xd47743, 0xc26b3d]), { jitter: .025 });
        voxel(x, y + .18, z, 3.78, .1, .92, pick(C.woodDark), { jitter: .02 });
        voxel(x, y + .35, z, 3.1, .07, .82, 0xb7794a, { jitter: .02 });
        voxel(x - 1.58, y + .46, z, .18, .34, .18, pick(C.woodDark), { jitter: .02 });
        voxel(x + 1.58, y + .46, z, .18, .34, .18, pick(C.woodDark), { jitter: .02 });
        voxel(x - 1.62, y + .53, z, .22, .18, 1.0, pick(C.vermilion), { jitter: .02 });
        voxel(x + 1.62, y + .53, z, .22, .18, 1.0, pick(C.vermilion), { jitter: .02 });
        voxel(x - 1.78, y + .22, z, .17, 1.35, .17, pick(C.vermilion), { jitter: .03 });
        voxel(x + 1.78, y + .22, z, .17, 1.35, .17, pick(C.vermilion), { jitter: .03 });
        for (const sx of [-1.78, 1.78]) {
          voxel(x + sx, y + .21, z, .24, .12, .24, pick(C.gold), { jitter: .02 });
          voxel(x + sx, y + 1.42, z, .24, .12, .24, pick(C.goldLight), { jitter: .02 });
        }
        if (i % 3 === 0) {
          voxel(x - 1.62, y + .63, z, .22, 1.35, .22, pick(C.vermilion), { jitter: .03 });
          voxel(x + 1.62, y + .63, z, .22, 1.35, .22, pick(C.vermilion), { jitter: .03 });
          voxel(x - 1.62, y + 2.02, z, .34, .14, .34, pick(C.gold), { jitter: .02 });
          voxel(x + 1.62, y + 2.02, z, .34, .14, .34, pick(C.gold), { jitter: .02 });
        }
        if (i % 6 === 3) {
          for (const sx of [-1, 1]) {
            const lx = x + sx * 1.78;
            voxel(lx, y + 1.05, z, .045, .65, .045, pick(C.bronze), { jitter: .02 });
            glow(lx, y + .78, z, .34, .42, .34, 0xffbe6d);
            voxel(lx, y + 1.1, z, .46, .12, .46, pick(C.vermilion), { jitter: .02 });
            voxel(lx, y + .54, z, .46, .1, .46, pick(C.vermilion), { jitter: .02 });
          }
        }
        if (rand() < .26) {
          voxel(x + rr(-1.1, 1.1), y + .35, z + rr(-.2, .2), rr(.22, .38), .08, rr(.12, .24), col(C.moss), { jitter: .02 });
        }
        if (z > 0.2 && z < 12.3 && i % 4 === 2) {
          for (const sx of [-1.35, 1.35]) {
            voxel(x + sx, -1.6, z, .34, y + 2.3, .34, pick(C.woodDark), { jitter: .03 });
            voxel(x + sx, -1.85, z, .68, .38, .68, pick(C.stoneDark), { jitter: .03 });
          }
          voxel(x, y - .32, z, 2.75, .26, .34, pick(C.woodDark), { jitter: .03 });
        }
      }
      for (const zEnd of [startZ + .3, endZ - .3]) {
        voxel(x, .46, zEnd, 4.4, .38, 1.6, pick(C.stoneDark), { jitter: .03 });
        voxel(x, .72, zEnd, 3.8, .24, 1.2, pick(C.stone), { jitter: .03 });
      }
      addStoneLantern(x - 2.9, 13.2, .18, 1.05);
      addStoneLantern(x + 2.9, 13.2, .18, 1.05);
    }

    function addTorii() {
      const x = -7.1, z = 18.1;
      for (const dx of [-2.1, 2.1]) {
        voxel(x + dx, 4.7, z, .86, 7.2, .9, pick(C.vermilion), { jitter: .03 });
        voxel(x + dx, 1.15, z, 1.2, .5, 1.2, pick(C.stoneDark), { jitter: .03 });
        voxel(x + dx, 7.9, z, .92, .6, 1.02, pick(C.vermilionLight), { jitter: .03 });
      }
      voxel(x, 6.25, z, 5.5, .42, .62, pick(C.vermilion), { jitter: .025 });
      voxel(x, 8.35, z, 6.1, .54, .78, pick(C.vermilion), { jitter: .025 });
      voxel(x, 8.62, z, 7.4, .16, 1.0, pick(C.woodDark), { jitter: .02 });
      voxel(x, 8.82, z, 5.6, .18, .9, pick(C.vermilionLight), { jitter: .02 });
      voxel(x, 6.25, z + .34, 1.15, .72, .16, pick(C.woodDark), { jitter: .02 });
      voxel(x, 6.25, z + .42, .8, .52, .06, pick(C.gold), { jitter: .02 });
      for (let i = 0; i < 6; i++) {
        const sx = -3.5 + i * 1.4;
        voxel(x + sx, 9.03, z, .72, .18, .26, pick(C.woodDark), { jitter: .03 });
      }
      glow(x, 6.32, z + .47, .55, .37, .08, 0xffd68b);
    }

    // -------------------------------------------------------------------------
    // Pagoda
    // -------------------------------------------------------------------------
    function addPagodaTier(x, z, floorY, width, depth, height, tier) {
      const w = width, d = depth;
      const bodyColor = tier % 2 ? col(C.cream) : col(C.creamShadow);
      voxel(x, floorY + height / 2, z, w, height, d, bodyColor, { jitter: .025 });

      voxel(x, floorY + .12, z, w + .55, .3, d + .55, pick(C.woodDark), { jitter: .02 });
      voxel(x, floorY + height - .12, z, w + .42, .3, d + .42, pick(C.vermilion), { jitter: .02 });
      voxel(x, floorY + height - .34, z, w + .56, .12, d + .56, pick(C.gold), { jitter: .02 });

      const xs = [-w / 2 + .27, w / 2 - .27];
      const zs = [-d / 2 + .27, d / 2 - .27];
      for (const px of xs) {
        for (const pz of zs) {
          voxel(x + px, floorY + height / 2, z + pz, .58, height, .58, col(C.vermilion), { jitter: .03 });
          voxel(x + px, floorY + .48, z + pz, .72, .23, .72, pick(C.gold), { jitter: .02 });
          voxel(x + px, floorY + height - .34, z + pz, .72, .2, .72, pick(C.gold), { jitter: .02 });
        }
      }
      for (const px of [-w / 3.2, w / 3.2]) {
        voxel(x + px, floorY + height / 2, z + d / 2 + .04, .38, height, .28,
          rand() < .45 ? pick(C.vermilion) : pick(C.woodDark), { jitter: .03 });
      }
      for (const pz of [-d / 3.2, d / 3.2]) {
        voxel(x + w / 2 + .04, floorY + height / 2, z + pz, .28, height, .38,
          rand() < .45 ? pick(C.vermilion) : pick(C.woodDark), { jitter: .03 });
      }

      const frontZ = z + d / 2;
      const panelW = Math.min(w * .45, 2.7);
      const panelH = height * .58;
      voxel(x, floorY + height * .46, frontZ + .06, panelW, panelH, .12,
        tier === 1 ? pick(C.woodDark) : 0x243c43, { jitter: .02 });
      if (tier === 1) {
        voxel(x, floorY + height * .46, frontZ + .14, .08, panelH, .05, pick(C.gold), { jitter: .02 });
        for (let py = -.32; py <= .32; py += .16) {
          for (let px = -.34; px <= .34; px += .17) {
            glow(x + px * panelW, floorY + height * (.46 + py), frontZ + .18,
              .07, .07, .045, pick(C.gold));
          }
        }
      }
      for (const sx of [-1, 1]) {
        voxel(x + sx * (panelW / 2 + .08), floorY + height * .46, frontZ + .08,
          .11, panelH + .16, .16, pick(C.gold), { jitter: .02 });
      }
      voxel(x, floorY + height * .46 + panelH / 2 + .08, frontZ + .08, panelW + .3, .12, .16, pick(C.gold), { jitter: .02 });

      const crestY = floorY + height * .72;
      voxel(x, crestY, frontZ + .13, 1.02, 1.02, .12, pick(C.gold), { rz: Math.PI / 4, jitter: .02 });
      voxel(x, crestY, frontZ + .19, .62, .62, .08, 0x315b61, { rz: Math.PI / 4, jitter: .02 });
      voxel(x, crestY, frontZ + .24, .24, .24, .06, pick(C.goldLight), { rz: Math.PI / 4, jitter: .01 });

      for (const side of [-1, 1]) {
        for (const dz of [-d * .23, d * .23]) {
          voxel(x + side * (w / 2 + .06), floorY + height * .52, z + dz,
            .12, height * .38, Math.min(1.25, d * .2), 0x273f44, { jitter: .02 });
          voxel(x + side * (w / 2 + .13), floorY + height * .52, z + dz,
            .04, height * .3, .07, pick(C.gold), { jitter: .01 });
        }
      }

      const bracketY = floorY + height - .58;
      for (const pz of [z - d / 2 - .3, z + d / 2 + .3]) {
        for (let bx = -w / 2 + .5; bx <= w / 2; bx += 1.15) {
          voxel(x + bx, bracketY, pz, .24, .62, .61, pick(C.woodDark), { jitter: .03 });
          voxel(x + bx, bracketY - .12, pz + (pz > z ? .34 : -.34), .38, .2, .34,
            pick(C.vermilion), { jitter: .02 });
          glow(x + bx, bracketY + .16, pz, .1, .1, .1, pick(C.gold));
        }
      }
      for (const sx of [-1, 1]) {
        for (let bz = -d / 2 + .5; bz <= d / 2; bz += 1.15) {
          voxel(x + sx * (w / 2 + .3), bracketY, z + bz, .61, .62, .24,
            pick(C.woodDark), { jitter: .03 });
          voxel(x + sx * (w / 2 + .32), bracketY - .12, z + bz, .34, .2, .38,
            pick(C.vermilion), { jitter: .02 });
          glow(x + sx * (w / 2 + .34), bracketY + .16, z + bz, .1, .1, .1, pick(C.gold));
        }
      }
      addBalcony(x, z, floorY + height + .14, w + .75, d + .75);
    }

    function addBalcony(x, z, y, w, d) {
      const railColor = pick(C.vermilion);
      voxel(x, y, z + d / 2, w, .1, .1, railColor, { jitter: .02 });
      voxel(x, y, z - d / 2, w, .1, .1, railColor, { jitter: .02 });
      voxel(x + w / 2, y, z, .1, .1, d, railColor, { jitter: .02 });
      voxel(x - w / 2, y, z, .1, .1, d, railColor, { jitter: .02 });
      for (let bx = -w / 2; bx <= w / 2; bx += 1.2) {
        voxel(x + bx, y + .17, z + d / 2, .12, .34, .12, railColor, { jitter: .02 });
        voxel(x + bx, y + .17, z - d / 2, .12, .34, .12, railColor, { jitter: .02 });
      }
      for (let bz = -d / 2; bz <= d / 2; bz += 1.1) {
        voxel(x + w / 2, y + .17, z + bz, .12, .34, .12, railColor, { jitter: .02 });
        voxel(x - w / 2, y + .17, z + bz, .12, .34, .12, railColor, { jitter: .02 });
      }
    }

    function addRoof(x, z, y, w, d, tier) {
      const over = 3.8 - tier * .23;
      const tile = pick(C.tealRoof);
      const lightTile = pick(C.tealTile);
      const baseW = w + over, baseD = d + over;

      voxel(x, y + .18, z, baseW, .34, baseD, pick(C.woodDark), { jitter: .03 });
      voxel(x, y + .37, z, baseW - .08, .42, baseD - .08, tile, { jitter: .035 });
      voxel(x, y + .86, z, baseW - 1.1, .52, baseD - 1.1, lightTile, { jitter: .035 });
      voxel(x, y + 1.35, z, baseW - 2.3, .5, baseD - 2.3, tile, { jitter: .035 });
      voxel(x, y + 1.82, z, baseW - 3.45, .45, baseD - 3.45, lightTile, { jitter: .03 });
      voxel(x, y + 2.18, z, baseW - 4.65, .38, baseD - 4.65, tile, { jitter: .03 });

      const cx = baseW / 2 - .26;
      const cz = baseD / 2 - .26;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          voxel(x + sx * cx, y + .33, z + sz * cz, .88, .34, 1.1, pick(C.tealTile), { jitter: .03 });
          voxel(x + sx * (cx + .30), y + .52, z + sz * (cz + .22), .38, .42, .38, pick(C.gold), { jitter: .02 });
          voxel(x + sx * (cx + .42), y + .93, z + sz * (cz + .25), .36, .62, .36, pick(C.tealRoof), { jitter: .02 });
          voxel(x + sx * (cx + .45), y + 1.24, z + sz * (cz + .12), .22, .28, .22, pick(C.goldLight), { jitter: .01 });
        }
      }

      voxel(x, y + .06, z + baseD / 2 + .15, baseW, .12, .16, pick(C.vermilion), { jitter: .02 });
      voxel(x, y + .06, z - baseD / 2 - .15, baseW, .12, .16, pick(C.vermilion), { jitter: .02 });
      voxel(x + baseW / 2 + .15, y + .06, z, .16, .12, baseD, pick(C.vermilion), { jitter: .02 });
      voxel(x - baseW / 2 - .15, y + .06, z, .16, .12, baseD, pick(C.vermilion), { jitter: .02 });

      for (let tx = -baseW / 2 + .85; tx < baseW / 2 - .7; tx += 1.38) {
        voxel(x + tx, y + .62, z + baseD / 2 - .42, .56, .24, .26, lightTile, { jitter: .03 });
        voxel(x + tx, y + .62, z - baseD / 2 + .42, .56, .24, .26, lightTile, { jitter: .03 });
      }
      for (let tz = -baseD / 2 + .85; tz < baseD / 2 - .7; tz += 1.38) {
        voxel(x + baseW / 2 - .42, y + .62, z + tz, .26, .24, .56, lightTile, { jitter: .03 });
        voxel(x - baseW / 2 + .42, y + .62, z + tz, .26, .24, .56, lightTile, { jitter: .03 });
      }

      if (tier < 4) {
        for (const dx of [-w * .27, w * .27]) {
          const lx = x + dx;
          const ly = y - .75;
          voxel(lx, ly + .54, z + d / 2 - .15, .04, .5, .04, pick(C.woodDark), { jitter: .02 });
          voxel(lx, ly + .23, z + d / 2 - .15, .62, .14, .62, pick(C.woodDark), { jitter: .02 });
          glow(lx, ly, z + d / 2 - .15, .42, .42, .42, 0xffc05b);
          voxel(lx, ly - .21, z + d / 2 - .15, .62, .16, .62, pick(C.woodDark), { jitter: .02 });
        }
      }

      // Tile ends ride up toward the corners, giving each eave its sweep.
      const edgeN = Math.max(5, Math.round(baseW / 1.08));
      for (let i = 0; i <= edgeN; i++) {
        const t = i / edgeN;
        const lift = .22 * (2 * t - 1) * (2 * t - 1);
        const px = (t - .5) * baseW;
        for (const sz of [-1, 1]) {
          voxel(x + px, y + .54 + lift, z + sz * (baseD / 2 + .02),
            .38, .16, .26, i % 2 ? lightTile : tile, { jitter: .03 });
        }
      }
      const edgeNz = Math.max(5, Math.round(baseD / 1.08));
      for (let i = 0; i <= edgeNz; i++) {
        const t = i / edgeNz;
        const lift = .22 * (2 * t - 1) * (2 * t - 1);
        const pz = (t - .5) * baseD;
        for (const sx of [-1, 1]) {
          voxel(x + sx * (baseW / 2 + .02), y + .54 + lift, z + pz,
            .26, .16, .38, i % 2 ? lightTile : tile, { jitter: .03 });
        }
      }

      // Flying-eave corner horns, gold finials, and little wind bells.
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          for (let k = 0; k < 6; k++) {
            const out = .02 + k * .23;
            voxel(x + sx * (baseW / 2 + out), y + .48 + k * .25, z + sz * (baseD / 2 + out),
              .58 - k * .055, .18 - k * .012, .58 - k * .055,
              k === 5 ? pick(C.gold) : (k % 2 ? lightTile : tile), { jitter: .035 });
          }
          const ex = x + sx * (baseW / 2 + 1.38);
          const ez = z + sz * (baseD / 2 + 1.38);
          voxel(ex, y + 1.79, ez, .23, .42, .23, pick(C.gold), { ry: sx * sz * .65, jitter: .02 });
          voxel(ex, y + 1.31, ez, .045, .62, .045, pick(C.bronze), { jitter: .02 });
          glow(ex, y + 1.02, ez, .25, .24, .25, 0xffcf78);
          voxel(ex, y + .79, ez, .07, .44, .07, pick(C.vermilion), { jitter: .02 });
          voxel(ex, y + .48, ez, .17, .14, .17, pick(C.goldLight), { jitter: .02 });
        }
      }

      // Deep ridges and a gold hairline across the roof face.
      for (const sz of [-1, 1]) {
        voxel(x, y + 1.62, z + sz * (baseD / 2 - .53), baseW - 2.55, .08, .12,
          pick(C.gold), { jitter: .02 });
      }
    }

    function addGuardian(x, z, y, scale = 1, face = 1) {
      const s = scale;
      voxel(x, y + .18 * s, z, 1.65 * s, .34 * s, 1.55 * s, pick(C.stoneDark), { jitter: .03 });
      voxel(x, y + .48 * s, z, 1.25 * s, .34 * s, 1.15 * s, pick(C.stone), { jitter: .03 });
      voxel(x, y + 1.08 * s, z - .08 * s, .95 * s, .92 * s, 1.06 * s, pick(C.stone), { jitter: .04 });
      voxel(x, y + 1.75 * s, z, .88 * s, .78 * s, .82 * s, pick(C.stone), { jitter: .04 });
      voxel(x, y + 2.22 * s, z, .74 * s, .52 * s, .70 * s, pick(C.stoneDark), { jitter: .03 });
      voxel(x, y + 2.54 * s, z, .68 * s, .22 * s, .62 * s, pick(C.stone), { jitter: .03 });
      for (const sx of [-.36, .36]) {
        voxel(x + sx * s, y + .76 * s, z - .62 * s * face, .28 * s, .62 * s, .42 * s,
          pick(C.stoneDark), { jitter: .03 });
        voxel(x + sx * s, y + 2.14 * s, z - .37 * s, .10 * s, .10 * s, .06 * s, 0x171d1b, { jitter: .01 });
        voxel(x + sx * s, y + 2.24 * s, z - .42 * s, .20 * s, .18 * s, .08 * s, pick(C.stoneDark), { jitter: .02 });
      }
      for (let i = 0; i < 7; i++) {
        const a = i / 6 * Math.PI - Math.PI / 2;
        voxel(x + Math.sin(a) * .55 * s, y + 2.05 * s, z + Math.cos(a) * .52 * s,
          .22 * s, .24 * s, .22 * s, rand() < .3 ? pick(C.moss) : pick(C.stone), { jitter: .03 });
      }
      voxel(x, y + 1.03 * s, z + .72 * s, .22 * s, .78 * s, .22 * s, pick(C.stoneDark), { jitter: .03 });
      voxel(x, y + 1.75 * s, z + .82 * s, .18 * s, .22 * s, .28 * s, pick(C.stone), { jitter: .02 });
    }

    function addPagodaApproach() {
      const steps = 8;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const z = -2.0 - t * 2.15;
        const y = .38 + t * 4.72;
        const w = 6.7 - t * 1.1;
        voxel(0, y, z, w, .62, 1.08, i % 2 ? pick(C.gravel) : pick(C.stone), { jitter: .03 });
        voxel(0, y - .31, z - .05, w - .15, .18, .96, pick(C.stoneDark), { jitter: .03 });
        for (const sx of [-1, 1]) {
          const px = sx * (w / 2 + .18);
          voxel(px, y + .58, z, .24, 1.24, .24, pick(C.vermilion), { jitter: .03 });
          voxel(px, y + .08, z, .42, .18, .42, pick(C.stoneDark), { jitter: .02 });
          voxel(px, y + 1.28, z, .30, .16, .30, pick(C.gold), { jitter: .02 });
        }
      }
      for (const sx of [-1, 1]) {
        for (let j = 0; j < 5; j++) {
          voxel(sx * 3.15, .64 + j * .18, -1.45, 1.22, .34, 1.05,
            j % 2 ? pick(C.stone) : pick(C.stoneDark), { jitter: .03 });
        }
        addGuardian(sx * 3.45, -1.95, .35, .92, 1);
        addStoneLantern(sx * 4.45, -.55, .1, .82);
      }
      glow(0, 5.65, -4.08, 1.2, .14, .35, 0xf0c878);
    }

    function addPagoda() {
      const x = PAGODA.x, z = PAGODA.z;
      voxel(x, 3.75, z, 15.5, .72, 12.7, pick(C.stoneDark), { jitter: .04 });
      voxel(x, 4.5, z, 14.4, 1.05, 11.6, 0xa8a394, { jitter: .04 });
      voxel(x, 4.47, z, 14.8, .11, 12.0, pick(C.gold), { jitter: .02 });
      voxel(x, 5.32, z, 13.7, .38, 10.9, pick(C.stone), { jitter: .03 });
      voxel(x, 5.57, z + 5.8, 8.4, .35, 3.1, 0xb5b0a2, { jitter: .03 });
      for (let bi = -6.7; bi <= 6.7; bi += 1.34) {
        voxel(x + bi, 4.93, z + 6.14, .18, .58, .14, pick(C.vermilion), { jitter: .02 });
        voxel(x + bi, 4.81, z + 6.17, .30, .12, .18, pick(C.gold), { jitter: .02 });
      }
      for (const sz of [-1, 1]) {
        voxel(x, 4.82, z + sz * 5.98, 14.55, .14, .10, pick(C.gold), { jitter: .02 });
        voxel(x, 5.16, z + sz * 5.83, 12.7, .16, .12, 0x2c3b3c, { jitter: .03 });
      }
      for (let bi = -5.9; bi <= 5.9; bi += 1.18) {
        voxel(x + bi, 5.1, z + 5.92, .28, .42, .16, rand() < .3 ? pick(C.gold) : pick(C.vermilion), { jitter: .03 });
      }
      for (let sx = -6.2; sx <= 6.2; sx += 1.35) {
        voxel(x + sx, 5.75, z + 4.8, .22, .65, .22, pick(C.stoneDark), { jitter: .03 });
        voxel(x + sx, 6.22, z + 4.8, .34, .12, .38, pick(C.stone), { jitter: .03 });
      }

      const floors = [
        [7.38, 8.6, 8.6, 4.2],
        [12.52, 7.4, 7.4, 3.42],
        [16.72, 6.25, 6.25, 3.05],
        [20.50, 5.05, 5.05, 2.75],
        [23.77, 3.72, 3.72, 2.42]
      ];
      floors.forEach(([y, w, d, h], i) => {
        addPagodaTier(x, z, y, w, d, h, i);
        addRoof(x, z, y + h + .27, w, d, i);
      });

      const spireBase = 26.6;
      voxel(x, spireBase + .65, z, 2.25, 1.3, 2.25, pick(C.gold), { jitter: .03 });
      voxel(x, spireBase + 1.4, z, 1.65, .45, 1.65, pick(C.tealRoof), { jitter: .02 });
      voxel(x, spireBase + 2.1, z, 2.35, .25, 2.35, pick(C.gold), { jitter: .02 });
      for (let i = 0; i < 7; i++) {
        voxel(x, spireBase + 2.8 + i * .58, z, 1 - i * .08, .09, 1 - i * .08,
          i % 2 ? pick(C.goldLight) : pick(C.gold), { jitter: .02 });
      }
      voxel(x, spireBase + 7.0, z, .34, 3.7, .34, pick(C.gold), { jitter: .03 });
      glow(x, spireBase + 10.2, z, .72, .72, .72, 0xffda83);
      voxel(x, spireBase + 10.15, z, .96, .96, .96, pick(C.goldLight), { jitter: .02, ry: .45 });
      for (const angle of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
        voxel(x + Math.cos(angle) * 1.05, spireBase + 9.45, z + Math.sin(angle) * 1.05,
          .72, .16, .22, pick(C.gold), { ry: -angle, jitter: .02 });
      }
      voxel(x, spireBase + 11.3, z, .18, 1.2, .18, pick(C.vermilionLight), { jitter: .02 });

      for (const side of [-1, 1]) {
        const gx = x + side * 4.15, gz = z + 6.35;
        voxel(gx, .62, gz, 1.25, .3, 1.25, pick(C.stoneDark), { jitter: .03 });
        voxel(gx, 1.37, gz, .8, .92, .72, pick(C.stone), { jitter: .03 });
        voxel(gx, 2.03, gz + .28, .62, .54, .66, pick(C.stone), { jitter: .03 });
        voxel(gx, 2.2, gz - .38, .12, .38, .12, pick(C.vermilion), { jitter: .02 });
        voxel(gx, 2.2, gz + .68, .12, .38, .12, pick(C.vermilion), { jitter: .02 });
        glow(gx + .19, 2.2, gz + .55, .10, .10, .04, 0xf3c66f);
        glow(gx - .19, 2.2, gz + .55, .10, .10, .04, 0xf3c66f);
        voxel(gx, 3.35, gz + .02, .12, 1.2, .12, pick(C.woodDark), { jitter: .02 });
      }
    }

    // -------------------------------------------------------------------------
    // Trees, shrubs and blossoms
    // -------------------------------------------------------------------------
    function addBranch(start, end, radius, palette) {
      const steps = Math.max(1, Math.ceil(start.distanceTo(end) / .78));
      for (let i = 0; i <= steps; i++) {
        const p = start.clone().lerp(end, i / steps);
        const r = Math.max(.22, radius * (1 - (i / steps) * .42));
        voxel(p.x, p.y, p.z, r, r, r, col(palette), { jitter: .08 });
      }
    }

    function addCherryTree(cx, cz, height, canopyR, style = "round", opts = {}) {
      const trunkColor = style === "weeping" ? [0x463124, 0x5c4030, 0x714a36] : C.wood;
      const baseY = opts.baseY == null ? terrainHeight(cx, cz) : opts.baseY;
      const groundY = baseY == null ? 0 : baseY + .45;
      let p = new THREE.Vector3(cx, groundY, cz);
      for (let i = 0; i < height; i++) {
        const bend = Math.sin(i * 1.4 + cx * .3) * .34;
        p.x += bend;
        p.y += 1;
        voxel(p.x, p.y, p.z, 1.35 - i * .04, 1.05, 1.35 - i * .04, col(trunkColor), { jitter: .08 });
        if (rand() < .14) {
          voxel(p.x + rr(-.62, .62), p.y + rr(-.4, .4), p.z + rr(-.62, .62),
            .35, .22, .35, pick(C.mossLight), { jitter: .03 });
        }
      }
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * Math.PI * 2 + rr(-.2, .2);
        voxel(cx + Math.cos(a) * rr(.7, 1.7), groundY + rr(.08, .3), cz + Math.sin(a) * rr(.7, 1.7),
          rr(.35, .7), rr(.18, .38), rr(.35, .7), col(trunkColor), { jitter: .05 });
      }
      const top = p.clone();
      const branches = [
        new THREE.Vector3(-canopyR * .8, .3, 0), new THREE.Vector3(canopyR * .8, -.15, .3),
        new THREE.Vector3(.15, .14, -canopyR * .75), new THREE.Vector3(-.15, .45, canopyR * .68),
        new THREE.Vector3(-canopyR * .35, -.1, canopyR * .45), new THREE.Vector3(canopyR * .45, .72, -canopyR * .35)
      ];
      branches.forEach((off, i) => {
        const from = top.clone().add(new THREE.Vector3(0, -1.5 + i * .35, 0));
        const mid = from.clone().add(off.clone().multiplyScalar(.58)).add(new THREE.Vector3(0, .8, 0));
        addBranch(from, mid, .62, trunkColor);
        addBranch(mid, top.clone().add(off).add(new THREE.Vector3(0, 1.45, 0)), .42, trunkColor);
      });

      const centers = [
        new THREE.Vector3(cx, top.y + 2.45, cz),
        new THREE.Vector3(cx - canopyR * .58, top.y + 1.65, cz + .45),
        new THREE.Vector3(cx + canopyR * .54, top.y + 1.95, cz - .55),
        new THREE.Vector3(cx + .25, top.y + 3.25, cz - .15),
        new THREE.Vector3(cx + canopyR * .25, top.y + 2.7, cz + canopyR * .55)
      ];
      const pale = opts.pale || style === "pale";
      const palette = pale
        ? [0xfff4f8, 0xffe9f1, 0xfbd7e4, 0xf8c9d9, 0xffddea]
        : (style === "weeping"
          ? [0xf4b2c9, 0xe9a2bd, 0xf8cada, 0xe293b4, 0xffe5ed]
          : (rand() < .42 ? [0xf4b2c9, 0xf4b2c9, 0xf8cada, 0xe293b4, 0xffe5ed, 0xd880a6] : C.cherry));
      const blossom = (up, rad) => {
        if (up > .32) return rand() < .46 ? pick(C.cherryPale) : pick(palette);
        if (up < -.12) return rand() < .38 ? pick(C.cherryUmbra) : pick(palette);
        if (rad > .82) return rand() < .24 ? pick(C.cherryPale) : pick(palette);
        return pick(palette);
      };

      centers.forEach((c0, ci) => {
        const rx = canopyR * (ci === centers.length - 1 ? .66 : rr(.68, .92));
        const ry = canopyR * rr(.50, .68);
        const rz = canopyR * rr(.70, .92);
        const step = .72;
        for (let ix = -rx; ix <= rx; ix += step) {
          for (let iy = -ry; iy <= ry; iy += step) {
            for (let iz = -rz; iz <= rz; iz += step) {
              const rad = Math.pow(ix / rx, 2) + Math.pow(iy / ry, 2) + Math.pow(iz / rz, 2);
              if (rad < 1 && rand() < .62) {
                const sz = rr(.62, 1.02);
                voxel(c0.x + ix + rr(-.2, .2), c0.y + iy + rr(-.2, .2), c0.z + iz + rr(-.2, .2),
                  sz, sz * rr(.72, .92), sz, blossom(iy / ry, rad), { jitter: .08 });
              }
            }
          }
        }
      });

      // Outer tufts break up the sphere into a fluffier, more natural canopy.
      const tufts = Math.round(canopyR * canopyR * 5.2);
      for (let i = 0; i < tufts; i++) {
        const theta = rand() * Math.PI * 2;
        const phi = Math.acos(rr(-1, 1));
        const r = canopyR * rr(.72, 1.18);
        const px = cx + Math.sin(phi) * Math.cos(theta) * r;
        const py = top.y + 2.5 + Math.cos(phi) * r * .67;
        const pz = cz + Math.sin(phi) * Math.sin(theta) * r;
        const sz = rr(.24, .62);
        voxel(px, py, pz, sz, sz * rr(.65, .95), sz,
          rand() < .3 ? pick(C.cherryPale) : rand() < .16 ? pick(C.cherryUmbra) : pick(palette), { jitter: .035 });
      }

      // Blossom bunches make the canopy read as cherry rather than cotton.
      const count = Math.floor(canopyR * canopyR * 3.4);
      for (let i = 0; i < count; i++) {
        const a = rand() * Math.PI * 2;
        const r = Math.pow(rand(), .64) * canopyR * 1.2;
        const yy = top.y + rr(.1, canopyR * .86);
        const bx = cx + Math.cos(a) * r;
        const bz = cz + Math.sin(a) * r;
        const sz = rr(.20, .45);
        voxel(bx + rr(-.35, .35), yy, bz + rr(-.35, .35), sz, sz * .65, sz,
          rand() < .30 ? 0xfff3f7 : rand() < .18 ? pick(C.cherryUmbra) : col(palette), { jitter: .02 });
        if (rand() < .35) {
          voxel(bx + .34, yy - .2, bz + .12, sz * .8, sz * .5, sz * .8,
            rand() < .5 ? pick(C.cherryPale) : pick(palette), { jitter: .02 });
        }
      }

      // Drooping sprays of blossom, longest on weeping cherries.
      const droops = style === "weeping" ? 42 : Math.round(canopyR * 3.1);
      for (let i = 0; i < droops; i++) {
        const a = rand() * Math.PI * 2;
        const r = canopyR * rr(.72, 1.07);
        const len = style === "weeping" ? rr(1.6, 5.2) : rr(.8, 2.6);
        const px = cx + Math.cos(a) * r;
        const pz = cz + Math.sin(a) * r;
        const colr = rand() < .42 ? pick(C.cherryPale) : pick(palette);
        voxel(px, top.y - len * .35, pz, .24, len, .24, colr, { jitter: .04 });
        for (let k = 1; k <= 2; k++) {
          voxel(px + rr(-.18, .18), top.y - len * .35 - k * .58, pz + rr(-.18, .18),
            .28, .32, .28, rand() < .3 ? pick(C.cherryPale) : colr, { jitter: .02 });
        }
      }
    }

    function addMaple(cx, cz, size = 1) {
      const h = terrainHeight(cx, cz);
      const gy = h == null ? 0 : h + .45;
      let x = cx;
      for (let i = 0; i < Math.round(7 * size); i++) {
        x += Math.sin(i * .7) * .22;
        voxel(x, gy + i * .9 * size, cz, (1.05 - i * .05) * size, .9 * size, (1.05 - i * .05) * size,
          col(C.wood), { jitter: .08 });
      }
      const center = new THREE.Vector3(cx, gy + 6.2 * size, cz);
      const extent = Math.ceil(4.2 * size);
      for (let ix = -extent; ix <= extent; ix++) {
        for (let iy = -Math.ceil(2.7 * size); iy <= Math.ceil(2.7 * size); iy++) {
          for (let iz = -extent; iz <= extent; iz++) {
            if (Math.pow(ix / (4.2 * size), 2) + Math.pow(iy / (2.7 * size), 2) + Math.pow(iz / (4.2 * size), 2) < 1 && rand() < .58) {
              voxel(center.x + ix, center.y + iy, center.z + iz,
                rr(.85, 1.25) * size, rr(.78, 1.2) * size, rr(.85, 1.25) * size,
                rand() < .13 ? 0xf8c05e : col(C.maple), { jitter: .08 });
            }
          }
        }
      }
      for (let i = 0; i < Math.round(42 * size * size); i++) {
        const a = rand() * Math.PI * 2, r = rr(2.6, 5.3) * size;
        voxel(cx + Math.cos(a) * r, center.y + rr(-1, 3), cz + Math.sin(a) * r,
          rr(.18, .42) * size, rr(.2, .38) * size, rr(.18, .42) * size,
          rand() < .12 ? 0xf3d98b : col(C.maple), { jitter: .03 });
      }
    }

    function addPine(cx, cz) {
      const h = terrainHeight(cx, cz);
      const gy = h == null ? 0 : h + .45;
      for (let i = 0; i < 9; i++) {
        voxel(cx + Math.sin(i * .55) * .25, gy + i * .85, cz, .85 - i * .03, .9, .85 - i * .03,
          col(C.woodDark), { jitter: .07 });
      }
      const pads = [
        [cx, gy + 5.0, cz, 4.8], [cx - 1.3, gy + 6.6, cz + .4, 4.0],
        [cx + 1.2, gy + 8.0, cz - .4, 3.35], [cx, gy + 9.5, cz, 2.9]
      ];
      for (const [px, py, pz, r] of pads) {
        for (let ix = -r; ix <= r; ix++) {
          for (let iz = -r; iz <= r; iz++) {
            if (Math.hypot(ix, iz) < r && rand() < .72) {
              const shade = rand() < .19 ? pick([0x315c4c, 0x43705a]) : pick([0x315d4e, 0x456f58, 0x57825f]);
              voxel(px + ix, py + rr(-.25, .25), pz + iz, rr(.75, 1.25), rr(.32, .65), rr(.75, 1.25), shade, { jitter: .06 });
            }
          }
        }
      }
    }

    function addMiniPine(cx, cy, cz, scale = 1) {
      for (let i = 0; i < 7; i++) {
        voxel(cx + Math.sin(i * .55) * .18 * scale, cy + i * .62 * scale, cz,
          .52 * scale, .68 * scale, .52 * scale, col(C.woodDark), { jitter: .06 });
      }
      const pads = [[0, 3.1, 0, 2.4], [-.8, 4.1, .3, 1.9], [.7, 5.1, -.25, 1.55], [0, 6.1, 0, 1.15]];
      for (const [px, py, pz, r0] of pads) {
        const r = r0 * scale;
        for (let ix = -r; ix <= r; ix += .52) {
          for (let iz = -r; iz <= r; iz += .52) {
            if (Math.hypot(ix, iz) < r && rand() < .76) {
              voxel(cx + px * scale + ix, cy + py * scale + rr(-.1, .1), cz + pz * scale + iz,
                rr(.42, .7) * scale, rr(.2, .36) * scale, rr(.42, .7) * scale,
                pick([0x315d4e, 0x456f58, 0x57825f]), { jitter: .04 });
            }
          }
        }
      }
    }

    function addGinkgo(cx, cz, size = 1) {
      const h = terrainHeight(cx, cz);
      const gy = h == null ? 0 : h + .45;
      for (let i = 0; i < 9; i++) {
        voxel(cx + Math.sin(i * .4) * .28, gy + i * .86 * size, cz,
          .98 * size, .88 * size, .98 * size, col(C.wood), { jitter: .07 });
        if (i > 3 && rand() < .35) {
          voxel(cx + rr(-.7, .7), gy + i * .86 * size, cz + rr(-.7, .7),
            .3 * size, .2 * size, .3 * size, pick(C.mossLight), { jitter: .03 });
        }
      }
      for (let level = 0; level < 8; level++) {
        const r = (4.1 - Math.abs(level - 4) * .55) * size;
        const cy = gy + (4.6 + level * .82) * size;
        for (let ix = -r; ix <= r; ix += .8) {
          for (let iz = -r; iz <= r; iz += .8) {
            if (Math.hypot(ix, iz) < r && rand() < .58) {
              voxel(cx + ix + rr(-.15, .15), cy + rr(-.28, .28), cz + iz + rr(-.15, .15),
                rr(.62, 1.02) * size, rr(.58, .96) * size, rr(.62, 1.02) * size,
                rand() < .14 ? 0xffefaa : col(C.ginkgo), { jitter: .07 });
            }
          }
        }
      }
      for (let i = 0; i < 38 * size; i++) {
        const a = rand() * Math.PI * 2, r = rr(2.2, 5.6) * size;
        voxel(cx + Math.cos(a) * r, gy + rr(6.2, 11.8) * size, cz + Math.sin(a) * r,
          rr(.16, .34) * size, rr(.18, .3) * size, rr(.16, .34) * size,
          rand() < .16 ? 0xfff2ba : col(C.ginkgo), { jitter: .03 });
      }
    }

    function addAzalea(cx, cz, radius, palette) {
      const h = terrainHeight(cx, cz);
      const gy = h == null ? .4 : h + .45;
      for (let ix = -Math.ceil(radius * 1.25); ix <= Math.ceil(radius * 1.25); ix++) {
        for (let iy = 0; iy <= Math.ceil(radius * .8); iy++) {
          for (let iz = -Math.ceil(radius * 1.25); iz <= Math.ceil(radius * 1.25); iz++) {
            const d = Math.pow(ix / (radius * 1.25), 2) + Math.pow(iy / (radius * .8), 2) + Math.pow(iz / (radius * 1.25), 2);
            if (d < 1 && rand() < .42) {
              const bloom = rand() < .36;
              voxel(cx + ix + rr(-.15, .15), gy + iy + .2, cz + iz + rr(-.15, .15),
                rr(.6, 1.05), rr(.42, .85), rr(.6, 1.05),
                bloom ? col(palette) : col(rand() < .28 ? C.mossLight : C.grass), { jitter: .05 });
            }
          }
        }
      }
    }

    function addMushrooms(cx, cz) {
      const h = terrainHeight(cx, cz);
      if (h == null) return;
      for (let i = 0; i < 8; i++) {
        const x = cx + rr(-1.6, 1.6), z = cz + rr(-1.4, 1.4);
        const stemH = rr(.22, .62);
        const s = rr(.55, 1.05);
        voxel(x, h + .3 + stemH, z, .13 * s, stemH, .13 * s, 0xf0dfbf, { jitter: .02 });
        voxel(x, h + .3 + stemH * 1.7, z, .48 * s, .22 * s, .48 * s, col(C.fungi), { jitter: .03 });
        if (rand() < .62) voxel(x + .12, h + .3 + stemH * 1.72, z - .08, .08, .08, .08, 0xfff3dd, { jitter: .01 });
      }
    }

    function addPondIsland(x, z, scale = 1, tree = "pine") {
      const s = scale;
      for (let ix = -3; ix <= 3; ix += .62) {
        for (let iz = -3; iz <= 3; iz += .62) {
          for (let iy = -1; iy <= 1; iy += .6) {
            const d = Math.pow(ix / 3.2, 2) + Math.pow(iy / 2.2, 2) + Math.pow(iz / 3.2, 2);
            if (d < 1 && rand() < .82) {
              const moss = iy > -.2 && rand() < .38;
              voxel(x + ix * s, -.2 + iy * s, z + iz * s,
                rr(.55, 1.0) * s, rr(.5, .9) * s, rr(.55, 1.0) * s,
                moss ? col(C.moss) : pick(rand() < .3 ? C.stoneDark : C.stone), { jitter: .06 });
            }
          }
        }
      }
      voxel(x, .75 * s, z, 2.7 * s, .24 * s, 2.7 * s, 0x6f8f52, { jitter: .03 });
      voxel(x + 1.7 * s, .76 * s, z - .5 * s, .3 * s, .7 * s, .3 * s, pick([0x603f28, 0x77503b]), { jitter: .02 });
      glow(x + 1.7 * s, 1.28 * s, z - .5 * s, .42 * s, .3 * s, .42 * s, 0xffc66e);
      voxel(x + 1.7 * s, 1.46 * s, z - .5 * s, .58 * s, .16 * s, .58 * s, pick(C.stone), { jitter: .03 });
      if (tree === "pine") addMiniPine(x - 1.1 * s, .9 * s, z + .35 * s, .68 * s);
      if (tree === "pine") {
        for (let i = 0; i < 8; i++) {
          voxel(x - 1.1 * s + rr(-1.8, 1.8), .95 * s + rr(-.2, 1.4) * s, z + .35 * s + rr(-1.8, 1.8),
            rr(.16, .36), rr(.14, .3), rr(.16, .36), pick(C.mossLight), { jitter: .03 });
        }
      }
    }

    function addBamboo(cx, cz, count) {
      for (let i = 0; i < count; i++) {
        const x = cx + rr(-3.4, 3.4);
        const z = cz + rr(-2.6, 2.6);
        const h = terrainHeight(x, z);
        if (h == null) continue;
        const height = rr(7.5, 13.5);
        const leanX = rr(-.8, .8), leanZ = rr(-.8, .8);
        for (let yy = 0; yy < height; yy += 1.1) {
          const px = x + leanX * (yy / height), pz = z + leanZ * (yy / height);
          voxel(px, h + .4 + yy, pz, .42, 1.15, .42,
            yy % 2 > 1 ? pick(C.bamboo) : pick([0x53683b, 0x8b9e57]), { jitter: .05 });
          if (yy % 3.2 < 1) {
            voxel(px + .28, h + .4 + yy + .1, pz, .18, .13, .18, 0xc7b56b, { jitter: .02 });
          }
        }
        const topY = h + .4 + height;
        for (let leaf = 0; leaf < 16; leaf++) {
          const angle = rand() * Math.PI * 2;
          const rad = rr(1.3, 3.4);
          voxel(x + leanX + Math.cos(angle) * rad, topY + rr(-1.3, 1.5), z + leanZ + Math.sin(angle) * rad,
            rr(.2, .35), rr(.18, .32), rr(.55, 1.15), pick([0x6f8b4b, 0x8ea955, 0x5b7c40]), { jitter: .04 });
        }
      }
    }

    function addShrub(cx, cz, radius, palette) {
      const h = terrainHeight(cx, cz);
      const gy = h == null ? .5 : h + .55;
      for (let ix = -Math.ceil(radius); ix <= Math.ceil(radius); ix++) {
        for (let iy = 0; iy <= Math.ceil(radius * 1.2); iy++) {
          for (let iz = -Math.ceil(radius); iz <= Math.ceil(radius); iz++) {
            if (Math.pow(ix / radius, 2) + Math.pow(iy / (radius * 1.2), 2) + Math.pow(iz / radius, 2) < 1 && rand() < .47) {
              const isBloom = rand() < .15;
              voxel(cx + ix, gy + iy, cz + iz, rr(.65, 1.15), rr(.65, 1.05), rr(.65, 1.15),
                isBloom ? col(palette) : col(rand() < .25 ? C.moss : C.grass), { jitter: .06 });
            }
          }
        }
      }
    }

    function addBoulder(cx, cy, cz, rx, ry, rz, mossy = true) {
      for (let ix = -Math.ceil(rx); ix <= Math.ceil(rx); ix++) {
        for (let iy = -Math.ceil(ry); iy <= Math.ceil(ry); iy++) {
          for (let iz = -Math.ceil(rz); iz <= Math.ceil(rz); iz++) {
            const d = Math.pow(ix / rx, 2) + Math.pow(iy / ry, 2) + Math.pow(iz / rz, 2);
            if (d < 1 && rand() < .9) {
              const isMoss = mossy && iy > ry * .05 && rand() < .29;
              voxel(cx + ix, cy + iy, cz + iz, rr(.8, 1.2), rr(.8, 1.2), rr(.8, 1.2),
                isMoss ? col(C.moss) : (rand() < .28 ? pick(C.stoneDark) : pick(C.stone)), { jitter: .08 });
            }
          }
        }
      }
    }

    function addFlowers() {
      const flowers = [
        [-12.8, 15.4, [0xffcf6a, 0xf6b94d]], [-8.8, 14.8, [0xdca8ee, 0xb77bd5]],
        [11.4, 16.0, [0xf49db8, 0xffd2e2]], [4.7, 16.7, [0xf5d88e, 0xffe8ad]],
        [-13.3, 4.3, [0xa8c0f0, 0x7f9bd0]], [14.6, 7.8, [0xf09a7e, 0xf5b693]],
        [-4.9, -1.8, [0xffd590, 0xe7b75f]], [10.4, -4.1, [0xc0a6ed, 0xe1c0f4]],
        [-16.2, 9.8, [0xf6bed0, 0xffffff]]
      ];
      for (const [x, z, palette] of flowers) {
        const base = terrainHeight(x, z);
        if (base == null) continue;
        const count = ri(7, 13);
        for (let i = 0; i < count; i++) {
          const px = x + rr(-1.7, 1.7), pz = z + rr(-1.1, 1.1);
          const h = terrainHeight(px, pz);
          if (h == null) continue;
          const stemH = rr(1.1, 3.3);
          voxel(px, h + .2 + stemH / 2, pz, .12, stemH, .12, pick([0x6b8b4c, 0x7e9e55]), { jitter: .03 });
          const c = pick(palette);
          const y = h + .25 + stemH;
          voxel(px - .28, y, pz, .58, .18, .58, c, { jitter: .02 });
          voxel(px + .28, y, pz, .58, .18, .58, c, { jitter: .02 });
          voxel(px, y, pz - .28, .58, .18, .58, c, { jitter: .02 });
          voxel(px, y, pz + .28, .58, .18, .58, c, { jitter: .02 });
          if (rand() < .62) {
            voxel(px, y + .16, pz, .25, .22, .25, 0xffefb0, { jitter: .01 });
          }
        }
      }
      for (let i = 0; i < 120; i++) {
        const x = rr(-20, 20), z = rr(-14, 19);
        const h = terrainHeight(x, z);
        if (h == null || isPondWater(x, z)) continue;
        voxel(x, h + .55, z, rr(.18, .35), rr(.2, .45), rr(.18, .35),
          pick([0xf6d887, 0xf8a4be, 0xb99ae4, 0xffffff, 0x7fa3e0]), { jitter: .02 });
      }
    }

    function addGrassTufts() {
      for (let i = 0; i < 175; i++) {

        const h = terrainHeight(x, z);
        if (h == null || isPondWater(x, z) || pondField(x, z) < 1.15) continue;
        const yy = h + .46;
        voxel(x, yy + .35, z, .11, rr(.65, 1.4), .11, col(C.grass), { jitter: .04 });
        if (rand() < .45) {
          voxel(x + .24, yy + .28, z - .08, .09, rr(.55, 1.1), .09, pick(C.moss), { jitter: .04 });
          voxel(x - .2, yy + .24, z + .12, .08, rr(.5, 1.0), .08, pick(C.grass), { jitter: .04 });
        }
      }
    }

    function addShoreDetails() {
      for (let i = 0; i < 118; i++) {

      for (let i = 0; i < 22; i++) {
        const a = rand() * Math.PI * 2;
        const x = POND.x + Math.cos(a) * POND.rx * 1.08;
        const z = POND.z + Math.sin(a) * POND.rz * 1.08;
        const h = terrainHeight(x, z);
        if (h == null) continue;
        const height = rr(1.2, 2.8);
        for (let j = 0; j < 3; j++) {
          voxel(x + rr(-.2, .2), h + .5 + height * .45, z + rr(-.15, .15),

    function addCascade(cx, cz, topY) {
      const rocks = [
        [cx + 1.1, 2.1, cz - 1.0, 2.1, 2.5, 1.7],
        [cx - 1.6, 1.4, cz - .6, 1.7, 1.6, 1.5],
        [cx + 2.3, .8, cz + .8, 1.3, 1.1, 1.2]
      ];
      for (const [x, y, z, sx, sy, sz] of rocks) {
        for (let ix = -1; ix <= 1; ix += .42) {
          for (let iy = -1; iy <= 1; iy += .42) {
            for (let iz = -1; iz <= 1; iz += .42) {
              if (ix * ix + iy * iy + iz * iz < .86) {
                const yy = y + iy * sy / 2;
                voxel(x + ix * sx / 2, yy, z + iz * sz / 2, sx * .34, sy * .34, sz * .34,
                  yy > y && rand() < .42 ? pick(C.moss) : pick(sy > 2 && iy > 0 ? C.stone : C.stoneDark),
                  { jitter: .08 });
              }
            }
          }
        }
      }
      for (let i = 0; i < 18; i++) {
        const yy = topY - i * .34;
        water(cx - .1 + Math.sin(i * .25) * .18, yy, cz - .7, .9 - i * .026, .42, .15,
          i % 4 === 0 ? 0xe9fff9 : pick([0x6fbdb6, 0x9edbd0, 0x4f9b9b]), i * .65);
      }
      for (let i = 0; i < 16; i++) {
        voxel(cx + rr(-1.8, 1.9), -1.02 + rr(0, .15), cz + rr(-1.1, 1.4),
          rr(.14, .42), rr(.04, .14), rr(.12, .34), pick(C.waterFoam), { jitter: .02 });
      }
      for (let i = 0; i < 9; i++) {
        const a = rand() * Math.PI * 2;
        voxel(cx + Math.cos(a) * rr(.4, 1.8), topY + rr(-.2, .8), cz - .7 + Math.sin(a) * rr(.3, 1.0),
          .08, rr(.7, 1.7), .08, pick([0x617d44, 0x799254]), { jitter: .03 });
      }
    }

    function addZenGarden(cx, cz, halfW, halfD) {
      const h = terrainHeight(cx, cz);
      if (h == null) return;
      for (let ix = -halfW; ix <= halfW; ix += .62) {
        for (let iz = -halfD; iz <= halfD; iz += .62) {
          if (Math.pow(ix / halfW, 2) + Math.pow(iz / halfD, 2) < 1) {
            voxel(cx + ix, h + .16, cz + iz, .7, .13, .7, col(C.gravel), { jitter: .03 });
          }
        }
      }
      for (let k = 0; k < 9; k++) {
        const z = cz - halfD * .85 + k * (halfD * 1.7 / 8);
        for (let ix = -halfW * .82; ix <= halfW * .82; ix += .4) {
          const bow = Math.sin(ix / halfW * Math.PI) * .18;
          voxel(cx + ix, h + .24, z + bow, .27, .05, .07, rand() < .5 ? 0xe4dcc4 : 0xb3aa92, { jitter: .02 });
        }
      }
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2;
        const x = cx + Math.cos(a) * (halfW + .2), z = cz + Math.sin(a) * (halfD + .2);
        const hh = terrainHeight(x, z);
        if (hh == null) continue;
        voxel(x, hh + .5, z, rr(.4, .8), rr(.32, .65), rr(.4, .8), pick(rand() < .45 ? C.moss : C.stoneDark), { jitter: .05 });
      }
      addBoulder(cx - halfW * .35, h + .48, cz - halfD * .2, 1.1, .65, 1.0, true);
      addBoulder(cx + halfW * .4, h + .42, cz + halfD * .18, .9, .52, .8, true);
    }

    function addFloatingIsland(cx, cy, cz, size, kind = "pine") {
      const R = size * 3.7;
      for (let ix = -R; ix <= R; ix += .82) {
        for (let iz = -R; iz <= R; iz += .82) {
          const d = Math.pow(ix / R, 2) + Math.pow(iz / (R * .92), 2);
          if (d < 1 - rr(0, .1)) {
            voxel(cx + ix, cy + rr(-.16, .08), cz + iz,
              rr(.8, 1.3), rr(.24, .42), rr(.8, 1.3),
              rand() < .25 ? col(C.mossLight) : col(C.grass), { jitter: .06 });
          }
        }
      }
      for (let level = 0; level < 7; level++) {
        const rr0 = R * (1 - level * .135);
        if (rr0 < 1.2) break;
        for (let ix = -rr0; ix <= rr0; ix += 1.1) {
          for (let iz = -rr0; iz <= rr0; iz += 1.1) {
            const d = Math.pow(ix / rr0, 2) + Math.pow(iz / (rr0 * .9), 2);
            if (d < 1.02 - rr(0, .18)) {
              voxel(cx + ix, cy - 1 - level * 1.15, cz + iz,
                rr(.8, 1.5), rr(.8, 1.4), rr(.8, 1.5),
                rand() < .34 ? pick(C.moss) : pick(rand() < .35 ? C.soil : C.stoneDark), { jitter: .08 });
            }
          }
        }
      }
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2;
        const len = rr(2.0, 7.5);
        voxel(cx + Math.cos(a) * R * rr(.7, .98), cy - len * .62, cz + Math.sin(a) * R * rr(.7, .98),
          .18, len, .18, pick([0x4b6939, 0x62824b, 0x789255]), { jitter: .04 });
        if (rand() < .45) {
          voxel(cx + Math.cos(a) * R * rr(.8, 1.05), cy - rr(.6, 2.0), cz + Math.sin(a) * R * rr(.8, 1.05),
            .25, rr(.8, 2.2), .25, rand() < .4 ? col(C.cherry) : pick([0x62824b, 0x789255]), { jitter: .03 });
        }
      }
      if (kind === "cherry") {
        for (let i = 0; i < 5; i++) {
          voxel(cx + rr(-R * .35, R * .35), cy + 1.6 + i * .75, cz + rr(-R * .25, R * .25),
            .55 - i * .04, .72, .55 - i * .04, pick([0x5c4030, 0x714a36]), { jitter: .06 });
        }
        for (let c = 0; c < 3; c++) {
          const ox = cx + rr(-R * .5, R * .5), oy = cy + 5.0 + rr(-.4, .9), oz = cz + rr(-R * .5, R * .5);
          for (let ix = -2.1; ix <= 2.1; ix += .72) {
            for (let iy = -1.1; iy <= 1.1; iy += .72) {
              for (let iz = -2.1; iz <= 2.1; iz += .72) {
                if (ix * ix / 4.4 + iy * iy / 1.4 + iz * iz / 4.4 < 1 && rand() < .55) {
                  voxel(ox + ix, oy + iy, oz + iz,
                    rr(.45, .8), rr(.4, .75), rr(.45, .8), pick(C.cherry), { jitter: .05 });
                }
              }
            }
          }
        }
      } else {
        addMiniPine(cx - .9, cy + .45, cz + .3, .65 * size);
        addMiniPine(cx + 1.2 * size, cy + .4, cz - .9, .48 * size);
        for (let i = 0; i < 8; i++) {
          voxel(cx + rr(-R * .5, R * .5), cy + rr(.7, 1.7), cz + rr(-R * .5, R * .5),
            rr(.22, .4), rr(.3, .65), rr(.22, .4), pick(C.grass), { jitter: .03 });
        }
      }
      if (kind === "torii") {
        for (const sx of [-1.5, 1.5]) {
          voxel(cx + sx, cy + 2.0, cz, .52, 3.1, .55, pick(C.vermilion), { jitter: .03 });
        }
        voxel(cx, cy + 3.7, cz, 4.0, .34, .65, pick(C.vermilion), { jitter: .02 });
        voxel(cx, cy + 4.25, cz, 4.8, .28, .78, pick(C.vermilionLight), { jitter: .02 });
      }
      water(cx + R * .58, cy - 7.0, cz + R * .16, .8, 4.2, .42, 0x8fd8ce, 1.2);
    }

    function addPetalCarpet() {

      for (const [cx, cz, r] of trees) {

    // -------------------------------------------------------------------------
    // Clouds
    // -------------------------------------------------------------------------
    function addCloud(cx, cy, cz, scale) {
      const lobes = [
        [0, 0, 0, 5.2], [-4.4, -.3, .8, 3.6], [4.0, .1, -.7, 3.8],
        [-2.6, 1.5, -.4, 3.0], [2.1, 1.7, .7, 2.8], [7.0, -.8, 1.0, 2.5]
      ];
      for (const [ox, oy, oz, rad] of lobes) {
        const r = rad * scale;
        for (let ix = -Math.ceil(r); ix <= Math.ceil(r); ix += 1.2) {
          for (let iy = -Math.ceil(r * .55); iy <= Math.ceil(r * .55); iy += 1.1) {
            for (let iz = -Math.ceil(r); iz <= Math.ceil(r); iz += 1.2) {
              if (Math.pow(ix / r, 2) + Math.pow(iy / (r * .62), 2) + Math.pow(iz / r, 2) < 1
                && rand() < .74) {
                const warm = iy > -r * .2 ? pick([0xfff1db, 0xffe8d4, 0xf8ddd6]) : pick([0xd6d4d6, 0xcccbd2]);
                clouds.push({
                  x: cx + ox + ix, y: cy + oy + iy, z: cz + oz + iz,
                  w: rr(.95, 1.7) * scale, h: rr(.9, 1.6) * scale,
                  d: rr(.95, 1.7) * scale, color: warm, jitter: .025, rx: 0, ry: 0, rz: 0
                });
              }
            }
          }
        }
      }
    }
